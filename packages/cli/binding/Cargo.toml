[package]
name = "vite-plus-cli"
version = "0.2.8"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
rolldown = ["dep:rolldown_binding"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64-simd = { workspace = true }
clap = { workspace = true, features = ["derive"] }
cow-utils = { workspace = true }
fspy = { workspace = true }
rustc-hash = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
petgraph = { workspace = true }
owo-colors = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
vp_command = { workspace = true }
vp_error = { workspace = true }
vp_migration = { workspace = true }
vp_pm_cli = { workspace = true }
vt_path = { workspace = true }
vt_select = { workspace = true }
vp_shared = { workspace = true }
vp_static_config = { workspace = true }
vp_toolchain = { workspace = true }
vt_str = { workspace = true }
vt = { workspace = true }
vt_workspace = { workspace = true }
rolldown_binding = { workspace = true, optional = true, features = ["disable_panic_hook"] }

[build-dependencies]
napi-build = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true
