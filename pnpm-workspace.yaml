overrides:
  rolldown: workspace:rolldown@*
  vite: workspace:@voidzero-dev/vite-plus-core@*
  vite-plus: workspace:vite-plus@*
  rolldown>typescript: ^6.0.0
  # tsdown 0.23.2 selects the dts 0.29 beta, which requires TypeScript 7.1's
  # async API and drops native-preview support. Keep vp pack compatible with
  # stable TypeScript and existing tsgo configurations.
  tsdown@0.23.2>rolldown-plugin-dts: 0.28.8
  '@volar/typescript>typescript@>=7': '-'
  '@volar/language-service>typescript@>=7': '-'
packageExtensions:
  '@rollup/plugin-dynamic-import-vars':
    dependencies:
      '@types/estree': ^1.0.0
  sass-embedded:
    peerDependencies:
      source-map-js: '*'
    peerDependenciesMeta:
      source-map-js:
        optional: true
  '@volar/typescript':
    dependencies:
      '@volar/language-service': 2.4.28
      typescript: ~6.0.3
  '@vue/compiler-core':
    dependencies:
      '@babel/types': ^7.29.8
  '@vue/compiler-sfc':
    dependencies:
      '@babel/types': ^7.29.8
  '@vue/language-core':
    dependencies:
      '@vue/compiler-sfc': ^3.5.0
      typescript: ~6.0.3
  '@volar/language-service':
    dependencies:
      typescript: ~6.0.3
patchedDependencies:
  chokidar@3.6.0: vite/patches/chokidar@3.6.0.patch
  dotenv-expand@13.0.0: vite/patches/dotenv-expand@13.0.0.patch
  sirv@3.0.2: vite/patches/sirv@3.0.2.patch
peerDependencyRules:
  allowAny:
    - vite
    - vite-plus
    - vitest
    - rolldown
  allowedVersions:
    oxc-minify: '*'
    oxlint-tsgolint: '*'
    rolldown: '*'
    vite: '*'
