packages:
  - packages/*
  - rolldown
  - rolldown/packages/rolldown
  - vite
  - vite/packages/vite
catalog:
  '@clack/core': ^1.5.1
  '@e18e/eslint-plugin': ^0.8.1
  '@emnapi/core': 2.0.0-alpha.5
  '@emnapi/runtime': 2.0.0-alpha.5
  '@napi-rs/cli': ^3.10.0
  '@napi-rs/wasm-runtime': ~1.2.5
  '@nkzw/safe-word-list': ^3.1.0
  '@oxc-node/cli': ^1.0.1
  '@oxc-node/core': ^1.0.1
  '@oxc-project/runtime': =0.156.0
  '@oxc-project/types': =0.156.0
  # Kept at the oxlint version by .github/scripts/upgrade-deps.ts
  '@oxlint/plugins': =1.90.0
  '@rolldown/pluginutils': ^1.0.0
  '@tsdown/css': ^0.23.3
  '@tsdown/exe': ^0.23.3
  '@types/cross-spawn': ^6.0.6
  '@types/node': 24.10.3
  '@types/validate-npm-package-name': ^4.0.2
  '@typescript/native-preview': 7.0.0-dev.20260707.2
  '@vitest/browser': 5.0.5
  '@vitest/browser-playwright': 5.0.5
  '@vitest/browser-preview': 5.0.5
  '@vitest/browser-webdriverio': 5.0.0
  '@vitest/mocker': 5.0.5
  '@vitest/pretty-format': 5.0.5
  '@vitest/snapshot': 5.0.5
  '@vitest/spy': 5.0.5
  '@vitest/utils': 5.0.5
  bingo: ^0.13.2
  cac: ^7.0.0
  consola: ^3.4.2
  cross-spawn: ^7.0.5
  detect-indent: ^7.0.2
  detect-newline: ^4.0.1
  emnapi: 2.0.0-alpha.5
  execa: ^9.2.0
  fresh-import: ^0.2.1
  glob: ^13.0.0
  jsonc-parser: ^3.3.1
  # Kept in lockstep with the bundled @tsdown/css by .github/scripts/upgrade-deps.ts
  lightningcss: ^1.33.0
  lint-staged: ^17.6.0
  minimatch: ^10.0.3
  nanotar: ^0.3.0
  oxc-parser: =0.156.0
  oxfmt: =0.75.0
  oxlint: =1.90.0
  oxlint-tsgolint: =7.0.2005
  pathe: ^2.0.3
  picocolors: ^1.1.1
  picomatch: ^4.0.2
  pirates: ^4.0.7
  playwright: ^1.57.0
  remeda: ^2.50.0
  rolldown-plugin-dts: ^0.28.0
  rollup: ^4.63.0
  semver: ^7.8.0
  signal-exit: 4.1.0
  source-map: 0.8.0
  tinyglobby: ^0.2.15
  tsdown: ^0.23.3
  typescript: ~7.0.2
  valibot: 1.5.0
  validate-npm-package-name: ^8.0.0
  verkit: ^0.5.0
  vitest: 5.0.5
  yaml: ^2.9.1
  # Keep generator option schemas compatible with bingo's Zod version.
  zod: ^4.4.3
catalogMode: prefer
ignoreScripts: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@babel/*'
  - '@devframes/*'
  - '@napi-rs/*'
  - '@nkzw/*'
  - '@oxc-node/*'
  - '@oxc-minify/*'
  - '@oxc-parser/*'
  - '@oxc-project/*'
  - '@oxc-resolver/*'
  - '@oxc-transform/*'
  - '@oxfmt/*'
  - '@oxlint-tsgolint/*'
  - '@oxlint/*'
  - '@rolldown/*'
  - '@tsdown/*'
  - '@types/*'
  - '@vitejs/*'
  - '@vitest/*'
  - '@void/*'
  - '@voidzero-dev/*'
  - oxc-minify
  - oxc-parser
  - oxc-transform
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - ast-kit
  - lightningcss
  - lightningcss-*
  - baseline-browser-mapping
  - devframe
  - import-without-cache
  - launch-editor
  - launch-editor-middleware
  - lint-staged
  - logs-sdk
  - rolldown
  - rolldown-plugin-dts
  - tinyexec
  - tsdown
  - tsx
  - unrun
  - verkit
  - vite
  - vitepress
  - vitest
  - vue-virtual-scroller
  - lodash-es@4.18.1
  - vite-plus
  - '@rolldown/binding-*'
  - vitepress-plugin-feedback-tracker@0.2.0-alpha.1
  - es-module-lexer@2.3.0
  - void
  - '@napi-rs/cli'
  - '@napi-rs/wasm-runtime'
  - '@emnapi/*'
  - emnapi
  - '@vitejs/devtools'
  - '@vitejs/devtools-*'
  - resolve.exports@2.0.4
overrides:
  rolldown: workspace:rolldown@*
  vite: workspace:@voidzero-dev/vite-plus-core@*
  vite-plus: workspace:vite-plus@*
  rolldown>typescript: ^6.0.0
  '@volar/typescript>typescript@>=7': '-'
  '@volar/language-service>typescript@>=7': '-'
packageExtensions:
  '@rollup/plugin-dynamic-import-vars':
    dependencies:
      '@types/estree': ^1.0.0
  sass-embedded:
    peerDependencies:
      source-map-js: '*'
    peerDependenciesMeta:
      source-map-js:
        optional: true
  '@volar/typescript':
    dependencies:
      '@volar/language-service': 2.4.28
      typescript: ~6.0.3
  '@vue/compiler-core':
    dependencies:
      '@babel/types': ^7.29.8
  '@vue/compiler-sfc':
    dependencies:
      '@babel/types': ^7.29.8
  '@vue/language-core':
    dependencies:
      '@vue/compiler-sfc': ^3.5.0
      typescript: ~6.0.3
  '@volar/language-service':
    dependencies:
      typescript: ~6.0.3
patchedDependencies:
  chokidar@3.6.0: vite/patches/chokidar@3.6.0.patch
  dotenv-expand@13.0.0: vite/patches/dotenv-expand@13.0.0.patch
  sirv@3.0.2: vite/patches/sirv@3.0.2.patch
peerDependencyRules:
  allowAny:
    - vite
    - vite-plus
    - vitest
    - rolldown
  allowedVersions:
    oxc-minify: '*'
    oxlint-tsgolint: '*'
    rolldown: '*'
    vite: '*'
