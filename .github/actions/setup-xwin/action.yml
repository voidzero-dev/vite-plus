name: Setup cargo-xwin
description: Install the Rust toolchain and cargo-xwin for cross-compiling to x86_64-pc-windows-msvc on Linux, with the MSVC CRT / Windows SDK cached.
inputs:
  cache-key:
    description: setup-rust cache-key prefix; pass a distinct value per caller.
    required: true
  save-cache:
    description: Whether setup-rust should save its cache (usually only on main).
    required: false
    default: 'false'
  tools:
    description: Extra comma-separated taiki-e/install-action tools to install alongside cargo-xwin (e.g. "cargo-nextest").
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/benchmark-setup-rust
      with:
        save-cache: ${{ inputs.save-cache }}
        cache-key: ${{ inputs.cache-key }}
        components: llvm-tools
    - run: rustup target add x86_64-pc-windows-msvc
      shell: bash
    - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
      with:
        tool: ${{ inputs.tools != '' && format('{0},cargo-xwin', inputs.tools) || 'cargo-xwin' }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/cargo-xwin
        key: ${{ env.VP_CI_BENCH_PREFIX }}-cargo-xwin-msvc-17
        lookup-only: ${{ env.VP_CI_BENCH_CACHE_STATE == 'cold' }}
        fail-on-cache-miss: ${{ env.VP_CI_BENCH_CACHE_STATE == 'warm' }}
