name: Build with Upstream Repositories
description: Builds Vite+ with the upstream repositories
inputs:
  target:
    description: The target platform
    required: true
  print-after-build:
    description: Print the output after the build
    required: false
    default: 'false'
  skip-native:
    description: Skip the NAPI binding cache and all native cargo/napi build steps; the native binaries and Cargo metadata must already be in place (e.g. downloaded from the windows-cli-binaries artifact produced by the build-windows-cli job).
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/download-rolldown-binaries
      with:
        github-token: ${{ github.token }}
        target: ${{ inputs.target }}
        upload: 'false'
    - uses: ./.github/actions/compute-native-cache-input-hash
      id: native-cache-inputs
    - name: Compute NAPI binding cache key
      id: cache-key
      shell: bash
      run: |
        DOCS_ORIGIN_HASH=$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(process.env.VITE_PLUS_DOCS_ORIGIN || "https://viteplus.dev").digest("hex").slice(0, 16))')
        echo "key=napi-binding-v3-${INPUTS_TARGET}-${RELEASE_BUILD}-${DEBUG}-${VERSION}-${NPM_TAG}-${DOCS_ORIGIN_HASH}-${{ steps.native-cache-inputs.outputs.hash }}" >> "$GITHUB_OUTPUT"
      env:
        INPUTS_TARGET: ${{ inputs.target }}
    - name: Resolve Rust target directory
      id: rust-target
      shell: bash
      run: echo "dir=${CARGO_TARGET_DIR:-target}" >> $GITHUB_OUTPUT
    - name: Restore NAPI binding cache
      id: cache-restore
      if: (inputs.skip-native != 'true') && env.VP_CI_BENCH_CACHE_STATE == 'warm'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          packages/cli/binding/*.node
          packages/cli/binding/index.js
          packages/cli/binding/index.d.ts
          packages/cli/binding/index.cjs
          packages/cli/binding/index.d.cts
          packages/cli/binding/vite-plus.build-time
          ${{ steps.rust-target.outputs.dir }}/${{ inputs.target }}/release/vp
          ${{ steps.rust-target.outputs.dir }}/${{ inputs.target }}/release/vp.exe
          ${{ steps.rust-target.outputs.dir }}/${{ inputs.target }}/release/vp-shim.exe
          ${{ steps.rust-target.outputs.dir }}/${{ inputs.target }}/release/vp-setup.exe
        key: ${{ env.VP_CI_BENCH_NATIVE_PREFIX }}-${{ steps.cache-key.outputs.key }}
        fail-on-cache-miss: true
    - name: Decide native build
      id: native
      shell: bash
      run: echo "build=${{ inputs.skip-native != 'true' && steps.cache-restore.outputs.cache-hit != 'true' }}" >> "$GITHUB_OUTPUT"
    - name: Brand vite
      shell: bash
      run: pnpm exec tool brand-vite
    - name: Build upstream TypeScript packages
      shell: bash
      run: |
        pnpm --filter rolldown build-node
        pnpm --filter vite build-types
        pnpm --filter "@voidzero-dev/*" build
    - name: Build vite-plus TypeScript for native binding formatting
      if: steps.native.outputs.build == 'true'
      shell: bash
      run: pnpm --filter vite-plus build-ts
    - name: Add musl Rust target
      if: steps.native.outputs.build == 'true' && contains(inputs.target, 'musl')
      shell: bash
      run: rustup target add ${INPUTS_TARGET}
      env:
        INPUTS_TARGET: ${{ inputs.target }}
    - name: Setup zig (musl)
      if: steps.native.outputs.build == 'true' && contains(inputs.target, 'musl')
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: 0.15.2
        use-cache: false
    - name: Install cargo-zigbuild (musl)
      if: steps.native.outputs.build == 'true' && contains(inputs.target, 'musl')
      shell: bash
      run: cargo install --locked --git https://github.com/rust-cross/cargo-zigbuild --rev 7e791b4be71b9870e0abccedf7885486803cd923 cargo-zigbuild
    - name: Build NAPI bindings (Linux gnu)
      shell: bash
      if: steps.native.outputs.build == 'true' && contains(inputs.target, 'linux') && !contains(inputs.target, 'musl')
      run: |
        pnpm --filter=vite-plus build-native --target ${INPUTS_TARGET} --use-napi-cross
      env:
        TARGET_CC: clang
        TARGET_CFLAGS: ${{ contains(inputs.target, 'aarch64') && '-D_BSD_SOURCE' || '' }}
        DEBUG: napi:*
        INPUTS_TARGET: ${{ inputs.target }}
    - name: Build NAPI bindings (Linux musl)
      shell: bash
      if: steps.native.outputs.build == 'true' && contains(inputs.target, 'musl')
      run: |
        pnpm --filter=vite-plus build-native --target ${INPUTS_TARGET} -x
      env:
        TARGET_CC: clang
        TARGET_CFLAGS: ${{ contains(inputs.target, 'aarch64') && '-D_BSD_SOURCE' || '' }}
        DEBUG: napi:*
        INPUTS_TARGET: ${{ inputs.target }}
    - name: Build NAPI bindings (non-Linux targets)
      shell: bash
      if: steps.native.outputs.build == 'true' && !contains(inputs.target, 'linux')
      run: |
        pnpm --filter=vite-plus build-native --target ${INPUTS_TARGET}
      env:
        DEBUG: napi:*
        INPUTS_TARGET: ${{ inputs.target }}
    - name: Build Rust CLI binary (Linux gnu)
      if: steps.native.outputs.build == 'true' && contains(inputs.target, 'linux') && !contains(inputs.target, 'musl')
      shell: bash
      run: |
        pnpm exec napi build --use-napi-cross --target ${INPUTS_TARGET} --release -p vp_global_cli
      env:
        TARGET_CC: clang
        TARGET_CFLAGS: ${{ contains(inputs.target, 'aarch64') && '-D_BSD_SOURCE' || '' }}
        DEBUG: napi:*
        INPUTS_TARGET: ${{ inputs.target }}
    - name: Build Rust CLI binary (Linux musl)
      if: steps.native.outputs.build == 'true' && contains(inputs.target, 'musl')
      shell: bash
      run: |
        pnpm exec napi build -x --target ${INPUTS_TARGET} --release -p vp_global_cli
      env:
        TARGET_CC: clang
        TARGET_CFLAGS: ${{ contains(inputs.target, 'aarch64') && '-D_BSD_SOURCE' || '' }}
        DEBUG: napi:*
        INPUTS_TARGET: ${{ inputs.target }}
    - name: Build Rust CLI binary (non-Linux targets)
      if: steps.native.outputs.build == 'true' && !contains(inputs.target, 'linux')
      shell: bash
      run: cargo build --release --target ${INPUTS_TARGET} -p vp_global_cli
      env:
        INPUTS_TARGET: ${{ inputs.target }}
    - name: Build trampoline shim binary (Windows only)
      if: steps.native.outputs.build == 'true' && contains(inputs.target, 'windows')
      shell: bash
      run: node packages/tools/src/build-trampoline.ts --release --target "${INPUTS_TARGET}"
      env:
        INPUTS_TARGET: ${{ inputs.target }}
    - name: Build installer binary (Windows only)
      if: steps.native.outputs.build == 'true' && contains(inputs.target, 'windows')
      shell: bash
      run: cargo build --release --target ${INPUTS_TARGET} -p vp_installer
      env:
        INPUTS_TARGET: ${{ inputs.target }}
    - name: Save NAPI binding cache
      if: (steps.native.outputs.build == 'true') && env.VP_CI_BENCH_CACHE_STATE == 'cold'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          packages/cli/binding/*.node
          packages/cli/binding/index.js
          packages/cli/binding/index.d.ts
          packages/cli/binding/index.cjs
          packages/cli/binding/index.d.cts
          packages/cli/binding/vite-plus.build-time
          ${{ steps.rust-target.outputs.dir }}/${{ inputs.target }}/release/vp
          ${{ steps.rust-target.outputs.dir }}/${{ inputs.target }}/release/vp.exe
          ${{ steps.rust-target.outputs.dir }}/${{ inputs.target }}/release/vp-shim.exe
          ${{ steps.rust-target.outputs.dir }}/${{ inputs.target }}/release/vp-setup.exe
        key: ${{ env.VP_CI_BENCH_NATIVE_PREFIX }}-${{ steps.cache-key.outputs.key }}
    - name: Build vite-plus TypeScript packages
      shell: bash
      run: |
        pnpm --filter=vite-plus build-ts
      env:
        VP_BUILD_CARGO_METADATA: ${{ inputs.skip-native == 'true' && format('{0}/packages/cli/binding/vite-plus.cargo-metadata.json', github.workspace) || '' }}
    - name: Print output after build
      shell: bash
      if: inputs.print-after-build == 'true'
      run: |
        pnpm vp -h
        pnpm vp run -h
        pnpm vp lint -h
        pnpm vp test -h
        pnpm vp build -h
        pnpm vp fmt -h
