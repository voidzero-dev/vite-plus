name: 'Build and deploy docs'
description: >-
  Build the VitePress docs site (which bundles install.sh / install.ps1 into
  its public assets) and deploy it to a void.app project. Run on a Linux
  runner after checkout. See rfcs/deploy-docs-on-release.md for which
  workflow deploys to which project.

inputs:
  void-project:
    description: 'void.app project to deploy to (e.g. viteplus, viteplus-main).'
    required: true
  void-token:
    description: 'void.app deploy token (pass secrets.VOID_TOKEN).'
    required: true
  site-origin:
    description: >-
      Origin of this deploy when it is not production viteplus.dev
      (e.g. https://main.viteplus.dev). When set, the docs build rewrites the
      https://vite.plus installer URLs to this origin's install scripts.
      Leave empty for production.
    required: false
    default: ''
  remote-cache:
    description: >-
      Vite Task remote cache access: read-write, or read for builds that must
      not upload. read-write requires the caller to grant `id-token: write`.
    required: false
    default: 'read-write'

runs:
  using: 'composite'
  steps:
    - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        # Remote caching is not released yet; use the registry bridge build of
        # https://github.com/voidzero-dev/vite-plus/pull/2842 until it is.
        version: 0.0.0-commit.11393b1a9ec1739c5897fefd418bdb095a34db7e
        cache: true
        working-directory: docs
        # Resolved relative to working-directory.
        cache-dependency-path: pnpm-lock.yaml

    # Vite Task shares the docs build through the remote cache. Uploads
    # authenticate with a GitHub Actions OIDC token.
    - run: vp run build
      shell: bash
      working-directory: docs
      env:
        DOCS_SITE_ORIGIN: ${{ inputs.site-origin }}
        VP_REMOTE_CACHE_URL: https://voidzero-remote-cache.voidzero-docs.workers.dev/projects/vite-plus
        VP_REMOTE_CACHE: ${{ inputs.remote-cache }}

    # void 0.24 requires a platform connection that these deploy jobs do not configure.
    - run: vpx void@0.23.0 deploy --dir docs/.vitepress/dist
      shell: bash
      env:
        VOID_PROJECT: ${{ inputs.void-project }}
        VOID_TOKEN: ${{ inputs.void-token }}
