name: 'Clone Repositories'
description: 'Clone self and upstream repositories'

inputs:
  setup-node:
    description: 'Set to false to keep a caller-provided Node.js with native TypeScript support (for example, on Alpine)'
    required: false
    default: 'true'
  ecosystem-ci-project:
    description: 'The ecosystem ci project to clone'
    required: false
    default: ''

outputs:
  ecosystem-ci-project-path:
    description: 'The path where the ecosystem ci project was cloned'
    value: ${{ steps.ecosystem-ci-project-hash.outputs.ECOSYSTEM_CI_PROJECT_PATH }}

runs:
  using: 'composite'
  steps:
    # Run the bootstrap scripts with native TypeScript support before installing dependencies.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: ${{ inputs.setup-node != 'false' }}
      with:
        node-version-file: .node-version
        package-manager-cache: false

    - name: Validate bootstrap Node.js
      shell: bash
      run: node -e "require('node:assert/strict').ok(process.features.typescript, 'Clone bootstrap requires native TypeScript support')"

    - name: Output rolldown and vite hash
      shell: bash
      id: upstream-versions
      run: |
        node -e "console.log('ROLLDOWN_HASH=' + require('./packages/tools/.upstream-versions.json').rolldown.hash)" >> $GITHUB_OUTPUT
        node -e "console.log('ROLLDOWN_VITE_HASH=' + require('./packages/tools/.upstream-versions.json')['vite'].hash)" >> $GITHUB_OUTPUT

    - name: Output ecosystem ci project hash
      shell: bash
      id: ecosystem-ci-project-hash
      if: ${{ inputs.ecosystem-ci-project != '' }}
      run: |
        node -e "console.log('ECOSYSTEM_CI_PROJECT_HASH=' + require('./ecosystem-ci/repo.json')['${INPUTS_ECOSYSTEM_CI_PROJECT}'].hash)" >> $GITHUB_OUTPUT
        node -e "console.log('ECOSYSTEM_CI_PROJECT_REPOSITORY=' + require('./ecosystem-ci/repo.json')['${INPUTS_ECOSYSTEM_CI_PROJECT}'].repository.replace('https://github.com/', '').replace('.git', ''))" >> $GITHUB_OUTPUT
        echo "ECOSYSTEM_CI_PROJECT_PATH=${{ runner.temp }}/vite-plus-ecosystem-ci/${INPUTS_ECOSYSTEM_CI_PROJECT}" >> $GITHUB_OUTPUT
      env:
        INPUTS_ECOSYSTEM_CI_PROJECT: ${{ inputs.ecosystem-ci-project }}

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: rolldown/rolldown
        path: rolldown
        ref: ${{ steps.upstream-versions.outputs.ROLLDOWN_HASH }}
        persist-credentials: false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: vitejs/vite
        path: vite
        ref: ${{ steps.upstream-versions.outputs.ROLLDOWN_VITE_HASH }}
        persist-credentials: false

    # Match the manifests used by sync-remote when it generated the root lockfile.
    # The later dependency installation uses --frozen-lockfile, so alignment must run first.
    - name: Align vendored Vite's Vitest dependencies
      shell: bash
      run: node packages/tools/src/vendored-vitest.ts

    # Disable autocrlf to preserve LF line endings on Windows
    # This prevents prettier/eslint from failing with "Delete ␍" errors
    - name: Configure git for LF line endings
      if: ${{ inputs.ecosystem-ci-project != '' }}
      shell: bash
      run: git config --global core.autocrlf false

    - name: Clone ecosystem ci project
      if: ${{ inputs.ecosystem-ci-project != '' }}
      shell: bash
      run: node ecosystem-ci/clone.ts ${INPUTS_ECOSYSTEM_CI_PROJECT}
      env:
        INPUTS_ECOSYSTEM_CI_PROJECT: ${{ inputs.ecosystem-ci-project }}
