name: Security Analysis

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Clone the pinned upstream sources so cargo-deny can resolve path dependencies.
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Output rolldown hash
        id: upstream-versions
        shell: bash
        run: |
          node -e "console.log('ROLLDOWN_HASH=' + require('./packages/tools/.upstream-versions.json').rolldown.hash)" >> $GITHUB_OUTPUT
          node -e "console.log('OXC_NODE_HASH=' + require('./packages/tools/.upstream-versions.json')['oxc-node'].hash)" >> $GITHUB_OUTPUT

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rolldown/rolldown
          path: rolldown
          ref: ${{ steps.upstream-versions.outputs.ROLLDOWN_HASH }}
          persist-credentials: false

      # The binding's `oxc-node` path dependency must resolve against the
      # patched manifest recorded in Cargo.lock.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oxc-project/oxc-node
          path: oxc-node
          ref: ${{ steps.upstream-versions.outputs.OXC_NODE_HASH }}
          persist-credentials: false

      # Run the patch script with native TypeScript support instead of unpinned `npx tsx`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Patch vendored oxc-node
        shell: bash
        run: node packages/tools/src/patch-oxc-node.ts

      # Keep tool versions aligned with the action when updating SECURITY_ACTION_REF.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: zizmor@1.30.1,cargo-deny@0.20.2

      # security-action does not accept repository-specific advisory exceptions.
      # Reuse its pinned policies and tools, with only the exception below.
      - name: Prepare security policy
        shell: bash
        env:
          SECURITY_ACTION_REF: a8d382d3e5d0fccc813776e461cb0c3fb9d51a0d # v1.0.10
        run: |
          set -euo pipefail
          policy_dir="${RUNNER_TEMP}/security-policy"
          mkdir -p "${policy_dir}"
          for file in deny.toml zizmor.yml; do
            curl --fail --silent --show-error --location --retry 3 \
              "https://raw.githubusercontent.com/oxc-project/security-action/${SECURITY_ACTION_REF}/${file}" \
              --output "${policy_dir}/${file}"
          done

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          path = Path(os.environ["RUNNER_TEMP"]) / "security-policy/deny.toml"
          source = path.read_text()
          expected = tomllib.loads(source)
          exception = {
              "id": "RUSTSEC-2026-0387",
              # pgp_verify.rs only verifies public signatures and key bindings.
              # It never signs, decrypts, or operates on private keys. pgp 0.21
              # still requires crypto-bigint 0.5; no compatible fix is published.
              # https://rustsec.org/advisories/RUSTSEC-2026-0387.html
              "reason": "pgp only verifies public Node.js release signatures; no secret integers are processed. Remove when pgp supports patched crypto-bigint.",
          }
          marker = "ignore = [\n"
          if source.count(marker) != 1:
              raise ValueError("Shared advisory policy changed; review the exception insertion")
          entry = "  { " + ", ".join(f"{key} = {json.dumps(value)}" for key, value in exception.items()) + " },\n"
          updated = source.replace(marker, marker + entry, 1)
          expected["advisories"]["ignore"].insert(0, exception)
          if tomllib.loads(updated) != expected:
              raise ValueError("The advisory exception must not change other security policies")
          path.write_text(updated)
          PY

      - name: Run zizmor
        shell: bash
        run: zizmor --config "${RUNNER_TEMP}/security-policy/zizmor.yml" --strict-collection --show-audit-urls=always --min-severity=medium .

      - name: Run cargo-deny
        shell: bash
        run: cargo deny --config "${RUNNER_TEMP}/security-policy/deny.toml" check
