name: Reusable Release Build

permissions: {}

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to stamp into Cargo.toml and produced binaries.'
        type: string
        required: true
      cache-key:
        description: 'setup-rust cache-key prefix; pass a distinct value per caller (e.g. "release", "pkg-pr-new") to avoid cross-workflow cache pollution.'
        type: string
        required: false
        default: 'release'
      docs-origin:
        description: 'Documentation origin compiled into the native CLI, NAPI binding, and installer.'
        type: string
        required: false
        default: 'https://viteplus.dev'

jobs:
  build-rust:
    name: Build (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.os }}
    permissions:
      contents: read
    env:
      RELEASE_BUILD: 'true'
      DEBUG: 'napi:*'
      VERSION: ${{ inputs.version }}
      VITE_PLUS_DOCS_ORIGIN: ${{ inputs.docs-origin }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: namespace-profile-windows-4c-8g
          - target: aarch64-pc-windows-msvc
            os: namespace-profile-windows-4c-8g
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone
      - uses: ./.github/actions/setup-rust
        if: matrix.settings.target != 'x86_64-unknown-freebsd'
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: ${{ inputs.cache-key }}

      - name: Set native build version
        shell: bash
        run: |
          set -euo pipefail
          # Stamp ${VERSION} as the [package] version so CARGO_PKG_VERSION matches
          # the version that gets published/installed (the release version, or
          # 0.0.0-commit.<sha> for preview builds). Anchored to the line-start
          # `version = "..."` so crate dependency versions are never touched.
          for f in crates/vp_global_cli/Cargo.toml packages/cli/binding/Cargo.toml; do
            # shellcheck disable=SC2016 # JavaScript expands process.env.VERSION.
            node -e 'const fs=require("fs"),f=process.argv[1];fs.writeFileSync(f,fs.readFileSync(f,"utf8").replace(/^version = "[^"]*"/m,`version = "${process.env.VERSION}"`))' "$f"
          done

      # Build before installing host dependencies so the VM only syncs source
      # files. The shared build step later builds JavaScript on the Linux host.
      - name: Build and test FreeBSD binaries
        if: matrix.settings.target == 'x86_64-unknown-freebsd'
        env:
          RUSTUP_IO_THREADS: '1'
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: freebsd
          version: '15.0'
          memory: 8G
          cpu_count: 3
          environment_variables: 'VERSION VITE_PLUS_DOCS_ORIGIN RUSTUP_IO_THREADS'
          shell: bash
          run: |
            set -euo pipefail
            sudo pkg install -y curl git node24 cmake pkgconf jq
            curl -fsSL https://sh.rustup.rs -o /tmp/vp-rustup.sh
            sh /tmp/vp-rustup.sh -y --profile minimal --default-toolchain none
            source "$HOME/.cargo/env"
            rustup toolchain install --profile minimal
            cargo update --workspace

            # Keep intermediate files outside the workspace that the VM syncs.
            build_dir=$(mktemp -d)
            cargo build --locked --release --target x86_64-unknown-freebsd \
              --target-dir "$build_dir" -p vp_global_cli -p vite-plus-cli \
              --features vite-plus-cli/rolldown,vite-plus-cli/oxc-node
            cargo test --locked --release --target x86_64-unknown-freebsd \
              --target-dir "$build_dir" -p vp_js_runtime -p vp_setup platform

            mkdir -p target/x86_64-unknown-freebsd/release
            cp "$build_dir/x86_64-unknown-freebsd/release/vp" target/x86_64-unknown-freebsd/release/vp
            cp "$build_dir/x86_64-unknown-freebsd/release/libvite_plus_cli.so" packages/cli/binding/vite-plus.freebsd-x64.node
            cargo metadata --locked --format-version 1 \
              | jq '{packages: [.packages[] | {name, version, source}]}' \
              > packages/cli/binding/vite-plus.cargo-metadata.json
            node <<'JS'
            const assert = require('node:assert/strict');
            const binding = require('./packages/cli/binding/vite-plus.freebsd-x64.node');
            assert.equal(typeof binding.run, 'function');
            assert.equal(typeof binding.BindingBundler, 'function');
            assert.equal(typeof binding.oxcNode.OxcTransformer, 'function');
            binding.runCommand({
              binName: process.execPath,
              args: ['-e', 'process.exit(7)'],
              envs: {},
              cwd: process.cwd(),
            }).then((result) => {
              assert.equal(result.exitCode, 7);
              assert.deepEqual(result.pathAccesses, {});
            }).catch((error) => {
              console.error(error);
              process.exitCode = 1;
            });
            JS

            # Exercise the installer and system Node.js fallback without
            # downloading this release's not-yet-published npm packages.
            VP_HOME=$(mktemp -d)
            export VP_HOME
            local_tgz=$(mktemp)
            VP_LOCAL_BINARY="$PWD/target/x86_64-unknown-freebsd/release/vp" \
              VP_LOCAL_TGZ="$local_tgz" VP_SELF_SETUP_NO_MODIFY_PATH=1 \
              VP_VERSION="$VERSION" VP_SKIP_DEPS_INSTALL=1 \
              VP_NODE_MANAGER=yes VP_PM_MANAGER=no bash packages/cli/install.sh
            "$VP_HOME/bin/vp" --version
            PATH="$VP_HOME/bin:$PATH" VP_NODE_VERSION=24.11.0 \
              "$VP_HOME/bin/node" -e 'if (process.platform !== "freebsd") process.exit(1)'

      - name: Prepare Rust build
        if: matrix.settings.target != 'x86_64-unknown-freebsd'
        shell: bash
        run: |
          rustup target add ${{ matrix.settings.target }}
          # Keep Cargo.lock consistent with the stamped package versions.
          cargo update --workspace

      - uses: oxc-project/setup-node@1f1a5b4450c8905bd1830c3a908d22b960c4559a # main (Node before pnpm; unreleased)

      - name: Set JavaScript build version
        shell: bash
        run: |
          set -euo pipefail
          # Stamp the package.json files too:
          # - packages/cli: the bundled JS dist inlines ${VERSION} as
          #   cliPkg.version (VITE_PLUS_VERSION). Without this a preview
          #   `vp migrate` pins the build-time release placeholder instead of
          #   the test build, and skips the registry-bridge .npmrc.
          # - packages/core: the release build bakes ${VERSION} into bundled
          #   Rolldown's binding version guards, matching the
          #   @voidzero-dev/vite-plus-<platform> packages published as
          #   ${VERSION}. A release checkout already carries ${VERSION}; this
          #   only changes preview builds.
          # The list feeds the verify step below, so a stamped file cannot
          # silently drop out of verification.
          PKG_JSON_STAMP_FILES="packages/cli/package.json packages/core/package.json"
          for f in $PKG_JSON_STAMP_FILES; do
            pnpm exec json-edit "$f" '_.version = process.env.VERSION'
          done
          echo "PKG_JSON_STAMP_FILES=$PKG_JSON_STAMP_FILES" >> "$GITHUB_ENV"

      - name: Verify version replacement
        shell: bash
        run: |
          set -euo pipefail
          for f in crates/vp_global_cli/Cargo.toml packages/cli/binding/Cargo.toml; do
            if ! grep -qF "version = \"${VERSION}\"" "$f"; then
              echo "ERROR: version stamp failed for $f"; head -5 "$f"; exit 1
            fi
          done
          for f in ${PKG_JSON_STAMP_FILES}; do
            if [ "$(node -p "require('./$f').version")" != "${VERSION}" ]; then
              echo "ERROR: version stamp failed for $f"; exit 1
            fi
          done
          echo "Version stamp verified: ${VERSION}"

      - name: Build
        uses: ./.github/actions/build-upstream
        with:
          target: ${{ matrix.settings.target }}
          skip-native: ${{ matrix.settings.target == 'x86_64-unknown-freebsd' }}

      - name: Upload Vite+ native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vite-plus-native-${{ matrix.settings.target }}
          overwrite: true
          path: ./packages/cli/binding/*.node
          if-no-files-found: error

      - name: Upload Rust CLI binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vp-global-cli-${{ matrix.settings.target }}
          overwrite: true
          path: |
            ./target/${{ matrix.settings.target }}/release/vp
            ./target/${{ matrix.settings.target }}/release/vp.exe
            ./target/${{ matrix.settings.target }}/release/vp-shim.exe
          if-no-files-found: error

      - name: Package release archive
        shell: bash
        working-directory: ./target/${{ matrix.settings.target }}/release
        run: |
          mkdir -p sync-versions
          cp ../../../packages/cli/dist/sync-versions/bin.mjs sync-versions/bin.mjs
          cp ../../../packages/cli/dist/toolchain.json toolchain.json
          if [ -f vp.exe ]; then
            7z a "vp-${{ matrix.settings.target }}.zip" vp.exe vp-shim.exe sync-versions/bin.mjs toolchain.json
          else
            tar -czf "vp-${{ matrix.settings.target }}.tar.gz" vp sync-versions/bin.mjs toolchain.json
          fi

      - name: Verify packaged sync-versions planner
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        working-directory: ./target/${{ matrix.settings.target }}/release
        run: |
          set -euo pipefail
          archive_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "${archive_dir}"
          }
          trap cleanup EXIT
          tar -xzf "vp-${{ matrix.settings.target }}.tar.gz" -C "${archive_dir}"
          # Skip first-start setup because this build's preview packages are not published yet.
          touch "${archive_dir}/.vp-setup-complete"

          node --input-type=module -e '
            const before = JSON.stringify({ devDependencies: { "vite-plus": "0.0.0" } }) + "\n";
            process.stdout.write(JSON.stringify({
              schemaVersion: 1,
              workspace: ".",
              manifests: [{ path: "package.json", kind: "packageJson", contents: before }],
            }));
          ' | "${archive_dir}/vp" sync-versions --json > "${archive_dir}/plan.json"

          node --input-type=module -e '
            import fs from "node:fs";
            const [planPath, expectedVersion] = process.argv.slice(1);
            const plan = JSON.parse(fs.readFileSync(planPath, "utf8"));
            const before = JSON.stringify({ devDependencies: { "vite-plus": "0.0.0" } }) + "\n";
            const after = JSON.stringify({ devDependencies: { "vite-plus": expectedVersion } }) + "\n";
            if (
              plan.tool?.name !== "vite-plus" ||
              plan.tool.version !== expectedVersion ||
              plan.replacements?.length !== 1 ||
              plan.replacements[0].before !== before ||
              plan.replacements[0].after !== after
            ) {
              throw new Error("Unexpected packaged sync plan: " + JSON.stringify(plan));
            }
          ' "${archive_dir}/plan.json" "${VERSION}"

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vp-release-archive-${{ matrix.settings.target }}
          overwrite: true
          path: |
            ./target/${{ matrix.settings.target }}/release/vp-*.tar.gz
            ./target/${{ matrix.settings.target }}/release/vp-*.zip
          if-no-files-found: error

      - name: Upload installer binary artifact (Windows only)
        if: contains(matrix.settings.target, 'windows')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vp-setup-${{ matrix.settings.target }}
          overwrite: true
          path: ./target/${{ matrix.settings.target }}/release/vp-setup.exe
          if-no-files-found: error

      - name: Remove .node files before upload dist
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          rm ./packages/core/dist/**/*.node

      - name: Upload core dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: core
          overwrite: true
          path: ./packages/core/dist
          if-no-files-found: error

      - name: Upload prompts dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: prompts
          overwrite: true
          path: ./packages/prompts/dist
          if-no-files-found: error

      - name: Upload cli dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: cli
          overwrite: true
          path: ./packages/cli/dist
          if-no-files-found: error

      - name: Upload cli docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: cli-docs
          overwrite: true
          path: ./packages/cli/docs
          if-no-files-found: error

      - name: Upload LICENSE files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: licenses
          overwrite: true
          path: |
            ./packages/core/LICENSE
            ./packages/cli/LICENSE
          if-no-files-found: error
