name: Release

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/package.json'

permissions: {}

env:
  RELEASE_BUILD: 'true'
  DEBUG: 'napi:*'

jobs:
  check:
    if: github.repository == 'voidzero-dev/vite-plus'
    name: Check version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Check version changes
        uses: EndBug/version-check@095362f3cd50f690c8fa0e6afeea81834bd8d320 # v3.0.0
        id: version
        with:
          static-checking: localIsNew
          file-url: https://unpkg.com/vite-plus@latest/package.json
          file-name: packages/cli/package.json

  build-rust:
    name: Build bindings and binaries
    needs: check
    if: needs.check.outputs.version_changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-build.yml
    with:
      version: ${{ needs.check.outputs.version }}
      cache-key: release

  request-approval:
    runs-on: ubuntu-latest
    needs: [check, build-rust]
    if: needs.check.outputs.version_changed == 'true'
    steps:
      - uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          content: 'Requesting approval for vite-plus v${{ needs.check.outputs.version }}: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml'

  Release:
    runs-on: ubuntu-latest
    environment: release
    needs: [check, build-rust, request-approval]
    if: needs.check.outputs.version_changed == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write # Required for OIDC
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # npm publish-time scanning makes a successful upload temporarily
      # unavailable to installs. After each dependency tier becomes visible on
      # this runner's registry edge, allow time for other CDN edges to settle.
      PUBLISH_PROPAGATION_MIN_SECONDS: '60'
      PUBLISH_PROPAGATION_TIMEOUT_SECONDS: '600'
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Download cli dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/cli/dist
          pattern: cli
          merge-multiple: true

      - name: Download cli docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/cli/docs
          pattern: cli-docs
          merge-multiple: true

      - name: Download cli binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/cli/artifacts
          pattern: vite-plus-native-*

      - name: Download core dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/core/dist
          pattern: core
          merge-multiple: true

      - name: Download prompts dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prompts
          path: packages/prompts/dist

      - name: Download LICENSE files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages
          pattern: licenses
          merge-multiple: true

      - uses: ./.github/actions/download-rolldown-binaries
        with:
          github-token: ${{ github.token }}
          target: x86_64-unknown-linux-gnu
          upload: 'false'

      - name: Download Rust CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: rust-cli-artifacts
          pattern: vp-global-cli-*

      - name: Download installer binaries (Windows)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installer-artifacts
          pattern: vp-setup-*

      - name: Prepare installer binaries for release
        run: |
          mkdir -p installer-release
          for artifact_dir in installer-artifacts/vp-setup-*/; do
            if [ -d "$artifact_dir" ]; then
              dir_name=$(basename "$artifact_dir")
              target_name=${dir_name#vp-setup-}
              cp "$artifact_dir/vp-setup.exe" "installer-release/vp-setup-${target_name}.exe"
            fi
          done
          echo "Installer binaries:"
          ls -la installer-release/ || echo "No installer binaries found"

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: binary-release
          pattern: vp-release-archive-*
          merge-multiple: true

      - name: Create release archive checksums
        working-directory: binary-release
        run: sha256sum vp-* > vp-checksums.txt

      - name: Prepare and publish native addons
        run: node ./packages/cli/publish-native-addons.ts --mode npm

      - name: Publish prompts
        run: >-
          node ./.github/scripts/publish-npm-package.ts
          "@voidzero-dev/vite-plus-prompts@${VERSION}"
          --
          pnpm publish --filter=./packages/prompts --tag latest --access public --no-git-checks

      - name: Publish core dependency tier
        run: >-
          node ./.github/scripts/publish-npm-package.ts
          "@voidzero-dev/vite-plus-core@${VERSION}"
          --
          pnpm publish --filter=./packages/core --tag latest --access public --no-git-checks

      # The CLI pins core via workspace:* (rewritten to this exact version).
      # Wait for both its install metadata and tarball before publishing the CLI.
      - name: Wait for core to propagate
        run: >-
          node ./.github/scripts/wait-for-npm-packages.ts
          "@voidzero-dev/vite-plus-core@${VERSION}"

      - name: Publish Vite+
        run: >-
          node ./.github/scripts/publish-npm-package.ts
          "vite-plus@${VERSION}"
          --
          pnpm publish --filter=./packages/cli --tag latest --access public --no-git-checks

      # Downstream jobs build Docker images by installing this release from npm.
      - name: Wait for published packages to propagate
        run: >-
          node ./.github/scripts/wait-for-npm-packages.ts
          "vite-plus@${VERSION}"
          "@voidzero-dev/vite-plus-prompts@${VERSION}"

      - name: Create release body
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          INSTALL_BASH="curl -fsSL https://vite.plus | bash"
          INSTALL_PS1="irm https://vite.plus/ps1 | iex"
          cat > ./RELEASE_BODY.md <<EOF
          ## vite-plus v${VERSION}

          ### Published Packages

          - \`@voidzero-dev/vite-plus-core@${VERSION}\`
          - \`vite-plus@${VERSION}\`

          ### Installation

          **macOS/Linux:**
          \`\`\`bash
          ${INSTALL_BASH}
          \`\`\`

          **Windows:**
          \`\`\`powershell
          ${INSTALL_PS1}
          \`\`\`

          Or download and run \`vp-setup.exe\` from the assets below.

          View the full commit: https://github.com/${REPOSITORY}/commit/${COMMIT_SHA}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        id: release
        with:
          body_path: ./RELEASE_BODY.md
          draft: true
          make_latest: true
          prerelease: false
          name: vite-plus v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            installer-release/vp-setup-*.exe
            binary-release/vp-*.tar.gz
            binary-release/vp-*.zip
            binary-release/vp-checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${VERSION}" --draft=false --repo "${{ github.repository }}"

  update-homebrew:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    needs: [check, Release]
    if: >-
      needs.check.outputs.version_changed == 'true' &&
      !contains(needs.check.outputs.version, '-')
    concurrency:
      group: update-homebrew-formula
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Check publication and update formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/update-homebrew-formula.mjs "$VERSION"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: |
            HomebrewFormula/vp.rb
            docs/guide/homebrew.md
          commit-message: 'chore: update Homebrew vp to ${{ env.VERSION }}'
          title: 'chore: update Homebrew vp to ${{ env.VERSION }}'
          branch: release/homebrew-v${{ env.VERSION }}
          base: main
          sign-commits: true
          body: |
            Update the official Homebrew tap to `vp@${{ env.VERSION }}`.

            The formula downloads the native CLI from GitHub Releases. On first use, `vp` installs each user's matching dependencies.

  # Deploy viteplus.dev from the release commit after the npm packages and the
  # GitHub release are published, so the site and the install scripts always
  # match the released vp. Skipped for prereleases: production docs must keep
  # describing the latest stable release. See rfcs/deploy-docs-on-release.md.
  deploy-docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs: [check, Release]
    if: >-
      needs.check.outputs.version_changed == 'true' &&
      !contains(needs.check.outputs.version, '-')
    # Shared with deploy-docs.yml so production deploys serialize across both
    # entry paths. Only the newest pending run survives in the group; if this
    # job's pending run is replaced by a manual dispatch, the canceled job
    # holds back discord-notify and the deploy must be re-run.
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: ./.github/actions/deploy-docs
        with:
          void-project: viteplus
          void-token: ${{ secrets.VOID_TOKEN }}

  # Build and push the official toolchain Docker image to GHCR after the npm
  # release is published (the image installs vp from npm, so the version must
  # exist first). See docker/Dockerfile and docs/guide/docker.md.
  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [check, Release]
    if: needs.check.outputs.version_changed == 'true'
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      IMAGE: ghcr.io/voidzero-dev/vite-plus
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VP_VERSION=${{ env.VERSION }}
          provenance: false

  # Announce the release on Discord last, after the Docker images and the docs
  # are published, so the message never points at a missing image or a site
  # that still shows the previous release.
  discord-notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    # publish-docker already needs Release, so depending on it orders this last.
    # deploy-docs is skipped for prereleases; gate on its result explicitly so
    # prerelease announcements still go out, while a failed docs deploy on a
    # stable release holds the announcement back.
    needs: [check, publish-docker, deploy-docs]
    if: >-
      !cancelled() &&
      needs.check.outputs.version_changed == 'true' &&
      needs.publish-docker.result == 'success' &&
      (needs.deploy-docs.result == 'success' || needs.deploy-docs.result == 'skipped')
    env:
      VERSION: ${{ needs.check.outputs.version }}
      IMAGE: ghcr.io/voidzero-dev/vite-plus
    steps:
      # Non-blocking: a webhook failure must not mark the release run as failed
      # (npm, GitHub release, and Docker images are already published).
      - name: Send Discord notification
        continue-on-error: true
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          embed-title: vite-plus v${{ env.VERSION }}
          embed-description: |
            A new release is available!

            **Published Packages:**
            • @voidzero-dev/vite-plus-core@${{ env.VERSION }}
            • vite-plus@${{ env.VERSION }}

            **Docker (GHCR):**
            • `docker pull ${{ env.IMAGE }}:${{ env.VERSION }}`

            **Install:**
            • macOS/Linux: `curl -fsSL https://vite.plus | bash`
            • Windows: `irm https://vite.plus/ps1 | iex`
          embed-url: https://github.com/${{ github.repository }}/releases/tag/v${{ env.VERSION }}
