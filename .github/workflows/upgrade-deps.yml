name: Upgrade Upstream Dependencies

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch: # Manual trigger

permissions: {}

jobs:
  upgrade:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone

      - name: Set up metadata directory
        run: echo "UPGRADE_DEPS_META_DIR=${RUNNER_TEMP}/upgrade-deps-meta" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: upgrade-deps
          tools: just,cargo-shear

      - uses: oxc-project/setup-node@1f1a5b4450c8905bd1830c3a908d22b960c4559a # main (Node before pnpm; unreleased)

      - name: Capture current upstream CLI help
        run: node .github/scripts/cli-help-diff.ts capture --output "${UPGRADE_DEPS_META_DIR}/cli-help-before.json"

      - name: Rustup Adds Target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Rustup Adds Target for rolldown
        working-directory: rolldown
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Upgrade dependencies and sync upstream
        id: build
        continue-on-error: true # Create PR even if installation or upstream sync fails
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/upgrade-deps.ts

      - name: Use the updated Node.js pin
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Build
        uses: ./.github/actions/build-upstream
        id: build-upstream
        continue-on-error: true
        with:
          target: x86_64-unknown-linux-gnu
          print-after-build: 'true'
        env:
          RELEASE_BUILD: 'true'

      - name: Generate upstream CLI help diff report
        id: cli-help-diff
        run: |
          node .github/scripts/cli-help-diff.ts capture \
            --versions "${UPGRADE_DEPS_META_DIR}/versions.json" \
            --output "${UPGRADE_DEPS_META_DIR}/cli-help-after.json"
          node .github/scripts/cli-help-diff.ts report \
            --before "${UPGRADE_DEPS_META_DIR}/cli-help-before.json" \
            --after "${UPGRADE_DEPS_META_DIR}/cli-help-after.json" \
            --output "${UPGRADE_DEPS_META_DIR}/cli-help-report.md" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Check upgrade dependencies with Kimi K3
        id: check-upgrade-dependencies
        timeout-minutes: 180
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
          CLI_HELP_DIFF_CHANGED: ${{ steps.cli-help-diff.outputs.has-changes }}
          CLI_HELP_DIFF_REPORT: ${{ env.UPGRADE_DEPS_META_DIR }}/cli-help-report.md
          RELEASE_BUILD: 'true'
        with:
          anthropic_api_key: ${{ secrets.MOONSHOT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: 'true'
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://api.kimi.com/coding/",
                "ANTHROPIC_MODEL": "k3[1m]",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "k3[1m]",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "kimi-for-coding",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "kimi-for-coding",
                "ANTHROPIC_DEFAULT_FABLE_MODEL": "k3[1m]",
                "CLAUDE_CODE_SUBAGENT_MODEL": "k3[1m]",
                "CLAUDE_CODE_AUTO_COMPACT_WINDOW": "1048576",
                "CLAUDE_CODE_MAX_CONTEXT_TOKENS": "1048576",
                "CLAUDE_CODE_EFFORT_LEVEL": "max"
              }
            }
          prompt: |
            Your goal: after the daily upstream-dependency upgrade, bring the project back
            to a fully green state. The upgrade script has attempted to select the latest
            supported versions, move the vite-task git revision to its latest `main` commit,
            install dependencies, merge the rolldown and vite catalogs, deduplicate
            dependencies, and synchronize core's external dependencies.
            The `build-upstream` action
            has attempted a build — your job is to diagnose and fix every error that
            surfaced, then prove the fix is complete by running a final validation pass.

            ### Background
            - Upgrade script: `./.github/scripts/upgrade-deps.ts`
            - Development, CI, and global CLI dependency installation use the
              latest stable `24.x` release pinned in `.node-version`.
              Keep the exact version selected by the upgrade script. Do not replace
              it with a moving LTS alias or advance the major version.
              Runtime commands keep their latest LTS fallback.
            - Vitest is capped at the latest stable `5.x` release. Keep the exact
              version selected by the upgrade script when merging upstream catalogs.
              Official Vitest packages must use that version. Do not bypass the cap.
            - Sync-remote tool: `pnpm tool sync-remote` (source in
              `packages/tools/src/sync-remote-deps.ts`) — clones rolldown/vite into the
              working tree, imports only their build roots and bundled packages,
              and keeps catalog entries referenced by the retained workspace packages.
              It updates `pnpm-workspace.yaml` and syncs the root `Cargo.toml` oxc crate
              versions to match `rolldown/Cargo.toml`.
            - Build-upstream action: `./.github/actions/build-upstream/action.yml`
            - Package manager: `pnpm`. Preserve toolchain versions selected by the
              upgrade script under its compatibility policy. Other shared dependencies
              follow the pinned upstream requirements.
            - After changing tsdown or rolldown-plugin-dts, run
              `node .github/scripts/upgrade-deps.ts --sync-bundled-deps`, then
              `pnpm install --no-frozen-lockfile`. Core's external `yuku-parser` must
              use the exact installed version resolved by the plugin bundled through
              tsdown, so it stays aligned with the bundled Yuku code. Do not replace
              this pin with a version range. The sync command also
              copies Vite's postcss and optional fsevents ranges into core and
              updates the upgrade metadata. `@oxlint/plugins` shares Oxlint's release
              version and must use the exact same version selected by the upgrade script.
            - Every `voidzero-dev/vite-task` git dependency in the root `Cargo.toml`
              shares one revision. The old and new revisions are recorded under
              `vite-task` in `${{ env.UPGRADE_DEPS_META_DIR }}/versions.json`; they are
              equal when `main` has no new commits or does not contain the pinned commit.
              Keep the revision selected by the upgrade script. `Cargo.lock` follows it
              on the next cargo command.

            ### Outcomes from earlier steps (both ran with continue-on-error)
            - Upgrade dependencies and sync upstream: ${{ steps.build.outcome }}
            - build-upstream action: ${{ steps.build-upstream.outcome }}

            ### Fixups to perform (in order)
            1. If the `Upgrade dependencies and sync upstream` outcome above is `failure`,
               fix it FIRST — nothing else will work until the merged workspace is correct.
               Read the failed command in the upgrade log and re-run it. Resolve
               catalog conflicts against the pinned Rolldown and Vite sources.
               `sync-remote` follows their requirements for imported dependencies;
               preserve its explicit Oxc, Vitest, and TypeScript integration policies.
               Re-run `pnpm tool sync-remote` until it exits 0. Complete the remaining
               upgrade operations: `pnpm dedupe`,
               `node .github/scripts/upgrade-deps.ts --sync-bundled-deps`, then
               `pnpm install --no-frozen-lockfile` before building or testing.
            2. Re-run the steps in `./.github/actions/build-upstream/action.yml`; fix any
               non-zero exits. If the Rust build fails inside a vendored `rolldown`
               crate with an oxc API mismatch (e.g. `oxc_ast::template_element` taking
               a different number of arguments, or any `oxc_*` type/signature error),
               the root `Cargo.toml` oxc pins are out of sync with the bumped rolldown.
               `pnpm tool sync-remote` should already reconcile them; if any `oxc_*`
               entry in the root `Cargo.toml [workspace.dependencies]` still differs
               from `rolldown/Cargo.toml`, bump it to match (the oxc same-version
               family follows rolldown's umbrella `oxc` version), run `cargo update`,
               and rebuild.
            3. If the `vite-task` revision changed, follow steps 4 and 7 of
               `.claude/skills/bump-vite-task/SKILL.md`: fix compile errors from vite-task
               API changes on the vite-plus side (never in vite-task), then review the
               vite-task changelog between the two revisions and update `docs/` for
               user-facing changes. Skip that skill's clone, PR, and CI steps.
            4. Follow `.claude/agents/cargo-workspace-merger.md` to synchronize shared root
               Rust dependency requirements with both pinned upstream sources and
               update their Renovate exclusions. Preserve documented integration
               constraints and refresh `Cargo.lock` after the manifest changes.
               Keep the root catalog exclusion in `.github/renovate.json` aligned with
               used dependencies imported from the Rolldown and Vite catalogs.
            5. If `CLI_HELP_DIFF_CHANGED` is `true`, read the upstream help diff at
               `$CLI_HELP_DIFF_REPORT`, then follow
               `.claude/skills/sync-upstream-cli-help/SKILL.md` to update the mirrored
               help documents. If it is `false`, do not modify help documents.
            6. Compare tsdown CLI options with `vp pack` and sync new/removed options per
               `.claude/skills/sync-tsdown-cli/SKILL.md`.
            7. Follow `.claude/skills/sync-upstream-dependency-docs/SKILL.md` to
               update version-specific documentation for dependencies changed in this run.
            8. Install the global CLI:
               - `pnpm bootstrap-cli:ci`
               - `echo "$HOME/.vite-plus/bin" >> $GITHUB_PATH`
            9. If any Rust code or `Cargo.toml` was modified, run `cargo check
               --all-targets --all-features` and `cargo shear`; fix anything they report.
            10. Run `pnpm run lint` (requires a prior `just build`); fix any errors.
            11. Smoke-test the CLI: `vp -h`, `vp run -h`, `vp lint -h`, `vp test -h`,
               `vp build -h`, `vp fmt -h`, `vp pack -h`.

            ### Generated artifacts and build diffs
            Several build outputs are committed release artifacts. In particular,
            `packages/cli/binding/index.cjs` and `packages/cli/binding/index.d.cts`
            are regenerated by the NAPI build and CI requires them to match the
            current Rust binding API after `build-upstream`.

            After every `build-upstream` or `just build` run, inspect `git status
            --short` and focused diffs for generated files. Do NOT discard generated
            binding diffs just because they are generated. If an upstream dependency
            changes the generated declarations or loader, keep the generated file
            updates in the PR. If the diff is accidental, stale, or caused by an
            incorrect source-level fix, fix the source and regenerate until the diff
            is either gone or intentionally kept.

            ### Validation during fixups
            Rebuild the affected packages and run focused tests for each fix. For
            tsdown or declaration-generator changes, run `just snapshot-test
            command_pack_dts_compat`, `just snapshot-test command_pack_monorepo`,
            and `just snapshot-test migration_from_tsup_monorepo_success`.
            A successful internal build does
            not prove that `vp pack` works with consumers' TypeScript versions.

            Re-record with `UPDATE_SNAPSHOTS=1` only for cosmetic drift from the
            upgrade (e.g. a bumped version string in help output). Unexpected stack
            traces, missing output, or diverging CLI behavior are regressions to fix.
            For a vite-task revision change, run focused snapshot filters for the
            commands its changelog affects (e.g. `just snapshot-test command_run`), as
            described in step 6 of `.claude/skills/bump-vite-task/SKILL.md`. Output
            changes that the vite-task changelog describes are intended and may be
            re-recorded.
            Inspect `git status --short` and `git diff --stat` before finishing;
            every changed file, including generated NAPI bindings, must be intentional.

            The workflow's separate Final validation step runs the full build, unit
            tests, and snapshot suite after this action. Do not launch the full
            snapshot suite here or leave any validation command running in the background.

            ### Running long commands (IMPORTANT)
            Run every long-running command (`just build`, `pnpm bootstrap-cli:ci`,
            `pnpm test:unit`, `cargo check`, etc.) in the FOREGROUND — a single Bash tool call
            that blocks until the command exits. The Bash tool already gives you a 10-minute
            timeout per call, which is enough for these builds.

            Do NOT do any of the following:
            - Spawn a background process (`&`, `nohup`, `disown`, `setsid`, `screen`, `tmux`).
            - Poll for process completion with `ps`, `pgrep`, `lsof`, `sleep` loops, or
              repeated `ls` checks on build artifacts. Each polling Bash call costs a full
              model round-trip and burns minutes without progress.
            - "Monitor" a running build from a separate Bash call. If you want to know
              whether a build succeeded, just run it in the foreground and read its exit
              code and stdout/stderr in the single tool result.

            If a foreground command legitimately hits the 10-minute Bash timeout, report
            that and stop — do not start polling.

            ### Commit rule
            Do NOT run `git commit` or `git push`. A later workflow step commits every
            modified file for you.
          claude_args: |
            --model "k3[1m]" --max-turns 400 --allowedTools "Bash,Edit,Replace,NotebookEditCell"
          additional_permissions: |
            actions: read

      - name: Update lockfile
        # Dedupe runs in upgrade-deps.ts, before dependency sync and validation.
        run: pnpm install --no-frozen-lockfile

      - name: Format code
        # `pnpm fmt` runs `vp fmt`, which loads the freshly built NAPI binding. When
        # `build-upstream` fails (e.g. an upstream rolldown/oxc desync the in-workflow
        # fixup could not resolve) the binding is never produced and `vp fmt` aborts.
        # Keep going so the PR is still created with the broken state surfaced for review,
        # matching the `continue-on-error` on the build steps above.
        continue-on-error: true
        run: pnpm fmt

      - name: Final validation
        id: final-validation
        timeout-minutes: 90
        # Keep broken upgrades available for review, but only as draft PRs.
        continue-on-error: true
        shell: bash
        env:
          RELEASE_BUILD: 'true'
        run: |
          set -euo pipefail
          pnpm bootstrap-cli
          export PATH="$HOME/.vite-plus/bin:$PATH"
          pnpm test:unit
          just snapshot-test

      - name: Enhance PR description with Kimi K3
        id: enhance-pr-description
        continue-on-error: true
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
        with:
          anthropic_api_key: ${{ secrets.MOONSHOT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: 'true'
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://api.kimi.com/coding/",
                "ANTHROPIC_MODEL": "k3[1m]",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "k3[1m]",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "kimi-for-coding",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "kimi-for-coding",
                "ANTHROPIC_DEFAULT_FABLE_MODEL": "k3[1m]",
                "CLAUDE_CODE_SUBAGENT_MODEL": "k3[1m]",
                "CLAUDE_CODE_AUTO_COMPACT_WINDOW": "1048576",
                "CLAUDE_CODE_MAX_CONTEXT_TOKENS": "1048576",
                "CLAUDE_CODE_EFFORT_LEVEL": "max"
              }
            }
          prompt: |
            Your task is to generate an accurate commit message and PR description for this
            automated upstream-dependency upgrade PR. All output must be written in English.

            ### Inputs
            - Version changes (old -> new) in JSON: `${{ env.UPGRADE_DEPS_META_DIR }}/versions.json`
            - Baseline commit message: `${{ env.UPGRADE_DEPS_META_DIR }}/commit-message.txt`
            - Baseline PR body: `${{ env.UPGRADE_DEPS_META_DIR }}/pr-body.md`
            - Read the baseline PR body before you write. Preserve each factual detail unless
              `git diff` shows that the detail is no longer correct.
            - The working directory is the project root; all upgraded files are staged or modified.
              Use `git status` and `git diff` (including `git diff --stat` and focused per-file diffs)
              to discover what actually changed beyond the raw version bumps.

            ### Build outcomes from earlier steps
            - Upgrade dependencies and sync upstream: ${{ steps.build.outcome }}
            - build-upstream action: ${{ steps.build-upstream.outcome }}

            ### Output files to OVERWRITE (these live outside the repo and will NOT be committed)
            - `${{ env.UPGRADE_DEPS_META_DIR }}/commit-message.txt`
            - `${{ env.UPGRADE_DEPS_META_DIR }}/pr-body.md`

            ### Commit message format
            - First line (title, <= 72 chars): `feat(deps): upgrade upstream dependencies`
            - Blank line.
            - A concise bulleted list of notable version changes, one bullet per package.
              For `rolldown` and `vite`, include the tag name plus short SHA when available
              (e.g. `rolldown: <old-short> -> v1.2.3 (<new-short>)`). Skip packages whose
              old and new values are equal.
            - If non-version code changes were required (e.g., tsdown CLI option sync,
              rolldown workspace re-merge, snapshot updates, cargo shear cleanup),
              add a trailing `Code changes:` block listing each change with a file path.

            ### PR body format (Markdown)
            Use this content in order:
            1. Add 2-4 overview bullets without a `Summary` heading. Describe the most impactful
               upgrades and all required code adjustments.
            2. `## Dependency updates` — a Markdown table with columns `Package | From | To`.
               Link each target version to its changelog when a verified link is available.
               Format the target version as inline code inside the Markdown link.
               - Prefer an exact target-version release page in the official repository.
               - If no release page exists, link to the target version in the official changelog.
               - Use `gh api`, npm package metadata, and upstream repository files to verify links.
               - Do not guess a URL. Keep the target version unlinked if you cannot verify a link.
               Include the version and a short 7-char SHA in both `From` and `To` for `rolldown`
               and `vite`. Link each SHA label to the full commit in the official repository.
               `vite-task` has no releases: show only the short SHAs, link each to its commit in
               `voidzero-dev/vite-task`, and keep the baseline CHANGELOG diff link.
               Omit packages whose old and new values are equal.
               Keep the baseline list of unchanged dependencies after the table.
            3. `## Code changes` — bullet list of the actual non-version edits, each naming
               the file(s) touched. If the only changes are version bumps + lockfile + generated
               bindings, write `- None beyond version bumps, lockfile, and formatter output.`.
            4. `## Build status` — bullet list:
               - `upgrade-and-sync`: ${{ steps.build.outcome }}
               - `build-upstream`: ${{ steps.build-upstream.outcome }}

            ### Rules
            - Be factual. Only describe changes that are actually present in `git diff`. Do not
              invent feature descriptions or behavior changes.
            - Keep the tone terse and mechanical — this is an automated upgrade PR, not a
              feature announcement.
            - Do NOT run `git commit`, `git push`, or create any PR comment; simply write the
              two output files. A later workflow step will consume them.
            - Do NOT modify any file inside the repository working tree.
          claude_args: |
            --model "k3[1m]" --allowedTools "Bash,Read,Write,Edit"
          additional_permissions: |
            actions: read

      - name: Read generated PR content
        id: pr-content
        run: |
          set -euo pipefail
          COMMIT_FILE="${UPGRADE_DEPS_META_DIR}/commit-message.txt"
          BODY_FILE="${UPGRADE_DEPS_META_DIR}/pr-body.md"

          # GitHub Actions heredoc outputs require the terminator on its own line,
          # so guarantee a trailing newline regardless of what the generator wrote.
          ensure_trailing_newline() {
            local f="$1"
            if [ -n "$(tail -c1 "$f")" ]; then
              printf '\n' >> "$f"
            fi
          }
          ensure_trailing_newline "${COMMIT_FILE}"
          ensure_trailing_newline "${BODY_FILE}"

          echo '--- commit-message.txt ---'
          cat "${COMMIT_FILE}"
          echo '--- pr-body.md ---'
          cat "${BODY_FILE}"
          echo '---'

          {
            echo 'commit-message<<UPGRADE_DEPS_COMMIT_EOF'
            cat "${COMMIT_FILE}"
            echo 'UPGRADE_DEPS_COMMIT_EOF'
            echo 'body<<UPGRADE_DEPS_BODY_EOF'
            cat "${BODY_FILE}"
            echo 'UPGRADE_DEPS_BODY_EOF'
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Close and delete previous PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Find PR with the deps/upstream-update branch
          PR_NUMBER=$(gh pr list --head deps/upstream-update --json number --jq '.[0].number')

          if [ -n "$PR_NUMBER" ]; then
            echo "Found existing PR #$PR_NUMBER, closing and deleting branch…"
            gh pr close "$PR_NUMBER" --delete-branch
          else
            echo "No existing PR found with branch deps/upstream-update"
          fi

      - name: Create/Update PR
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: deps/upstream-update
          title: 'feat(deps): upgrade upstream dependencies'
          draft: ${{ steps.final-validation.outcome != 'success' }}
          sign-commits: true
          token: ${{ steps.app-token.outputs.token }}
          body: ${{ steps.pr-content.outputs.body }}
          commit-message: ${{ steps.pr-content.outputs.commit-message }}

      - name: Comment upstream CLI help diff
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file "${UPGRADE_DEPS_META_DIR}/cli-help-report.md"

      - name: Report validation failure
        if: always() && steps.final-validation.outcome != 'success'
        shell: bash
        run: |
          echo '::error::The upgraded dependencies did not pass final validation.'
          exit 1
