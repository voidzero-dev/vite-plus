name: Oxc GLM-5.3 smoke test

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  capture:
    if: &smoke-pr >-
      !cancelled() &&
      github.repository == 'voidzero-dev/vite-plus' &&
      github.event.pull_request.number == 3508 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/triagebot-workers-ai-410'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy: &verification-stage
      fail-fast: false
      matrix:
        stage: [verification]
    steps:
      - &checkout-pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - &read-config
        id: config
        name: Read selected model and skill from the PR
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/issue-triage.yml")
            step = workflow.fetch("jobs").fetch("triage").fetch("steps").find { |s| s["name"] == "Run triagebot" }
            pin = /\Aoxc-project\/triagebot-action@([0-9a-f]{40})\z/.match(step.fetch("uses"))[1]
            inputs = step.fetch("with")
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |f|
              f.puts "pin=#{pin}", "model=#{inputs.fetch(ENV.fetch("STAGE") + "-model")}", "skill=#{inputs.fetch("triage-skill")}"
            end'
      - &checkout-action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oxc-project/triagebot-action
          ref: ${{ steps.config.outputs.pin }}
          path: pinned-action
          persist-credentials: false
      - &setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test mocked responses and capture the selected model request
        env: &fixture-inputs
          STAGE: ${{ matrix.stage }}
          MODEL: ${{ steps.config.outputs.model }}
          SKILL: ${{ steps.config.outputs.skill }}
        run: |
          fixture_home=$(mktemp -d)
          wire_dir="$RUNNER_TEMP/model-wire"
          mkdir -p "$wire_dir"
          run_fixture() {
            local model="$1"
            shift
            env -i PATH="$PATH" HOME="$fixture_home" GIT_CONFIG_NOSYSTEM=1 GIT_ALLOW_PROTOCOL=file "$@" \
              node .github/scripts/triage-model-smoke.mjs "$STAGE" "$model" "$SKILL" pinned-action/dist/index.mjs
          }
          run_fixture "$MODEL" WIRE_CAPTURE="$wire_dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-request-${{ matrix.stage }}
          path: ${{ runner.temp }}/model-wire/request-1.json
          if-no-files-found: error
          retention-days: 1

  inference:
    if: *smoke-pr
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy: *verification-stage
    steps:
      - *checkout-pr
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-request-${{ matrix.stage }}
          path: ${{ runner.temp }}/model-wire
      - name: Send the first request to Workers AI
        env:
          STAGE: ${{ matrix.stage }}
          CF_TEST_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TEST_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: python3 -I .github/scripts/triage-model-wire.py "$RUNNER_TEMP/model-wire" "$STAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-response-${{ matrix.stage }}
          path: ${{ runner.temp }}/model-wire/response-1.sse
          if-no-files-found: error
          retention-days: 1

  replay:
    if: ${{ !cancelled() && (needs.inference.result == 'success' || needs.inference.result == 'failure') }}
    needs: inference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy: *verification-stage
    steps:
      - *checkout-pr
      - *read-config
      - *checkout-action
      - *setup-node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-response-${{ matrix.stage }}
          path: ${{ runner.temp }}/model-wire
      - name: Parse the first live response and mock any follow-up
        env: *fixture-inputs
        run: |
          fixture_home=$(mktemp -d)
          env -i PATH="$PATH" HOME="$fixture_home" GIT_CONFIG_NOSYSTEM=1 GIT_ALLOW_PROTOCOL=file \
            WIRE_REPLAY="$RUNNER_TEMP/model-wire" \
            node .github/scripts/triage-model-smoke.mjs "$STAGE" "$MODEL" "$SKILL" pinned-action/dist/index.mjs

  triage-live:
    if: *smoke-pr
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        stage: [triage]
    steps:
      - *checkout-pr
      - *read-config
      - *checkout-action
      - name: Start isolated triage with a synthetic issue
        env:
          TRIAGE_MODEL: ${{ steps.config.outputs.model }}
        run: |
          wire="$RUNNER_TEMP/triage-live-wire"
          mkdir -m 700 "$wire"
          docker run --detach --name triage-live --init \
            --network none --cap-drop ALL --security-opt no-new-privileges --read-only \
            --memory 1g --pids-limit 128 --user "$(id -u):$(id -g)" \
            --log-opt max-size=1m --log-opt max-file=1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --env HOME=/tmp --workdir /tmp \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/scripts/triage-live-loop.mjs,dst=/probe/entry.mjs,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/pinned-action,dst=/probe/action,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.agents/skills/triage,dst=/fixture-source,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/AGENTS.md,dst=/fixture-guide,readonly" \
            --mount "type=bind,src=$wire,dst=/wire" \
            node:24-bookworm@sha256:aca79828f8a4afc627f189387c965625bcc419233946210a3b9522d90a59b5c6 \
            node /probe/entry.mjs "$TRIAGE_MODEL"
      - name: Relay tool calls to Workers AI and wait for the triage result
        env:
          CF_TEST_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TEST_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          wire="$RUNNER_TEMP/triage-live-wire"
          result=$(mktemp)
          python3 -I .github/scripts/triage-model-wire.py "$wire" triage-loop &
          relay_pid=$!
          timeout -k 5 335 docker wait triage-live > "$result" &
          monitor_pid=$!
          cleanup() {
            docker stop --time 2 triage-live >/dev/null 2>&1 || true
            kill "$relay_pid" "$monitor_pid" 2>/dev/null || true
            wait "$relay_pid" "$monitor_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          trap 'exit 1' TERM INT
          wait -n -p finished "$relay_pid" "$monitor_pid"
          if [[ "$finished" == "$relay_pid" ]]; then
            wait "$monitor_pid"
          fi
          test "$(cat "$result")" = 0
      - name: Read the isolated triage result and remove the container
        if: always()
        run: |
          if docker container inspect triage-live >/dev/null 2>&1; then
            trap 'docker rm -f triage-live >/dev/null' EXIT
            marker=$(cat /proc/sys/kernel/random/uuid)
            echo "::stop-commands::$marker"
            docker logs --tail 90 triage-live 2>&1 | tr -cd '\11\12\40-\176' | cut -c1-1600
            echo "::$marker::"
          fi
