name: Triage model smoke test (upstream PR 19)

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  capture:
    if: &smoke-pr >-
      !cancelled() &&
      github.repository == 'voidzero-dev/vite-plus' &&
      github.event.pull_request.number == 3508 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/triagebot-workers-ai-410'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy: &both-stages
      fail-fast: false
      matrix:
        stage: [triage, verification]
    steps:
      - &checkout-pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - &read-config
        id: config
        name: Read selected model and skill from the PR
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/issue-triage.yml")
            step = workflow.fetch("jobs").fetch("triage").fetch("steps").find { |s| s["name"] == "Run triagebot" }
            inputs = step.fetch("with")
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |f|
              f.puts "model=#{inputs.fetch(ENV.fetch("STAGE") + "-model")}", "skill=#{inputs.fetch("triage-skill")}"
            end'
      - &checkout-action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ipanasenko/triagebot-action
          ref: 341657009fd13f34b3d45fe2c10996530e86ce29 # withastro/triagebot-action#19
          path: pinned-action
          persist-credentials: false
      - &setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test mocked responses and capture the selected model request
        env: &fixture-inputs
          STAGE: ${{ matrix.stage }}
          MODEL: ${{ steps.config.outputs.model }}
          SKILL: ${{ steps.config.outputs.skill }}
        run: |
          fixture_home=$(mktemp -d)
          wire_dir="$RUNNER_TEMP/model-wire"
          mkdir -p "$wire_dir"
          run_fixture() {
            local model="$1"
            shift
            env -i PATH="$PATH" HOME="$fixture_home" GIT_CONFIG_NOSYSTEM=1 GIT_ALLOW_PROTOCOL=file "$@" \
              node .github/scripts/triage-model-smoke.mjs "$STAGE" "$model" "$SKILL" pinned-action/dist/index.mjs
          }
          run_fixture 'cloudflare-workers-ai/@cf/google/gemma-4-26b-a4b-it'
          run_fixture "$MODEL" WIRE_CAPTURE="$wire_dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-request-${{ matrix.stage }}
          path: ${{ runner.temp }}/model-wire/request-1.json
          if-no-files-found: error
          retention-days: 1

  inference:
    if: *smoke-pr
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy: *both-stages
    steps:
      - *checkout-pr
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-request-${{ matrix.stage }}
          path: ${{ runner.temp }}/model-wire
      - name: Send the first request to Workers AI
        env:
          STAGE: ${{ matrix.stage }}
          CF_TEST_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TEST_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: python3 -I .github/scripts/triage-model-wire.py "$RUNNER_TEMP/model-wire" "$STAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-response-${{ matrix.stage }}
          path: ${{ runner.temp }}/model-wire/response-1.sse
          if-no-files-found: error
          retention-days: 1

  replay:
    if: ${{ !cancelled() && (needs.inference.result == 'success' || needs.inference.result == 'failure') }}
    needs: inference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy: *both-stages
    steps:
      - *checkout-pr
      - *read-config
      - *checkout-action
      - *setup-node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-response-${{ matrix.stage }}
          path: ${{ runner.temp }}/model-wire
      - name: Parse the first live response and mock any follow-up
        env: *fixture-inputs
        run: |
          fixture_home=$(mktemp -d)
          env -i PATH="$PATH" HOME="$fixture_home" GIT_CONFIG_NOSYSTEM=1 GIT_ALLOW_PROTOCOL=file \
            WIRE_REPLAY="$RUNNER_TEMP/model-wire" \
            node .github/scripts/triage-model-smoke.mjs "$STAGE" "$MODEL" "$SKILL" pinned-action/dist/index.mjs
