name: Test Standalone Install Scripts

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/cli/install.sh'
      - 'packages/cli/install.ps1'
      - 'packages/cli/tests/fixtures/provenance-registry.mjs'
      - 'crates/vp_installer/**'
      - 'crates/vp_global_cli/**'
      - 'crates/vp_pm_cli/**'
      - 'crates/vp_setup/**'
      - '.github/workflows/test-standalone-install.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test-install-sh:
    name: Test install.sh (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64 glibc
          - os: macos-15-intel
            name: macOS x64
          - os: macos-latest
            name: macOS ARM64
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Run install.sh
        run: cat packages/cli/install.sh | bash

      - name: Verify installation
        working-directory: ${{ runner.temp }}
        run: |
          # Source shell config to get PATH updated
          if [ -f ~/.zshenv ]; then
            # non-interactive shells use zshenv
            source ~/.zshenv
          elif [ -f ~/.zshrc ]; then
            # interactive shells use zshrc
            source ~/.zshrc
          elif [ -f ~/.bash_profile ]; then
            # non-interactive shells use bash_profile
            source ~/.bash_profile
          elif [ -f ~/.bashrc ]; then
            # interactive shells use bashrc
            source ~/.bashrc
          else
            export PATH="$HOME/.vite-plus/bin:$PATH"
          fi
          echo "PATH: $PATH"
          ls -al ~/

          vp --version
          vp --help
          # test create command
          vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
          cd hello && vp run build && vp --version

      - name: Set PATH
        shell: bash
        run: |
          echo "$HOME/.vite-plus/bin" >> $GITHUB_PATH

      - name: Verify bin setup
        run: |
          # Verify bin directory was created by vp env --setup
          BIN_PATH="$HOME/.vite-plus/bin"
          ls -al "$BIN_PATH"
          if [ ! -d "$BIN_PATH" ]; then
            echo "Error: Bin directory not found: $BIN_PATH"
            exit 1
          fi

          # Verify shim executables exist
          for shim in node npm npx; do
            if [ ! -f "$BIN_PATH/$shim" ]; then
              echo "Error: Shim not found: $BIN_PATH/$shim"
              exit 1
            fi
            echo "Found shim: $BIN_PATH/$shim"
          done

          # Verify vp env doctor works
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

          which node
          which npm
          which npx
          which vp

      - name: Verify upgrade
        run: |
          # --check queries npm registry and prints update status
          vp upgrade --check
          vp upgrade 0.1.14-alpha.1
          vp --version
          # rollback to the previous version (should succeed after a real update)
          vp upgrade --rollback
          vp --version

  test-install-sh-provenance:
    name: Test install.sh (npm provenance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Verify platform package provenance before download
        env:
          TEST_VERSION: 9.9.9-provenance-test.1
        run: |
          run_case() {
            mode="$1"
            expected="$2"
            case_dir="$RUNNER_TEMP/vite-plus-provenance-sh-$mode"
            port_file="$case_dir/port"
            log_file="$case_dir/requests.jsonl"
            vp_home="$case_dir/vp-home"

            rm -rf "$case_dir"
            mkdir -p "$case_dir/home" "$vp_home"
            node packages/cli/tests/fixtures/provenance-registry.mjs \
              --port-file "$port_file" \
              --log-file "$log_file" \
              --mode "$mode" \
              --version "$TEST_VERSION" &
            server_pid=$!

            for _ in $(seq 1 100); do
              [ -s "$port_file" ] && break
              sleep 0.1
            done
            if [ ! -s "$port_file" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              echo "Mock registry did not start"
              return 1
            fi

            registry="http://127.0.0.1:$(cat "$port_file")"
            set +e
            output=$(env \
              CI=true \
              HOME="$case_dir/home" \
              VP_HOME="$vp_home" \
              VP_NODE_MANAGER=no \
              VP_VERSION="$TEST_VERSION" \
              NPM_CONFIG_REGISTRY="$registry" \
              bash packages/cli/install.sh 2>&1)
            status=$?
            set -e

            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              echo "Expected the fixture tarball endpoint to prevent installation"
              return 1
            fi

            if [ "$expected" = reject ]; then
              printf '%s\n' "$output" | grep -F \
                "does not contain supported npm provenance metadata"
              printf '%s\n' "$output" | grep -F \
                "@voidzero-dev/vite-plus-cli-"
              printf '%s\n' "$output" | grep -F "$TEST_VERSION"

              if grep -F '"path":"/platform.tgz"' "$log_file"; then
                echo "Platform tarball was requested before provenance validation"
                return 1
              fi
              if [ -e "$vp_home/current" ] || [ -e "$vp_home/$TEST_VERSION/bin/vp" ]; then
                echo "Rejected package left an active or executable installation"
                return 1
              fi
            else
              if printf '%s\n' "$output" | grep -F \
                "does not contain supported npm provenance metadata"; then
                echo "Supported provenance metadata was rejected"
                return 1
              fi
              grep -F '"path":"/platform.tgz"' "$log_file"
            fi
          }

          run_case missing reject
          run_case malformed reject
          run_case top-level-only reject
          run_case dotted-top-level-key reject
          run_case unsupported reject
          run_case valid-v1 allow
          run_case valid-v0.2 allow

  test-vp-upgrade-provenance:
    name: Test vp upgrade (npm provenance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone

      - uses: oxc-project/setup-rust@68c3199c5339f965e6e163924c3c450773eba42b # main (pending v1.0.17 — Swatinem/rust-cache v2.9.1 for node24)

      - name: Test shared provenance resolver
        run: cargo test -p vp_setup registry

      - name: Build global vp
        run: cargo build -p vp_global_cli

      - name: Verify upgrade provenance before download
        env:
          TEST_VERSION: 9.9.9-provenance-test.1
        run: |
          case_dir="$RUNNER_TEMP/vite-plus-provenance-upgrade"
          port_file="$case_dir/port"
          log_file="$case_dir/requests.jsonl"
          rm -rf "$case_dir"
          mkdir -p "$case_dir"

          node packages/cli/tests/fixtures/provenance-registry.mjs \
            --port-file "$port_file" \
            --log-file "$log_file" \
            --mode missing \
            --version "$TEST_VERSION" &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 100); do
            [ -s "$port_file" ] && break
            sleep 0.1
          done
          if [ ! -s "$port_file" ]; then
            echo "Mock registry did not start"
            exit 1
          fi

          registry="http://127.0.0.1:$(cat "$port_file")"
          run_upgrade() {
            label="$1"
            shift
            home_dir="$case_dir/home-$label"
            vp_home="$case_dir/vp-home-$label"
            mkdir -p "$home_dir"

            set +e
            output=$(env \
              CI=true \
              HOME="$home_dir" \
              VP_HOME="$vp_home" \
              target/debug/vp upgrade "$TEST_VERSION" --registry "$registry" "$@" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              echo "Expected vp upgrade $label to reject missing provenance"
              return 1
            fi
            printf '%s\n' "$output" | grep -F \
              "does not contain supported npm provenance metadata"
            printf '%s\n' "$output" | grep -F \
              "@voidzero-dev/vite-plus-cli-"
            printf '%s\n' "$output" | grep -F "$TEST_VERSION"

            if [ -e "$vp_home/current" ] || [ -e "$vp_home/$TEST_VERSION" ]; then
              echo "Rejected upgrade changed the active or target version"
              return 1
            fi
          }

          run_upgrade install
          run_upgrade check --check

          if grep -F '"path":"/platform.tgz"' "$log_file"; then
            echo "Platform tarball was requested before provenance validation"
            exit 1
          fi
          grep -F '"path":"/@voidzero-dev/vite-plus-cli-' "$log_file"

  test-install-sh-readonly-config:
    name: Test install.sh (readonly shell config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Make shell config files read-only
        run: |
          # Simulate Nix-managed or read-only shell configs
          touch ~/.bashrc ~/.bash_profile ~/.profile
          chmod 444 ~/.bashrc ~/.bash_profile ~/.profile

      - name: Run install.sh
        run: |
          output=$(cat packages/cli/install.sh | bash 2>&1) || {
            echo "$output"
            echo "Install script exited with non-zero status"
            exit 1
          }
          echo "$output"
          # Verify installation succeeds (not a fatal error)
          echo "$output" | grep -q "successfully installed"
          # Verify fallback message shows binary location
          echo "$output" | grep -q "vp was installed to:"
          # Verify fallback message shows manual instructions
          echo "$output" | grep -q "Or run vp directly:"
          # Verify the permission warning was shown
          echo "$output" | grep -qi "permission denied"

      - name: Verify vp works via direct path
        run: |
          ~/.vite-plus/bin/vp --version

  test-install-sh-arm64:
    name: Test install.sh (Linux ARM64 glibc via QEMU)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Run install.sh in ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            ubuntu:20.04 bash -c "
              ls -al ~/
              apt-get update && apt-get install -y curl ca-certificates
              cat /workspace/packages/cli/install.sh | bash
              if [ -f ~/.profile ]; then
                source ~/.profile
              elif [ -f ~/.bashrc ]; then
                source ~/.bashrc
              else
                export PATH="$HOME/.vite-plus/bin:$PATH"
              fi

              vp --version
              vp --help
              vp dlx print-current-version

              # Verify bin setup
              BIN_PATH=\"\$HOME/.vite-plus/bin\"
              if [ ! -d \"\$BIN_PATH\" ]; then
                echo \"Error: Bin directory not found: \$BIN_PATH\"
                exit 1
              fi
              for shim in node npm npx; do
                if [ ! -f \"\$BIN_PATH/\$shim\" ]; then
                  echo \"Error: Shim not found: \$BIN_PATH/\$shim\"
                  exit 1
                fi
                echo \"Found shim: \$BIN_PATH/\$shim\"
              done
              vp env doctor

              export VP_LOG=trace
              vp env run --node 24 -- node -p \"process.versions\"

              # Verify upgrade
              vp upgrade --check
              vp upgrade 0.1.14-alpha.1
              vp --version
              vp upgrade --rollback
              vp --version

              # FIXME: qemu: uncaught target signal 11 (Segmentation fault) - core dumped
              # vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
              # cd hello && vp run build
            "

  test-install-sh-musl-x64:
    name: Test install.sh (Linux x64 musl)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Run install.sh in Alpine container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e CI=true \
            alpine:3.21 sh -c "
              # libstdc++: required by unofficial-builds Node.js musl binary
              apk add --no-cache bash curl ca-certificates libstdc++
              cat /workspace/packages/cli/install.sh | bash
              export PATH=\"\$HOME/.vite-plus/bin:\$PATH\"

              vp --version
              vp --help
              vp dlx print-current-version

              # Verify bin setup
              BIN_PATH=\"\$HOME/.vite-plus/bin\"
              if [ ! -d \"\$BIN_PATH\" ]; then
                echo \"Error: Bin directory not found: \$BIN_PATH\"
                exit 1
              fi
              for shim in node npm npx; do
                if [ ! -f \"\$BIN_PATH/\$shim\" ]; then
                  echo \"Error: Shim not found: \$BIN_PATH/\$shim\"
                  exit 1
                fi
                echo \"Found shim: \$BIN_PATH/\$shim\"
              done
              vp env doctor
              vp env run --node 24 -- node -p \"process.versions\"

              # Test create command
              vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
              cd hello && vp run build && vp --version
              cd ..

              # Verify upgrade
              vp upgrade --check
              vp upgrade 0.1.14-alpha.1
              vp --version
              vp upgrade --rollback
              vp --version
            "

  test-install-sh-musl-arm64:
    name: Test install.sh (Linux ARM64 musl via QEMU)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Run install.sh in ARM64 Alpine container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -e CI=true \
            alpine:3.21 sh -c "
              # libstdc++ is needed by unofficial-builds Node.js musl binary
              apk add --no-cache bash curl ca-certificates libstdc++
              cat /workspace/packages/cli/install.sh | bash
              export PATH=\"\$HOME/.vite-plus/bin:\$PATH\"

              vp --version
              vp --help
              vp dlx print-current-version

              # Verify bin setup
              BIN_PATH=\"\$HOME/.vite-plus/bin\"
              if [ ! -d \"\$BIN_PATH\" ]; then
                echo \"Error: Bin directory not found: \$BIN_PATH\"
                exit 1
              fi
              for shim in node npm npx; do
                if [ ! -f \"\$BIN_PATH/\$shim\" ]; then
                  echo \"Error: Shim not found: \$BIN_PATH/\$shim\"
                  exit 1
                fi
                echo \"Found shim: \$BIN_PATH/\$shim\"
              done
              vp env doctor

              export VP_LOG=trace
              vp env run --node 24 -- node -p \"process.versions\"

              # FIXME: QEMU doesn't support all syscalls needed by rolldown/tsdown
              # vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
              # cd hello && vp run build && vp --version

              # Verify upgrade
              vp upgrade --check
              vp upgrade 0.1.14-alpha.1
              vp --version
              vp upgrade --rollback
              vp --version
            "

  test-install-ps1-v5:
    name: Test install.ps1 (Windows x64, PowerShell 5.1)
    runs-on: namespace-profile-windows-4c-8g
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Pin VP_HOME to USERPROFILE
        # Namespace's Windows runners run jobs under a service account whose real
        # profile (C:\Windows\system32\config\systemprofile) differs from
        # %USERPROFILE%; vp resolves its home from the OS profile. Pin VP_HOME so
        # the install, generated shims, and these assertions share one location.
        shell: bash
        run: echo "VP_HOME=$USERPROFILE\.vite-plus" >> $GITHUB_ENV

      - name: Assert PowerShell 5.x
        shell: powershell
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Error "Expected PowerShell 5.x but got $($PSVersionTable.PSVersion)"
            exit 1
          }

      - name: Run install.ps1
        shell: powershell
        run: |
          & ./packages/cli/install.ps1

      - name: Run install.ps1 via irm simulation (catches BOM issues)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Get-Content ./packages/cli/install.ps1 -Raw | Invoke-Expression

      - name: Set PATH
        shell: bash
        run: |
          echo "$USERPROFILE\.vite-plus\bin" >> $GITHUB_PATH

      - name: Verify installation
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          Write-Host "PATH: $env:Path"
          vp --version
          vp --help
          vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
          cd hello
          vp run build
          vp --version

      - name: Verify bin setup
        shell: powershell
        run: |
          $binPath = "$env:USERPROFILE\.vite-plus\bin"
          Get-ChildItem -Force $binPath
          if (-not (Test-Path $binPath)) {
            Write-Error "Bin directory not found: $binPath"
            exit 1
          }

          $expectedShims = @("node.exe", "npm.exe", "npx.exe")
          foreach ($shim in $expectedShims) {
            $shimFile = Join-Path $binPath $shim
            if (-not (Test-Path $shimFile)) {
              Write-Error "Shim not found: $shimFile"
              exit 1
            }
            Write-Host "Found shim: $shimFile"
          }
          where.exe node
          where.exe npm
          where.exe npx
          where.exe vp

          $env:Path = "$env:USERPROFILE\.vite-plus\bin;$env:Path"
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

      - name: Verify upgrade
        shell: powershell
        run: |
          vp upgrade --check
          vp upgrade 0.1.14-alpha.1
          vp --version
          vp upgrade --rollback
          vp --version

  test-install-ps1-arm64:
    name: Test install.ps1 (Windows ARM64)
    runs-on: windows-11-arm
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Run install.ps1
        shell: pwsh
        run: |
          & ./packages/cli/install.ps1

      - name: Set PATH
        shell: bash
        run: |
          echo "$USERPROFILE\.vite-plus\bin" >> $GITHUB_PATH

      - name: Verify installation
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Write-Host "PATH: $env:Path"
          vp --version
          vp --help
          vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
          cd hello
          vp run build
          vp --version

      - name: Verify bin setup
        shell: pwsh
        run: |
          $binPath = "$env:USERPROFILE\.vite-plus\bin"
          Get-ChildItem -Force $binPath
          if (-not (Test-Path $binPath)) {
            Write-Error "Bin directory not found: $binPath"
            exit 1
          }

          $expectedShims = @("node.exe", "npm.exe", "npx.exe")
          foreach ($shim in $expectedShims) {
            $shimFile = Join-Path $binPath $shim
            if (-not (Test-Path $shimFile)) {
              Write-Error "Shim not found: $shimFile"
              exit 1
            }
            Write-Host "Found shim: $shimFile"
          }
          where.exe node
          where.exe npm
          where.exe npx
          where.exe vp

          $env:Path = "$env:USERPROFILE\.vite-plus\bin;$env:Path"
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

      - name: Verify upgrade
        shell: pwsh
        run: |
          vp upgrade --check
          vp upgrade 0.1.14-alpha.1
          vp --version
          vp upgrade --rollback
          vp --version

  test-install-ps1-v76:
    name: Test install.ps1 (Windows x64, PowerShell 7.6)
    runs-on: namespace-profile-windows-4c-8g
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Pin VP_HOME to USERPROFILE
        # Namespace's Windows runners run jobs under a service account whose real
        # profile (C:\Windows\system32\config\systemprofile) differs from
        # %USERPROFILE%; vp resolves its home from the OS profile. Pin VP_HOME so
        # the install, generated shims, and these assertions share one location.
        shell: bash
        run: echo "VP_HOME=$USERPROFILE\.vite-plus" >> $GITHUB_ENV

      - name: Install PowerShell 7.6
        shell: pwsh
        run: |
          # --tool-path (not --global): a global tool install resolves the target
          # under the OS user profile, which is the service-account systemprofile
          # on Namespace, not %USERPROFILE%. An explicit path is account-independent.
          dotnet tool install --tool-path "$env:USERPROFILE\.dotnet\tools" PowerShell --version 7.6.0
          $pwsh76 = "$env:USERPROFILE\.dotnet\tools\pwsh.exe"
          echo "PWSH76=$pwsh76" >> $env:GITHUB_ENV
          $ver = & $pwsh76 -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          Write-Host "PowerShell version: $ver"
          if (-not $ver.StartsWith("7.6")) {
            Write-Error "Expected PowerShell 7.6.x but got $ver"
            exit 1
          }

      - name: Run install.ps1 via iex under PowerShell 7.6
        shell: pwsh
        run: |
          & $env:PWSH76 -NoProfile -Command "Get-Content ./packages/cli/install.ps1 -Raw | Invoke-Expression"

      - name: Set PATH
        shell: bash
        run: |
          echo "$USERPROFILE\.vite-plus\bin" >> $GITHUB_PATH

      - name: Verify installation
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Write-Host "PATH: $env:Path"
          vp --version
          vp --help
          vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
          cd hello
          vp run build
          vp --version

      - name: Verify bin setup
        shell: pwsh
        run: |
          $binPath = "$env:USERPROFILE\.vite-plus\bin"
          Get-ChildItem -Force $binPath
          if (-not (Test-Path $binPath)) {
            Write-Error "Bin directory not found: $binPath"
            exit 1
          }

          $expectedShims = @("node.exe", "npm.exe", "npx.exe")
          foreach ($shim in $expectedShims) {
            $shimFile = Join-Path $binPath $shim
            if (-not (Test-Path $shimFile)) {
              Write-Error "Shim not found: $shimFile"
              exit 1
            }
            Write-Host "Found shim: $shimFile"
          }
          where.exe node
          where.exe npm
          where.exe npx
          where.exe vp

          $env:Path = "$env:USERPROFILE\.vite-plus\bin;$env:Path"
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

      - name: Verify upgrade
        shell: pwsh
        run: |
          vp upgrade --check
          vp upgrade 0.1.14-alpha.1
          vp --version
          vp upgrade --rollback
          vp --version

  test-install-ps1-provenance:
    name: Test install.ps1 (npm provenance, Windows PowerShell 5.1)
    runs-on: namespace-profile-windows-4c-8g
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Verify platform package provenance before download
        shell: powershell
        env:
          TEST_VERSION: 9.9.9-provenance-test.1
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-ProvenanceCase {
            param(
              [string]$Mode,
              [bool]$ExpectRejection,
              [bool]$RawContentType = $false
            )

            $caseDir = Join-Path $env:RUNNER_TEMP "vite-plus-provenance-ps1-$Mode"
            $homeDir = Join-Path $caseDir "home"
            $vpHome = Join-Path $caseDir "vp-home"
            $portFile = Join-Path $caseDir "port"
            $logFile = Join-Path $caseDir "requests.jsonl"
            $stdoutFile = Join-Path $caseDir "registry.stdout.log"
            $stderrFile = Join-Path $caseDir "registry.stderr.log"
            $installerStdoutFile = Join-Path $caseDir "installer.stdout.log"
            $installerStderrFile = Join-Path $caseDir "installer.stderr.log"

            Remove-Item -Path $caseDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $homeDir, $vpHome -Force | Out-Null

            $fixture = Join-Path (Get-Location) "packages/cli/tests/fixtures/provenance-registry.mjs"
            $serverArgs = @(
              $fixture,
              "--port-file", $portFile,
              "--log-file", $logFile,
              "--mode", $Mode,
              "--version", $env:TEST_VERSION
            )
            if ($RawContentType) {
              $serverArgs += @("--raw-content-type", "true")
            }

            $server = Start-Process -FilePath "node" -ArgumentList $serverArgs -PassThru -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile

            try {
              for ($attempt = 0; $attempt -lt 100 -and -not (Test-Path $portFile); $attempt++) {
                Start-Sleep -Milliseconds 100
              }
              if (-not (Test-Path $portFile)) {
                throw "Mock registry did not start: $(Get-Content $stderrFile -Raw -ErrorAction SilentlyContinue)"
              }

              $registry = "http://127.0.0.1:$(Get-Content $portFile -Raw)"
              $env:CI = "true"
              $env:USERPROFILE = $homeDir
              $env:VP_HOME = $vpHome
              $env:VP_NODE_MANAGER = "no"
              $env:VP_VERSION = $env:TEST_VERSION
              $env:NPM_CONFIG_REGISTRY = $registry

              # Windows PowerShell 5.1 turns redirected native stderr into a
              # NativeCommandError. Capture each stream separately so the
              # expected tarball failure cannot stop this parent test script.
              $installerArgs = @(
                "-NoProfile",
                "-ExecutionPolicy", "Bypass",
                "-File", ".\packages\cli\install.ps1"
              )
              $installer = Start-Process -FilePath "powershell.exe" -ArgumentList $installerArgs -PassThru -Wait -RedirectStandardOutput $installerStdoutFile -RedirectStandardError $installerStderrFile
              $exitCode = $installer.ExitCode
              $text = @(
                Get-Content -Path $installerStdoutFile -Raw -ErrorAction SilentlyContinue
                Get-Content -Path $installerStderrFile -Raw -ErrorAction SilentlyContinue
              ) -join "`n"
            } finally {
              if (-not $server.HasExited) {
                Stop-Process -Id $server.Id -Force
                $server.WaitForExit()
              }
            }

            Write-Host $text
            if ($exitCode -eq 0) {
              throw "Expected the fixture tarball endpoint to prevent installation"
            }

            $requests = Get-Content -Path $logFile -Raw
            $tarballRequested = $requests.Contains('"path":"/platform.tgz"')
            $provenanceError = "does not contain supported npm provenance metadata"

            if ($ExpectRejection) {
              if (-not $text.Contains($provenanceError)) {
                throw "Expected provenance rejection for $Mode"
              }
              if (-not $text.Contains("@voidzero-dev/vite-plus-cli-") -or
                  -not $text.Contains($env:TEST_VERSION)) {
                throw "Expected rejected package name and version in installer output"
              }
              if ($tarballRequested) {
                throw "Platform tarball was requested before provenance validation"
              }
              if ((Test-Path (Join-Path $vpHome "current")) -or
                  (Test-Path (Join-Path $vpHome "$($env:TEST_VERSION)\bin\vp.exe"))) {
                throw "Rejected package left an active or executable installation"
              }
            } else {
              if ($text.Contains($provenanceError)) {
                throw "Supported provenance metadata was rejected"
              }
              if (-not $tarballRequested) {
                throw "Supported provenance metadata did not reach the tarball endpoint"
              }
            }

            # The child installer and the deliberate tarball failure are expected.
            $global:LASTEXITCODE = 0
          }

          Invoke-ProvenanceCase -Mode "missing" -ExpectRejection $true
          Invoke-ProvenanceCase -Mode "malformed" -ExpectRejection $true
          Invoke-ProvenanceCase -Mode "top-level-only" -ExpectRejection $true -RawContentType $true
          Invoke-ProvenanceCase -Mode "dotted-top-level-key" -ExpectRejection $true
          Invoke-ProvenanceCase -Mode "unsupported" -ExpectRejection $true
          Invoke-ProvenanceCase -Mode "valid-v1" -ExpectRejection $false
          Invoke-ProvenanceCase -Mode "valid-v0.2" -ExpectRejection $false

  test-install-ps1-release-age:
    name: Test install.ps1 (minimum-release-age)
    runs-on: namespace-profile-windows-4c-8g
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Verify minimumReleaseAge blocks non-interactive install
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:CI = "true"
          $env:VP_NODE_MANAGER = "no"
          $env:VP_HOME = Join-Path $env:RUNNER_TEMP "vite-plus-release-age"

          $npmrc = Join-Path $env:USERPROFILE ".npmrc"
          $backup = Join-Path $env:RUNNER_TEMP ".npmrc.backup"

          if (Test-Path $npmrc) {
            Move-Item -Path $npmrc -Destination $backup -Force
          }

          try {
            Set-Content -Path $npmrc -Value "minimum-release-age=10000000"

            $output = & powershell -NoProfile -ExecutionPolicy Bypass -File .\packages\cli\install.ps1 2>&1
            $exitCode = $LASTEXITCODE
            $text = $output -join "`n"
            Write-Host $text

            if ($exitCode -eq 0) {
              Write-Error "Expected install.ps1 to fail when pnpm minimum-release-age blocks vite-plus"
              exit 1
            }

            if ($text -notmatch "Install blocked by your minimumReleaseAge setting") {
              Write-Error "Expected release-age block message in installer output"
              exit 1
            }

            if ($text -notmatch "ERR_PNPM_NO_MATURE_MATCHING_VERSION|minimumReleaseAge") {
              Write-Error "Expected pnpm release-age details in installer output"
              exit 1
            }

            $installLog = Get-ChildItem -Path $env:VP_HOME -Recurse -Filter install.log | Select-Object -First 1
            if (-not $installLog) {
              Write-Error "Expected install.log to be written under VP_HOME"
              exit 1
            }

            $logText = Get-Content -Path $installLog.FullName -Raw
            if ($logText -notmatch "ERR_PNPM_NO_MATURE_MATCHING_VERSION|minimumReleaseAge") {
              Write-Error "Expected pnpm release-age details in install.log"
              exit 1
            }

            $overrideFiles = Get-ChildItem -Path $env:VP_HOME -Recurse -Force -Filter .npmrc |
              Where-Object { $_.FullName -notmatch "\\js_runtime\\" }
            if ($overrideFiles) {
              Write-Host "Unexpected override files:"
              $overrideFiles | ForEach-Object { Write-Host $_.FullName }
              Write-Error "Non-interactive install must not write minimum-release-age overrides"
              exit 1
            }

            # The child install.ps1 is expected to fail in this test. Reset the
            # native command exit code so the GitHub Actions PowerShell wrapper
            # does not fail the step after our assertions pass.
            $global:LASTEXITCODE = 0
          } finally {
            Remove-Item -Path $npmrc -Force -ErrorAction SilentlyContinue
            if (Test-Path $backup) {
              Move-Item -Path $backup -Destination $npmrc -Force
            }
          }

  test-install-ps1:
    name: Test install.ps1 (Windows x64)
    # Stays on GitHub-hosted windows-latest, NOT the Namespace Windows runner.
    # This job runs `vp env doctor` under bash `set -e`, and doctor compares vp's
    # resolved home against PATH. Namespace's Windows runners execute jobs under a
    # Session-0 service account whose real profile is
    # C:\Windows\system32\config\systemprofile, not %USERPROFILE%, so even with
    # VP_HOME set the installed vp resolves the systemprofile home and doctor
    # fails. The other install jobs pass on Namespace because they don't run
    # `vp env doctor` under `set -e`.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Run install.ps1
        shell: pwsh
        run: |
          & ./packages/cli/install.ps1

      - name: Set PATH
        shell: bash
        run: |
          echo "$USERPROFILE\.vite-plus\bin" >> $GITHUB_PATH

      - name: Verify upgrade
        shell: pwsh
        run: |
          # --check queries npm registry and prints update status
          vp upgrade --check
          vp upgrade 0.1.14-alpha.1
          vp --version
          # rollback to the previous version (should succeed after a real update)
          vp upgrade --rollback
          vp --version

      - name: Verify installation on powershell
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          # Print PATH from environment
          echo "PATH: $env:Path"
          vp --version
          vp --help
          # $env:VP_LOG = "trace"
          # test create command
          vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
          cd hello && vp run build && vp --version

      - name: Verify bin setup on powershell
        shell: pwsh
        run: |
          # Verify bin directory was created by vp env --setup
          $binPath = "$env:USERPROFILE\.vite-plus\bin"
          Get-ChildItem -Force $binPath
          if (-not (Test-Path $binPath)) {
            Write-Error "Bin directory not found: $binPath"
            exit 1
          }

          # Verify shim executables exist (trampoline .exe files on Windows)
          $expectedShims = @("node.exe", "npm.exe", "npx.exe")
          foreach ($shim in $expectedShims) {
            $shimFile = Join-Path $binPath $shim
            if (-not (Test-Path $shimFile)) {
              Write-Error "Shim not found: $shimFile"
              exit 1
            }
            Write-Host "Found shim: $shimFile"
          }
          where.exe node
          where.exe npm
          where.exe npx
          where.exe vp

          # Verify vp env doctor works
          $env:Path = "$env:USERPROFILE\.vite-plus\bin;$env:Path"
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

      - name: Verify installation on cmd
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          echo PATH: %PATH%
          dir "%USERPROFILE%\.vite-plus"
          dir "%USERPROFILE%\.vite-plus\bin"

          REM test create command
          vp create vite --no-interactive --no-agent -- hello-cmd --no-interactive -t vanilla
          cd hello-cmd && vp run build && vp --version

      - name: Verify bin setup on cmd
        shell: cmd
        run: |
          REM Verify bin directory was created by vp env --setup
          set "BIN_PATH=%USERPROFILE%\.vite-plus\bin"
          dir "%BIN_PATH%"

          REM Verify shim executables exist (Windows uses trampoline .exe files)
          for %%s in (node.exe npm.exe npx.exe vp.exe) do (
            if not exist "%BIN_PATH%\%%s" (
              echo Error: Shim not found: %BIN_PATH%\%%s
              exit /b 1
            )
            echo Found shim: %BIN_PATH%\%%s
          )

          where node
          where npm
          where npx
          where vp

          REM Verify vp env doctor works
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

      - name: Verify installation on bash
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          echo "PATH: $PATH"
          ls -al ~/.vite-plus
          ls -al ~/.vite-plus/bin

          vp --version
          vp --help
          # test create command
          vp create vite --no-interactive --no-agent -- hello-bash --no-interactive -t vanilla
          cd hello-bash && vp run build && vp --version

      - name: Verify bin setup on bash
        shell: bash
        run: |
          # Verify bin directory was created by vp env --setup
          BIN_PATH="$HOME/.vite-plus/bin"
          ls -al "$BIN_PATH"
          if [ ! -d "$BIN_PATH" ]; then
            echo "Error: Bin directory not found: $BIN_PATH"
            exit 1
          fi

          # Verify trampoline .exe files exist
          for shim in node.exe npm.exe npx.exe vp.exe; do
            if [ ! -f "$BIN_PATH/$shim" ]; then
              echo "Error: Trampoline shim not found: $BIN_PATH/$shim"
              exit 1
            fi
            echo "Found trampoline shim: $BIN_PATH/$shim"
          done

          # Verify vp env doctor works
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

          which node
          which npm
          which npx
          which vp

  test-vp-setup-exe:
    name: Test vp-setup.exe (pwsh)
    runs-on: namespace-profile-windows-4c-8g
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone

      - name: Pin VP_HOME to USERPROFILE
        # Namespace's Windows runners run jobs under a service account whose real
        # profile (C:\Windows\system32\config\systemprofile) differs from
        # %USERPROFILE%; vp-setup.exe installs into VP_HOME (falling back to the OS
        # profile). Pin it so the install and these assertions share one location.
        shell: bash
        run: echo "VP_HOME=$USERPROFILE\.vite-plus" >> $GITHUB_ENV

      - name: Setup Dev Drive
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 12GB
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup

      - uses: oxc-project/setup-rust@68c3199c5339f965e6e163924c3c450773eba42b # main (pending v1.0.17 — Swatinem/rust-cache v2.9.1 for node24)
        with:
          target-dir: ${{ format('{0}/target', env.DEV_DRIVE) }}

      - name: Build vp-setup.exe
        shell: bash
        run: cargo build --release -p vp_installer

      - name: Verify vp-setup.exe provenance before download
        shell: pwsh
        env:
          TEST_VERSION: 9.9.9-provenance-test.1
        run: |
          $ErrorActionPreference = "Stop"
          $caseDir = Join-Path $env:RUNNER_TEMP "vite-plus-provenance-vp-setup"
          $installDir = Join-Path $caseDir "install"
          $portFile = Join-Path $caseDir "port"
          $logFile = Join-Path $caseDir "requests.jsonl"
          $stdoutFile = Join-Path $caseDir "registry.stdout.log"
          $stderrFile = Join-Path $caseDir "registry.stderr.log"
          Remove-Item -Path $caseDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $caseDir -Force | Out-Null

          $fixture = Join-Path (Get-Location) "packages/cli/tests/fixtures/provenance-registry.mjs"
          $serverArgs = @(
            $fixture,
            "--port-file", $portFile,
            "--log-file", $logFile,
            "--mode", "missing",
            "--version", $env:TEST_VERSION
          )
          $server = Start-Process -FilePath "node" -ArgumentList $serverArgs -PassThru -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile

          try {
            for ($attempt = 0; $attempt -lt 100 -and -not (Test-Path $portFile); $attempt++) {
              Start-Sleep -Milliseconds 100
            }
            if (-not (Test-Path $portFile)) {
              throw "Mock registry did not start: $(Get-Content $stderrFile -Raw -ErrorAction SilentlyContinue)"
            }

            $registry = "http://127.0.0.1:$(Get-Content $portFile -Raw)"
            $binary = "${{ format('{0}/target/release/vp-setup.exe', env.DEV_DRIVE) }}"
            $output = & $binary --yes --no-node-manager --no-modify-path --install-dir $installDir --registry $registry --version $env:TEST_VERSION 2>&1
            $exitCode = $LASTEXITCODE
            $text = $output -join "`n"
          } finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
              $server.WaitForExit()
            }
          }

          Write-Host $text
          if ($exitCode -eq 0) {
            throw "Expected vp-setup.exe to reject missing provenance"
          }
          if (-not $text.Contains("does not contain supported npm provenance metadata") -or
              -not $text.Contains("@voidzero-dev/vite-plus-cli-") -or
              -not $text.Contains($env:TEST_VERSION)) {
            throw "Expected provenance rejection with the package name and version"
          }

          $requests = Get-Content -Path $logFile -Raw
          if ($requests.Contains('"path":"/platform.tgz"')) {
            throw "Platform tarball was requested before provenance validation"
          }
          if ((Test-Path (Join-Path $installDir "current")) -or
              (Test-Path (Join-Path $installDir "bin\vp.exe")) -or
              (Test-Path (Join-Path $installDir $env:TEST_VERSION))) {
            throw "Rejected package left a partial vp-setup.exe installation"
          }

          # The child installer is expected to fail in this test.
          $global:LASTEXITCODE = 0

      - name: Install via vp-setup.exe (silent)
        shell: pwsh
        run: ${{ format('{0}/target/release/vp-setup.exe', env.DEV_DRIVE) }}

      - name: Set PATH
        shell: bash
        run: echo "$USERPROFILE/.vite-plus/bin" >> $GITHUB_PATH

      - name: Verify installation
        shell: pwsh
        run: |
          vp --version
          vp --help

      - name: Verify installation (cmd)
        shell: cmd
        run: |
          vp --version
          vp --help

      - name: Verify installation (bash)
        shell: bash
        run: |
          vp --version
          vp --help
