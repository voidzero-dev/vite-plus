name: Test Standalone Install Scripts

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    # Released-CLI jobs seed ~/.vite-plus so install.sh/ps1 take the Exist
    # (grandfather) branch against npm latest. Layout jobs build the branch
    # CLI and exercise fresh split install + legacy upgrade + implode.
    paths:
      - 'packages/cli/install.sh'
      - 'packages/cli/install.ps1'
      - 'packages/tools/src/install-global-cli.ts'
      - 'crates/vp_installer/**'
      - 'crates/vp_pm_cli/**'
      - 'crates/vp_setup/**'
      - 'crates/vp_shared/**'
      - 'crates/vp_global_cli/**'
      - 'crates/vp_trampoline/**'
      - '.github/workflows/test-standalone-install.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test-install-sh:
    name: Test install.sh (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64 glibc
          - os: macos-15-intel
            name: macOS x64
          - os: macos-latest
            name: macOS ARM64
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Seed legacy root (released CLI uses grandfather path)
        run: mkdir -p "$HOME/.vite-plus"

      - name: Run install.sh
        run: cat packages/cli/install.sh | bash

      - name: Verify installation
        working-directory: ${{ runner.temp }}
        run: |
          # Source shell config to get PATH updated
          if [ -f ~/.zshenv ]; then
            # non-interactive shells use zshenv
            source ~/.zshenv
          elif [ -f ~/.zshrc ]; then
            # interactive shells use zshrc
            source ~/.zshrc
          elif [ -f ~/.bash_profile ]; then
            # non-interactive shells use bash_profile
            source ~/.bash_profile
          elif [ -f ~/.bashrc ]; then
            # interactive shells use bashrc
            source ~/.bashrc
          else
            export PATH="$HOME/.vite-plus/bin:$PATH"
          fi
          echo "PATH: $PATH"
          ls -al ~/

          vp --version
          vp --help
          # test create command
          vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
          cd hello && vp run build && vp --version

      - name: Set PATH
        shell: bash
        run: |
          echo "$HOME/.vite-plus/bin" >> $GITHUB_PATH

      - name: Verify bin setup
        run: |
          # Verify bin directory was created by vp env --setup
          BIN_PATH="$HOME/.vite-plus/bin"
          ls -al "$BIN_PATH"
          if [ ! -d "$BIN_PATH" ]; then
            echo "Error: Bin directory not found: $BIN_PATH"
            exit 1
          fi

          # Verify shim executables exist
          for shim in node npm npx; do
            if [ ! -f "$BIN_PATH/$shim" ]; then
              echo "Error: Shim not found: $BIN_PATH/$shim"
              exit 1
            fi
            echo "Found shim: $BIN_PATH/$shim"
          done

          # Verify vp env doctor works
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

          which node
          which npm
          which npx
          which vp

      - name: Verify upgrade
        run: |
          # --check queries npm registry and prints update status
          vp upgrade --check
          vp upgrade 0.1.14-alpha.1
          vp --version
          # rollback to the previous version (should succeed after a real update)
          vp upgrade --rollback
          vp --version

  test-install-sh-readonly-config:
    name: Test install.sh (readonly shell config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Make shell config files read-only
        run: |
          # Simulate Nix-managed or read-only shell configs
          touch ~/.bashrc ~/.bash_profile ~/.profile
          chmod 444 ~/.bashrc ~/.bash_profile ~/.profile

      - name: Run install.sh
        run: |
          mkdir -p "$HOME/.vite-plus"
          output=$(cat packages/cli/install.sh | bash 2>&1) || {
            echo "$output"
            echo "Install script exited with non-zero status"
            exit 1
          }
          echo "$output"
          # Verify installation succeeds (not a fatal error)
          echo "$output" | grep -q "successfully installed"
          # Verify fallback message shows binary location
          echo "$output" | grep -q "vp was installed to:"
          # Verify fallback message shows manual instructions
          echo "$output" | grep -q "Or run vp directly:"
          # Verify the permission warning was shown
          echo "$output" | grep -qi "permission denied"

      - name: Verify vp works via direct path
        run: |
          ~/.vite-plus/bin/vp --version

  test-install-sh-arm64:
    name: Test install.sh (Linux ARM64 glibc via QEMU)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Run install.sh in ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            ubuntu:20.04 bash -c "
              ls -al ~/
              apt-get update && apt-get install -y curl ca-certificates
              # Escape \$HOME so the container expands it (not the GHA host).
              mkdir -p \"\$HOME/.vite-plus\" && cat /workspace/packages/cli/install.sh | bash
              if [ -f ~/.profile ]; then
                source ~/.profile
              elif [ -f ~/.bashrc ]; then
                source ~/.bashrc
              else
                export PATH=\"\$HOME/.vite-plus/bin:\$PATH\"
              fi

              vp --version
              vp --help
              vp dlx print-current-version

              # Verify bin setup
              BIN_PATH=\"\$HOME/.vite-plus/bin\"
              if [ ! -d \"\$BIN_PATH\" ]; then
                echo \"Error: Bin directory not found: \$BIN_PATH\"
                exit 1
              fi
              for shim in node npm npx; do
                if [ ! -f \"\$BIN_PATH/\$shim\" ]; then
                  echo \"Error: Shim not found: \$BIN_PATH/\$shim\"
                  exit 1
                fi
                echo \"Found shim: \$BIN_PATH/\$shim\"
              done
              vp env doctor

              export VP_LOG=trace
              vp env run --node 24 -- node -p \"process.versions\"

              # Verify upgrade
              vp upgrade --check
              vp upgrade 0.1.14-alpha.1
              vp --version
              vp upgrade --rollback
              vp --version

              # FIXME: qemu: uncaught target signal 11 (Segmentation fault) - core dumped
              # vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
              # cd hello && vp run build
            "

  test-install-sh-musl-x64:
    name: Test install.sh (Linux x64 musl)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Run install.sh in Alpine container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e CI=true \
            alpine:3.21 sh -c "
              # libstdc++: required by unofficial-builds Node.js musl binary
              apk add --no-cache bash curl ca-certificates libstdc++
              # Escape \$HOME so the container expands it (not the GHA host).
              mkdir -p \"\$HOME/.vite-plus\" && cat /workspace/packages/cli/install.sh | bash
              export PATH=\"\$HOME/.vite-plus/bin:\$PATH\"

              vp --version
              vp --help
              vp dlx print-current-version

              # Verify bin setup
              BIN_PATH=\"\$HOME/.vite-plus/bin\"
              if [ ! -d \"\$BIN_PATH\" ]; then
                echo \"Error: Bin directory not found: \$BIN_PATH\"
                exit 1
              fi
              for shim in node npm npx; do
                if [ ! -f \"\$BIN_PATH/\$shim\" ]; then
                  echo \"Error: Shim not found: \$BIN_PATH/\$shim\"
                  exit 1
                fi
                echo \"Found shim: \$BIN_PATH/\$shim\"
              done
              vp env doctor
              vp env run --node 24 -- node -p \"process.versions\"

              # Test create command
              vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
              cd hello && vp run build && vp --version
              cd ..

              # Verify upgrade
              vp upgrade --check
              vp upgrade 0.1.14-alpha.1
              vp --version
              vp upgrade --rollback
              vp --version
            "

  test-install-sh-musl-arm64:
    name: Test install.sh (Linux ARM64 musl via QEMU)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Run install.sh in ARM64 Alpine container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -e CI=true \
            alpine:3.21 sh -c "
              # libstdc++ is needed by unofficial-builds Node.js musl binary
              apk add --no-cache bash curl ca-certificates libstdc++
              # Escape \$HOME so the container expands it (not the GHA host).
              mkdir -p \"\$HOME/.vite-plus\" && cat /workspace/packages/cli/install.sh | bash
              export PATH=\"\$HOME/.vite-plus/bin:\$PATH\"

              vp --version
              vp --help
              vp dlx print-current-version

              # Verify bin setup
              BIN_PATH=\"\$HOME/.vite-plus/bin\"
              if [ ! -d \"\$BIN_PATH\" ]; then
                echo \"Error: Bin directory not found: \$BIN_PATH\"
                exit 1
              fi
              for shim in node npm npx; do
                if [ ! -f \"\$BIN_PATH/\$shim\" ]; then
                  echo \"Error: Shim not found: \$BIN_PATH/\$shim\"
                  exit 1
                fi
                echo \"Found shim: \$BIN_PATH/\$shim\"
              done
              vp env doctor

              export VP_LOG=trace
              vp env run --node 24 -- node -p \"process.versions\"

              # FIXME: QEMU doesn't support all syscalls needed by rolldown/tsdown
              # vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
              # cd hello && vp run build && vp --version

              # Verify upgrade
              vp upgrade --check
              vp upgrade 0.1.14-alpha.1
              vp --version
              vp upgrade --rollback
              vp --version
            "

  test-install-ps1-v5:
    name: Test install.ps1 (Windows x64, PowerShell 5.1)
    runs-on: namespace-profile-windows-4c-8g
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Seed legacy root under USERPROFILE
        # Seed ~/.vite-plus so install takes the grandfather (Exist) branch
        # under the runner profile (same as VpDirs Home rule).
        shell: bash
        run: mkdir -p "$USERPROFILE/.vite-plus"

      - name: Assert PowerShell 5.x
        shell: powershell
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Error "Expected PowerShell 5.x but got $($PSVersionTable.PSVersion)"
            exit 1
          }

      - name: Run install.ps1
        shell: powershell
        run: |
          & ./packages/cli/install.ps1

      - name: Run install.ps1 via irm simulation (catches BOM issues)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Get-Content ./packages/cli/install.ps1 -Raw | Invoke-Expression

      - name: Set PATH
        shell: bash
        run: |
          echo "$USERPROFILE\.vite-plus\bin" >> $GITHUB_PATH

      - name: Verify installation
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          Write-Host "PATH: $env:Path"
          vp --version
          vp --help
          vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
          cd hello
          vp run build
          vp --version

      - name: Verify bin setup
        shell: powershell
        run: |
          $binPath = "$env:USERPROFILE\.vite-plus\bin"
          Get-ChildItem -Force $binPath
          if (-not (Test-Path $binPath)) {
            Write-Error "Bin directory not found: $binPath"
            exit 1
          }

          $expectedShims = @("node.exe", "npm.exe", "npx.exe")
          foreach ($shim in $expectedShims) {
            $shimFile = Join-Path $binPath $shim
            if (-not (Test-Path $shimFile)) {
              Write-Error "Shim not found: $shimFile"
              exit 1
            }
            Write-Host "Found shim: $shimFile"
          }
          where.exe node
          where.exe npm
          where.exe npx
          where.exe vp

          $env:Path = "$env:USERPROFILE\.vite-plus\bin;$env:Path"
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

      - name: Verify upgrade
        shell: powershell
        run: |
          vp upgrade --check
          vp upgrade 0.1.14-alpha.1
          vp --version
          vp upgrade --rollback
          vp --version

  test-install-ps1-arm64:
    name: Test install.ps1 (Windows ARM64)
    runs-on: windows-11-arm
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Seed legacy root (released CLI uses grandfather path)
        shell: bash
        run: mkdir -p "$USERPROFILE/.vite-plus"

      - name: Run install.ps1
        shell: pwsh
        run: |
          & ./packages/cli/install.ps1

      - name: Set PATH
        shell: bash
        run: |
          echo "$USERPROFILE\.vite-plus\bin" >> $GITHUB_PATH

      - name: Verify installation
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Write-Host "PATH: $env:Path"
          vp --version
          vp --help
          vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
          cd hello
          vp run build
          vp --version

      - name: Verify bin setup
        shell: pwsh
        run: |
          $binPath = "$env:USERPROFILE\.vite-plus\bin"
          Get-ChildItem -Force $binPath
          if (-not (Test-Path $binPath)) {
            Write-Error "Bin directory not found: $binPath"
            exit 1
          }

          $expectedShims = @("node.exe", "npm.exe", "npx.exe")
          foreach ($shim in $expectedShims) {
            $shimFile = Join-Path $binPath $shim
            if (-not (Test-Path $shimFile)) {
              Write-Error "Shim not found: $shimFile"
              exit 1
            }
            Write-Host "Found shim: $shimFile"
          }
          where.exe node
          where.exe npm
          where.exe npx
          where.exe vp

          $env:Path = "$env:USERPROFILE\.vite-plus\bin;$env:Path"
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

      - name: Verify upgrade
        shell: pwsh
        run: |
          vp upgrade --check
          vp upgrade 0.1.14-alpha.1
          vp --version
          vp upgrade --rollback
          vp --version

  test-install-ps1-v76:
    name: Test install.ps1 (Windows x64, PowerShell 7.6)
    runs-on: namespace-profile-windows-4c-8g
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Seed legacy root under USERPROFILE
        # Seed ~/.vite-plus so install takes the grandfather (Exist) branch
        # under the runner profile (same as VpDirs Home rule).
        shell: bash
        run: mkdir -p "$USERPROFILE/.vite-plus"

      - name: Install PowerShell 7.6
        shell: pwsh
        run: |
          # --tool-path (not --global): a global tool install resolves the target
          # under the OS user profile, which is the service-account systemprofile
          # on Namespace, not %USERPROFILE%. An explicit path is account-independent.
          dotnet tool install --tool-path "$env:USERPROFILE\.dotnet\tools" PowerShell --version 7.6.0
          $pwsh76 = "$env:USERPROFILE\.dotnet\tools\pwsh.exe"
          echo "PWSH76=$pwsh76" >> $env:GITHUB_ENV
          $ver = & $pwsh76 -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          Write-Host "PowerShell version: $ver"
          if (-not $ver.StartsWith("7.6")) {
            Write-Error "Expected PowerShell 7.6.x but got $ver"
            exit 1
          }

      - name: Run install.ps1 via iex under PowerShell 7.6
        shell: pwsh
        run: |
          & $env:PWSH76 -NoProfile -Command "Get-Content ./packages/cli/install.ps1 -Raw | Invoke-Expression"

      - name: Set PATH
        shell: bash
        run: |
          echo "$USERPROFILE\.vite-plus\bin" >> $GITHUB_PATH

      - name: Verify installation
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Write-Host "PATH: $env:Path"
          vp --version
          vp --help
          vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
          cd hello
          vp run build
          vp --version

      - name: Verify bin setup
        shell: pwsh
        run: |
          $binPath = "$env:USERPROFILE\.vite-plus\bin"
          Get-ChildItem -Force $binPath
          if (-not (Test-Path $binPath)) {
            Write-Error "Bin directory not found: $binPath"
            exit 1
          }

          $expectedShims = @("node.exe", "npm.exe", "npx.exe")
          foreach ($shim in $expectedShims) {
            $shimFile = Join-Path $binPath $shim
            if (-not (Test-Path $shimFile)) {
              Write-Error "Shim not found: $shimFile"
              exit 1
            }
            Write-Host "Found shim: $shimFile"
          }
          where.exe node
          where.exe npm
          where.exe npx
          where.exe vp

          $env:Path = "$env:USERPROFILE\.vite-plus\bin;$env:Path"
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

      - name: Verify upgrade
        shell: pwsh
        run: |
          vp upgrade --check
          vp upgrade 0.1.14-alpha.1
          vp --version
          vp upgrade --rollback
          vp --version

  test-install-ps1-release-age:
    name: Test install.ps1 (minimum-release-age)
    runs-on: namespace-profile-windows-4c-8g
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Verify minimumReleaseAge blocks non-interactive install
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:CI = "true"
          $env:VP_NODE_MANAGER = "no"
          # Custom install root via deprecated VP_HOME (installer override / full legacy mapping)
          $env:VP_HOME = Join-Path $env:RUNNER_TEMP "vite-plus-release-age"

          $npmrc = Join-Path $env:USERPROFILE ".npmrc"
          $backup = Join-Path $env:RUNNER_TEMP ".npmrc.backup"

          if (Test-Path $npmrc) {
            Move-Item -Path $npmrc -Destination $backup -Force
          }

          try {
            Set-Content -Path $npmrc -Value "minimum-release-age=10000000"

            $output = & powershell -NoProfile -ExecutionPolicy Bypass -File .\packages\cli\install.ps1 2>&1
            $exitCode = $LASTEXITCODE
            $text = $output -join "`n"
            Write-Host $text

            if ($exitCode -eq 0) {
              Write-Error "Expected install.ps1 to fail when pnpm minimum-release-age blocks vite-plus"
              exit 1
            }

            if ($text -notmatch "Install blocked by your minimumReleaseAge setting") {
              Write-Error "Expected release-age block message in installer output"
              exit 1
            }

            if ($text -notmatch "ERR_PNPM_NO_MATURE_MATCHING_VERSION|minimumReleaseAge") {
              Write-Error "Expected pnpm release-age details in installer output"
              exit 1
            }

            $installLog = Get-ChildItem -Path $env:VP_HOME -Recurse -Filter install.log | Select-Object -First 1
            if (-not $installLog) {
              Write-Error "Expected install.log to be written under VP_HOME"
              exit 1
            }

            $logText = Get-Content -Path $installLog.FullName -Raw
            if ($logText -notmatch "ERR_PNPM_NO_MATURE_MATCHING_VERSION|minimumReleaseAge") {
              Write-Error "Expected pnpm release-age details in install.log"
              exit 1
            }

            $overrideFiles = Get-ChildItem -Path $env:VP_HOME -Recurse -Force -Filter .npmrc |
              Where-Object { $_.FullName -notmatch "\\js_runtime\\" }
            if ($overrideFiles) {
              Write-Host "Unexpected override files:"
              $overrideFiles | ForEach-Object { Write-Host $_.FullName }
              Write-Error "Non-interactive install must not write minimum-release-age overrides"
              exit 1
            }

            # The child install.ps1 is expected to fail in this test. Reset the
            # native command exit code so the GitHub Actions PowerShell wrapper
            # does not fail the step after our assertions pass.
            $global:LASTEXITCODE = 0
          } finally {
            Remove-Item -Path $npmrc -Force -ErrorAction SilentlyContinue
            if (Test-Path $backup) {
              Move-Item -Path $backup -Destination $npmrc -Force
            }
          }

  test-install-ps1:
    name: Test install.ps1 (Windows x64)
    # Stays on GitHub-hosted windows-latest, NOT the Namespace Windows runner.
    # This job runs `vp env doctor` under bash `set -e`, and doctor compares vp's
    # resolved home against PATH. Namespace's Windows runners execute jobs under a
    # Session-0 service account whose real profile is
    # C:\Windows\system32\config\systemprofile, not %USERPROFILE%, so even with
    # Without a seeded ~/.vite-plus the installed vp may resolve the systemprofile home and doctor
    # fails. The other install jobs pass on Namespace because they don't run
    # `vp env doctor` under `set -e`.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Seed legacy root (released CLI uses grandfather path)
        shell: bash
        run: mkdir -p "$USERPROFILE/.vite-plus"

      - name: Run install.ps1
        shell: pwsh
        run: |
          & ./packages/cli/install.ps1

      - name: Set PATH
        shell: bash
        run: |
          echo "$USERPROFILE\.vite-plus\bin" >> $GITHUB_PATH

      - name: Verify upgrade
        shell: pwsh
        run: |
          # --check queries npm registry and prints update status
          vp upgrade --check
          vp upgrade 0.1.14-alpha.1
          vp --version
          # rollback to the previous version (should succeed after a real update)
          vp upgrade --rollback
          vp --version

      - name: Verify installation on powershell
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          # Print PATH from environment
          echo "PATH: $env:Path"
          vp --version
          vp --help
          # $env:VP_LOG = "trace"
          # test create command
          vp create vite --no-interactive --no-agent -- hello --no-interactive -t vanilla
          cd hello && vp run build && vp --version

      - name: Verify bin setup on powershell
        shell: pwsh
        run: |
          # Verify bin directory was created by vp env --setup
          $binPath = "$env:USERPROFILE\.vite-plus\bin"
          Get-ChildItem -Force $binPath
          if (-not (Test-Path $binPath)) {
            Write-Error "Bin directory not found: $binPath"
            exit 1
          }

          # Verify shim executables exist (trampoline .exe files on Windows)
          $expectedShims = @("node.exe", "npm.exe", "npx.exe")
          foreach ($shim in $expectedShims) {
            $shimFile = Join-Path $binPath $shim
            if (-not (Test-Path $shimFile)) {
              Write-Error "Shim not found: $shimFile"
              exit 1
            }
            Write-Host "Found shim: $shimFile"
          }
          where.exe node
          where.exe npm
          where.exe npx
          where.exe vp

          # Verify vp env doctor works
          $env:Path = "$env:USERPROFILE\.vite-plus\bin;$env:Path"
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

      - name: Verify installation on cmd
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          echo PATH: %PATH%
          dir "%USERPROFILE%\.vite-plus"
          dir "%USERPROFILE%\.vite-plus\bin"

          REM test create command
          vp create vite --no-interactive --no-agent -- hello-cmd --no-interactive -t vanilla
          cd hello-cmd && vp run build && vp --version

      - name: Verify bin setup on cmd
        shell: cmd
        run: |
          REM Verify bin directory was created by vp env --setup
          set "BIN_PATH=%USERPROFILE%\.vite-plus\bin"
          dir "%BIN_PATH%"

          REM Verify shim executables exist (Windows uses trampoline .exe files)
          for %%s in (node.exe npm.exe npx.exe vp.exe) do (
            if not exist "%BIN_PATH%\%%s" (
              echo Error: Shim not found: %BIN_PATH%\%%s
              exit /b 1
            )
            echo Found shim: %BIN_PATH%\%%s
          )

          where node
          where npm
          where npx
          where vp

          REM Verify vp env doctor works
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

      - name: Verify installation on bash
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          echo "PATH: $PATH"
          ls -al ~/.vite-plus
          ls -al ~/.vite-plus/bin

          vp --version
          vp --help
          # test create command
          vp create vite --no-interactive --no-agent -- hello-bash --no-interactive -t vanilla
          cd hello-bash && vp run build && vp --version

      - name: Verify bin setup on bash
        shell: bash
        run: |
          # Verify bin directory was created by vp env --setup
          BIN_PATH="$HOME/.vite-plus/bin"
          ls -al "$BIN_PATH"
          if [ ! -d "$BIN_PATH" ]; then
            echo "Error: Bin directory not found: $BIN_PATH"
            exit 1
          fi

          # Verify trampoline .exe files exist
          for shim in node.exe npm.exe npx.exe vp.exe; do
            if [ ! -f "$BIN_PATH/$shim" ]; then
              echo "Error: Trampoline shim not found: $BIN_PATH/$shim"
              exit 1
            fi
            echo "Found trampoline shim: $BIN_PATH/$shim"
          done

          # Verify vp env doctor works
          vp env doctor
          vp env run --node 24 -- node -p "process.versions"

          which node
          which npm
          which npx
          which vp

  test-vp-setup-exe:
    name: Test vp-setup.exe (pwsh)
    runs-on: namespace-profile-windows-4c-8g
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone

      - name: Seed legacy root under USERPROFILE
        # Seed ~/.vite-plus so install takes the grandfather (Exist) branch
        # under the runner profile (same as VpDirs Home rule).
        shell: bash
        run: mkdir -p "$USERPROFILE/.vite-plus"

      - name: Setup Dev Drive
        uses: samypr100/setup-dev-drive@30f0f98ae5636b2b6501e181dfb3631b9974818d # v4.0.0
        with:
          drive-size: 12GB
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup

      - uses: oxc-project/setup-rust@68c3199c5339f965e6e163924c3c450773eba42b # main (pending v1.0.17 — Swatinem/rust-cache v2.9.1 for node24)
        with:
          target-dir: ${{ format('{0}/target', env.DEV_DRIVE) }}

      - name: Build vp-setup.exe
        shell: bash
        run: cargo build --release -p vp_installer

      - name: Install via vp-setup.exe (silent)
        # Pin VP_HOME to USERPROFILE so the installer does not follow BaseDirs
        # into the Session-0 systemprofile on Namespace Windows runners.
        shell: pwsh
        run: |
          $env:VP_HOME = Join-Path $env:USERPROFILE '.vite-plus'
          & ${{ format('{0}/target/release/vp-setup.exe', env.DEV_DRIVE) }}

      - name: Set PATH
        shell: bash
        run: echo "$USERPROFILE/.vite-plus/bin" >> $GITHUB_PATH

      - name: Verify installation
        shell: pwsh
        run: |
          vp --version
          vp --help

      - name: Verify installation (cmd)
        shell: cmd
        run: |
          vp --version
          vp --help

      - name: Verify installation (bash)
        shell: bash
        run: |
          vp --version
          vp --help

  # ── Branch CLI layout coverage (current install.sh + VpDirs) ────────────
  # Build the PR's vp binary and drive install.sh via install-global-cli so
  # we exercise the same script users run, without the registry bridge.

  test-install-split:
    name: Test install (split layout, local build, ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            shell: bash
          - os: macos-latest
            name: macOS
            shell: bash
          # GitHub-hosted windows-latest (not Namespace): split defaults use
          # %LOCALAPPDATA%/%APPDATA% under the runner profile, same reason
          # test-install-ps1 stays off Namespace Session-0 systemprofile.
          - os: windows-latest
            name: Windows
            shell: bash
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - uses: oxc-project/setup-rust@68c3199c5339f965e6e163924c3c450773eba42b # main (pending v1.0.17 — Swatinem/rust-cache v2.9.1 for node24)
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: install-layout-${{ matrix.os }}

      - name: Build vp CLI
        run: cargo build -p vp_global_cli -p vp_trampoline --release

      - name: Clean install roots (fresh split install)
        shell: bash
        run: |
          rm -rf "$HOME/.vite-plus"
          if [ "${{ runner.os }}" = "Windows" ]; then
            local_app="${LOCALAPPDATA:-$USERPROFILE/AppData/Local}"
            roaming_app="${APPDATA:-$USERPROFILE/AppData/Roaming}"
            rm -rf \
              "$local_app/vite-plus" \
              "$roaming_app/vite-plus"
          else
            rm -rf \
              "$HOME/.local/share/vite-plus" \
              "$HOME/.config/vite-plus" \
              "$HOME/.local/state/vite-plus" \
              "$HOME/.cache/vite-plus"
            rm -f "$HOME/.local/bin/vp"
          fi

      - name: Install via install script (local branch CLI)
        run: pnpm install-global-cli

      - name: Verify split layout
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            local_app="${LOCALAPPDATA:-$USERPROFILE/AppData/Local}"
            roaming_app="${APPDATA:-$USERPROFILE/AppData/Roaming}"
            bin_dir="$local_app/vite-plus/bin"
            data_dir="$local_app/vite-plus/data"
            config_dir="$roaming_app/vite-plus"
            vp_bin="$bin_dir/vp.exe"
            [ -f "$vp_bin" ] || { echo "::error::vp missing at $vp_bin"; exit 1; }
            [ -d "$data_dir/current" ] || { echo "::error::versions missing from the data dir"; exit 1; }
            [ -f "$config_dir/env.ps1" ] || [ -f "$config_dir/env" ] || {
              echo "::error::env script missing from the config dir ($config_dir)"
              ls -la "$config_dir" 2>/dev/null || true
              exit 1
            }
            [ ! -e "$HOME/.vite-plus" ] || { echo "::error::legacy root must not be created by a split install"; exit 1; }
            "$vp_bin" --version
          else
            [ -x "$HOME/.local/bin/vp" ] || { echo "::error::vp shim missing at ~/.local/bin/vp"; exit 1; }
            [ -d "$HOME/.local/share/vite-plus/current" ] || { echo "::error::versions missing from the data dir"; exit 1; }
            [ -f "$HOME/.config/vite-plus/env" ] || { echo "::error::env script missing from the config dir"; exit 1; }
            [ ! -e "$HOME/.vite-plus" ] || { echo "::error::legacy root must not be created by a split install"; exit 1; }
            "$HOME/.local/bin/vp" --version
          fi

      - name: Implode split install
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            local_app="${LOCALAPPDATA:-$USERPROFILE/AppData/Local}"
            roaming_app="${APPDATA:-$USERPROFILE/AppData/Roaming}"
            bin_dir="$local_app/vite-plus/bin"
            data_dir="$local_app/vite-plus/data"
            config_dir="$roaming_app/vite-plus"
            "$bin_dir/vp.exe" implode -y
            # Windows deferred delete may leave a .removing-* rename briefly;
            # data/config must not remain under their live paths.
            [ ! -e "$data_dir" ] || { echo "::error::data dir remains after implode"; exit 1; }
            [ ! -e "$config_dir" ] || { echo "::error::config dir remains after implode"; exit 1; }
            [ ! -e "$bin_dir/vp.exe" ] || { echo "::error::vp shim remains after implode"; exit 1; }
          else
            "$HOME/.local/bin/vp" implode -y
            [ ! -e "$HOME/.local/share/vite-plus" ] || { echo "::error::data dir remains after implode"; exit 1; }
            [ ! -e "$HOME/.config/vite-plus" ] || { echo "::error::config dir remains after implode"; exit 1; }
            # Shared ~/.local/bin must not be removed; only the vp shim.
            [ ! -e "$HOME/.local/bin/vp" ] || { echo "::error::vp shim remains after implode"; exit 1; }
          fi

  test-install-legacy-upgrade:
    name: Test install (legacy upgrade, local build, ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: ./.github/actions/clone

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - uses: oxc-project/setup-rust@68c3199c5339f965e6e163924c3c450773eba42b # main (pending v1.0.17 — Swatinem/rust-cache v2.9.1 for node24)
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: install-layout-${{ matrix.os }}

      - name: Build vp CLI
        run: cargo build -p vp_global_cli -p vp_trampoline --release

      - name: Seed empty legacy root
        shell: bash
        run: |
          # Exist gate: presence of ~/.vite-plus selects the grandfather layout
          # (same as VpDirs Home rule and install.sh LEGACY_LAYOUT=true).
          if [ "${{ runner.os }}" = "Windows" ]; then
            local_app="${LOCALAPPDATA:-$USERPROFILE/AppData/Local}"
            roaming_app="${APPDATA:-$USERPROFILE/AppData/Roaming}"
            rm -rf \
              "$local_app/vite-plus" \
              "$roaming_app/vite-plus"
          else
            rm -rf \
              "$HOME/.local/share/vite-plus" \
              "$HOME/.config/vite-plus" \
              "$HOME/.local/state/vite-plus" \
              "$HOME/.cache/vite-plus"
            rm -f "$HOME/.local/bin/vp"
          fi
          mkdir -p "$HOME/.vite-plus/bin"

      - name: Install via install script (local branch CLI)
        run: pnpm install-global-cli

      - name: Verify legacy layout preserved
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            vp_bin="$HOME/.vite-plus/bin/vp.exe"
            [ -f "$vp_bin" ] || { echo "::error::vp missing at $vp_bin"; exit 1; }
            [ -d "$HOME/.vite-plus/current" ] || { echo "::error::current missing under legacy root"; exit 1; }
            # Windows env scripts may be env.ps1 / env.cmd under the root.
            [ -f "$HOME/.vite-plus/env" ] || [ -f "$HOME/.vite-plus/env.ps1" ] || {
              echo "::error::env script should live under legacy root"
              ls -la "$HOME/.vite-plus" 2>/dev/null || true
              exit 1
            }
            local_app="${LOCALAPPDATA:-$USERPROFILE/AppData/Local}"
            [ ! -e "$local_app/vite-plus/data" ] || {
              echo "::error::split data dir must not be created on legacy upgrade"
              exit 1
            }
            "$vp_bin" --version
          else
            [ -x "$HOME/.vite-plus/bin/vp" ] || { echo "::error::vp missing at ~/.vite-plus/bin/vp"; exit 1; }
            [ -d "$HOME/.vite-plus/current" ] || { echo "::error::current missing under legacy root"; exit 1; }
            [ -f "$HOME/.vite-plus/env" ] || { echo "::error::env script should live under legacy root"; exit 1; }
            [ ! -e "$HOME/.local/share/vite-plus" ] || { echo "::error::split data dir must not be created on legacy upgrade"; exit 1; }
            "$HOME/.vite-plus/bin/vp" --version
          fi

      - name: Implode legacy install
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            "$HOME/.vite-plus/bin/vp.exe" implode -y
            # Deferred delete renames away the live path immediately.
            [ ! -e "$HOME/.vite-plus" ] || { echo "::error::legacy root remains after implode"; exit 1; }
          else
            "$HOME/.vite-plus/bin/vp" implode -y
            [ ! -e "$HOME/.vite-plus" ] || { echo "::error::legacy root remains after implode"; exit 1; }
          fi
