name: CI critical path benchmark R3
run-name: R3 / CI / ${{ inputs.variant }} / ${{ inputs.cache_state }}
'on':
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        options:
          - before
          - after
        required: true
      cache_state:
        type: choice
        options:
          - cold
          - warm
          - prime
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: vp-ci-critical-2961-r3
  cancel-in-progress: false
jobs:
  before:
    if: inputs.variant == 'before' && inputs.cache_state != 'prime'
    uses: ./.github/workflows/benchmark-ci-before.yml
    with:
      variant: ${{ inputs.variant }}
      cache_state: ${{ inputs.cache_state }}
  after:
    if: inputs.variant == 'after' && inputs.cache_state != 'prime'
    uses: ./.github/workflows/benchmark-ci-after.yml
    with:
      variant: ${{ inputs.variant }}
      cache_state: ${{ inputs.cache_state }}
  prime:
    if: inputs.cache_state == 'prime'
    uses: ./.github/workflows/benchmark-prime-caches.yml
