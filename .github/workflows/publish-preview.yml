name: Preview cache benchmark (before)
permissions: {}
'on':
  workflow_dispatch:
    inputs:
      cache_state:
        description: Restore isolated benchmark caches, or build without restored caches.
        type: choice
        options:
          - cold
          - warm
        required: true
        default: cold
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Compute preview metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      docs-origin: ${{ steps.docs.outputs.origin }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Test preview documentation origin
        run: node --test .github/scripts/__tests__/preview-docs-origin.mjs
      - name: Resolve preview documentation origin
        id: docs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            context.payload.pull_request ??= {
              number: 2961,
              head: { ref: 'perf/parallel-ci-steps', repo: { full_name: 'voidzero-dev/vite-plus' } },
              base: { repo: { full_name: 'voidzero-dev/vite-plus' } },
            };
            const { previewDocsOrigin } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-docs-origin.ts`);
            core.setOutput('origin', previewDocsOrigin(context.payload.pull_request));
      - name: Compute version
        id: version
        run: echo "version=0.0.0-commit.eae7a8b1ed8570ba348d55ac5c83be9bc15cf56e" >> "$GITHUB_OUTPUT"
  build-rust:
    name: Build bindings and binaries
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      docs-origin: ${{ needs.prepare.outputs.docs-origin }}
      cache-key: pkg-pr-new
      cache_state: ${{ inputs.cache_state }}
  publish:
    name: Pack preview packages
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-rust
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: ./.github/actions/clone
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Locate pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore or seed isolated package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ env.VP_CI_BENCH_PREFIX }}-preview-pack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          lookup-only: ${{ env.VP_CI_BENCH_CACHE_STATE == 'cold' }}
          fail-on-cache-miss: ${{ env.VP_CI_BENCH_CACHE_STATE == 'warm' }}
      - name: Install dependencies
        run: pnpm install
      - name: Set preview package versions
        run: |
          for package in cli core; do
            pnpm exec json-edit "packages/$package/package.json" '_.version = process.env.VERSION'
          done
      - name: Download cli dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: packages/cli/dist
          pattern: cli
          merge-multiple: true
      - name: Download cli docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: packages/cli/docs
          pattern: cli-docs
          merge-multiple: true
      - name: Download cli binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: packages/cli/artifacts
          pattern: vite-plus-native-*
      - name: Download core dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: packages/core/dist
          pattern: core
          merge-multiple: true
      - name: Download prompts dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: packages/prompts/dist
          pattern: prompts
          merge-multiple: true
      - uses: ./.github/actions/download-rolldown-binaries
        with:
          github-token: ${{ github.token }}
          target: x86_64-unknown-linux-gnu
          upload: 'false'
      - name: Download Rust CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: rust-cli-artifacts
          pattern: vp-global-cli-*
      - name: Prepare native addon and CLI binary packages
        run: node ./packages/cli/publish-native-addons.ts --mode pkg-pr-new
      - name: Pack packages for the registry bridge
        uses: voidzero-dev/pkg-pr-registry-bridge@4ca2c31c250c7137ae191bf01a8bb106d30aa106
        with:
          mode: pack
          sha: eae7a8b1ed8570ba348d55ac5c83be9bc15cf56e
          output-dir: bridge-packages
          packages: |
            packages/cli/npm/*
            packages/cli/cli-npm/*
            packages/cli
            packages/core
            packages/prompts
      - name: Upload packed packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-packages
          path: bridge-packages
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
run-name: Preview / before / ${{ inputs.cache_state }}
env:
  VP_CI_BENCH_CACHE_STATE: ${{ inputs.cache_state }}
  VP_CI_BENCH_PREFIX: vp-ci-cache-2961-v1
