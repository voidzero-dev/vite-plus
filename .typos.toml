[default]
# Vitest v4 used this misspelled directory; the migrator must recognize it.
extend-ignore-re = ['\.vitest-attachements\b']

[default.extend-words]
pn = "pn" # pnpm short alias
Jod = "Jod" # Node.js v22 LTS codename
flate = "flate" # flate2 crate name (gzip/deflate compression)

[default.extend-identifiers]
# Repository name and pinned commit in the ecosystem benchmark report.
sigle = "sigle"
"6b2b2ba86" = "6b2b2ba86"

[type.patch]
extend-glob = ["*.patch"]
# Git writes object IDs on patch index lines.
extend-ignore-re = ['(?m)^index [0-9a-f]+\.\.[0-9a-f]+(?: [0-7]+)?$']

[files]
extend-exclude = [
  # Vendored PGP key/signature blobs: base64 armor trips the spell checker.
  "crates/vp_js_runtime/src/assets/**/*.asc",
  # Registry recordings contain upstream signatures and integrity hashes.
  "crates/vp_cli_snapshots/tests/cli_snapshots/registry/**/manifest.json",
]
