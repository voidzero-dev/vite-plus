[[case]]
name = "migration_existing_pre_commit"
vp = "global"
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["vpt", "mkdir", "-p", ".husky"], snapshot = false },
  { argv = ["vpt", "write-file", ".husky/pre-commit", "#!/usr/bin/env sh\nnpm test\nsecret-scan\n"], snapshot = false },
  { argv = ["vpt", "chmod", "755", ".husky/pre-commit"], snapshot = false, continue-on-failure = true },
  { argv = ["vpt", "print-file", ".husky/pre-commit"], comment = "existing hook", continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "migrate the hook", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".vite-hooks/pre-commit"], comment = "keep the custom hook", continue-on-failure = true },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "do not add staged config", continue-on-failure = true },
]

[[case]]
name = "migration_hook_helpers_only"
vp = "global"
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["vpt", "mkdir", "-p", ".husky"], snapshot = false },
  { argv = ["vpt", "write-file", ".husky/common.sh", "#!/usr/bin/env sh\n"], snapshot = false },
  { argv = ["vpt", "write-file", ".husky/pre-commit.bak", "npm test\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "ignore helper and backup files", continue-on-failure = true },
  { argv = ["vpt", "stat-file", ".vite-hooks/pre-commit", "--assert", "file"], snapshot = false },
  { argv = ["vpt", "print-file", ".vite-hooks/pre-commit"], comment = "add the default hook", continue-on-failure = true },
  { argv = ["vpt", "grep-file", "vite.config.ts", "staged:"], snapshot = false },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "add staged config", continue-on-failure = true },
]

[[case]]
name = "migration_nested_hook_helper"
vp = "global"
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["vpt", "mkdir", "-p", ".husky/scripts"], snapshot = false },
  { argv = ["vpt", "write-file", ".husky/pre-commit", "#!/usr/bin/env sh\n. \"$(dirname \"$0\")/scripts/check.sh\"\n"], snapshot = false },
  { argv = ["vpt", "write-file", ".husky/scripts/check.sh", "npx lint-staged\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "preserve and migrate a nested hook helper", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".vite-hooks/pre-commit"], comment = "keep the project hook", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".vite-hooks/scripts/check.sh"], comment = "copy and rewrite the nested helper", continue-on-failure = true },
  { argv = ["vpt", "grep-file", "vite.config.ts", "staged:"], snapshot = false },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "add staged config discovered through the helper", continue-on-failure = true },
]

[[case]]
name = "migration_hooks_disabled_preserves_staged_full"
vp = "global"
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["git", "config", "core.hooksPath", ".husky/_"], snapshot = false, continue-on-failure = true },
  { argv = ["vpt", "mkdir", "-p", ".husky"], snapshot = false },
  { argv = ["vpt", "write-file", ".husky/pre-commit", "npx lint-staged\n"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "devDependencies.lint-staged", "\"^16.2.7\""], snapshot = false },
  { argv = ["vpt", "write-file", ".lintstagedrc.json", "{\"*.ts\":\"eslint --fix\"}\n"], snapshot = false },
  { argv = ["vp", "migrate", "--hooks", "--no-interactive"], envs = [["VITE_GIT_HOOKS", "0"]], comment = "skip hooks before the full config rewrite", continue-on-failure = true },
  { argv = ["git", "config", "--local", "core.hooksPath"], comment = "keep the Husky dispatcher", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".husky/pre-commit"], comment = "keep the active lint-staged hook", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".lintstagedrc.json"], comment = "keep standalone staged config", continue-on-failure = true },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "do not add staged config", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], comment = "keep hook dependencies and prepare script", continue-on-failure = true },
]

[[case]]
name = "migration_conflicting_project_hook"
vp = "global"
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["vpt", "mkdir", "-p", ".husky"], snapshot = false },
  { argv = ["vpt", "mkdir", "-p", ".vite-hooks"], snapshot = false },
  { argv = ["vpt", "write-file", ".husky/pre-commit", "npm test\n"], snapshot = false },
  { argv = ["vpt", "write-file", ".vite-hooks/pre-commit", "vp run lint\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "skip migration instead of overwriting either hook", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".husky/pre-commit"], comment = "keep the Husky hook", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".vite-hooks/pre-commit"], comment = "keep the project-owned Vite+ hook", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], comment = "keep Husky configured", continue-on-failure = true },
]

[[case]]
name = "migration_staged_pre_push"
vp = "global"
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["vpt", "mkdir", "-p", ".husky"], snapshot = false },
  { argv = ["vpt", "write-file", ".husky/pre-push", "#!/usr/bin/env sh\nnpx lint-staged\nnpm test\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "migrate the existing policy", continue-on-failure = true },
  { argv = ["vpt", "stat-file", ".vite-hooks/pre-commit", "--assert", "missing"], snapshot = false },
  { argv = ["vpt", "print-file", ".vite-hooks/pre-push"], comment = "rewrite the same hook", continue-on-failure = true },
  { argv = ["vpt", "grep-file", "vite.config.ts", "staged:"], snapshot = false },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "add staged config", continue-on-failure = true },
]

[[case]]
name = "migration_staged_config_with_custom_hook"
vp = "global"
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["vpt", "json-edit", "package.json", "lint-staged", "{\"*.ts\":\"eslint --fix\"}"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "devDependencies.lint-staged", "\"^16.2.7\""], snapshot = false },
  { argv = ["vpt", "mkdir", "-p", ".husky"], snapshot = false },
  { argv = ["vpt", "write-file", ".husky/pre-push", "#!/usr/bin/env sh\nnpm test\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "migrate config without changing policy", continue-on-failure = true },
  { argv = ["vpt", "stat-file", ".vite-hooks/pre-commit", "--assert", "missing"], snapshot = false },
  { argv = ["vpt", "print-file", ".vite-hooks/pre-push"], comment = "keep the custom hook", continue-on-failure = true },
  { argv = ["vpt", "grep-file", "vite.config.ts", "staged:"], snapshot = false },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "migrate staged config", continue-on-failure = true },
]
