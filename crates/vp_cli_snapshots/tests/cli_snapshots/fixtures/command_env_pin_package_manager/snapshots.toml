[[case]]
name = "env_pin_makes_requested_dev_engines_manager_effective"
vp = "global"
seed-runtime = false
steps = [
  { argv = ["vp", "env", "pin", "pnpm@10.18.0", "--no-install", "--force"], comment = "pinning an existing later option makes it the effective first supported entry" },
  { argv = ["vp", "env", "current", "pm", "--json"], comment = "current resolves the newly pinned manager" },
  { argv = ["vpt", "print-file", "package.json"], comment = "the pin preserves sibling options and their policy" },
]

[[case]]
name = "env_pin_package_manager_from_nested_workspace"
vp = "global"
seed-runtime = false
cwd = "packages/app"
steps = [
  { argv = ["vp", "env", "pin", "yarn@4.12.0", "--no-install", "--force"], comment = "a nested workspace pin updates the resolver-owned root manifest" },
  { argv = ["vp", "env", "current", "pm", "--json"], comment = "the nested project resolves the new root pin" },
  { argv = ["vpt", "print-file", "../../package.json", "package.json"], comment = "only the workspace manifest owns the package-manager pin" },
]

[[case]]
name = "env_unpin_targets_shadowed_dev_engines_manager"
vp = "global"
seed-runtime = false
steps = [
  { argv = ["vpt", "write-file", "package.json", "{\"name\":\"command-env-pin-package-manager\",\"private\":true,\"packageManager\":\"pnpm@10.18.0\",\"devEngines\":{\"packageManager\":{\"name\":\"yarn\",\"version\":\"4.12.0\",\"onFail\":\"download\"}}}\n"], snapshot = false },
  { argv = ["vp", "env", "unpin", "pm", "--target", "dev-engines"], comment = "an explicit target removes the devEngines manager even when packageManager shadows it" },
  { argv = ["vpt", "print-file", "package.json"], comment = "the effective top-level packageManager remains intact" },
]

[[case]]
name = "env_unpin_package_manager_target_preserves_dev_engines"
vp = "global"
seed-runtime = false
steps = [
  { argv = ["vpt", "write-file", "package.json", "{\"name\":\"command-env-pin-package-manager\",\"private\":true,\"devEngines\":{\"packageManager\":{\"name\":\"pnpm\",\"version\":\"10.18.0\",\"onFail\":\"download\"}}}\n"], snapshot = false },
  { argv = ["vp", "env", "unpin", "pm", "--target", "package-manager"], comment = "an explicit top-level target does not remove a devEngines-only package-manager pin" },
  { argv = ["vpt", "print-file", "package.json"], comment = "the devEngines package-manager pin remains unchanged" },
]

[[case]]
name = "env_pin_dev_engines_warns_when_top_level_version_shadows_it"
vp = "global"
seed-runtime = false
steps = [
  { argv = ["vpt", "write-file", "package.json", "{\"name\":\"command-env-pin-package-manager\",\"private\":true,\"packageManager\":\"pnpm@10.18.0\"}\n"], snapshot = false },
  { argv = ["vp", "env", "pin", "pnpm@11.0.0", "--target", "dev-engines", "--no-install", "--force"], comment = "pinning a shadowed same-family devEngines version explains which declaration remains effective" },
  { argv = ["vpt", "print-file", "package.json"], comment = "both explicitly targeted declarations remain unchanged except for the new devEngines pin" },
]
