[[case]]
name = "migration_ignore_patterns_upgrade"
vp = "local"
comment = "Preserve templates and their shared catalogs and overrides, re-include one template, and leave non-workspace examples alone."
steps = [
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"] },
  { argv = ["vpt", "print-file", "templates/starter/package.json"] },
  { argv = ["vpt", "print-file", "templates/starter/vite.config.ts"] },
  { argv = ["vpt", "print-file", "templates/starter/unit.test.ts"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "templates/starter/tsconfig.json"] },
  { argv = ["vpt", "print-file", "examples/standalone/unit.test.ts"] },
  { argv = ["vpt", "print-file", "packages/app/package.json"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "packages/app/unit.test.ts"] },
  { argv = ["vpt", "print-file", "templates/managed/unit.test.ts"] },
  { argv = ["vpt", "print-file", "pnpm-workspace.yaml"] },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], comment = "Rerunning uses the same policy and explicit managed dependency specs." },
  { argv = ["vpt", "write-file", "packages/app/unit.test.ts", "import { test } from 'vitest';\ntest('autofix', () => {});\n"] },
  { argv = ["vp", "lint", "--threads=1", "--fix", "templates/starter/unit.test.ts", "packages/app/unit.test.ts"], continue-on-failure = true, comment = "Ignored imports remain upstream; other rules still report the template's debugger statement." },
  { argv = ["vpt", "print-file", "templates/starter/unit.test.ts"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "packages/app/unit.test.ts"] },
]

[[case]]
name = "migration_ignore_patterns_fresh"
vp = "local"
comment = "Initial migration honors the same exclusions."
steps = [
  { argv = ["vpt", "json-edit", "package.json", "devDependencies", "{}"] },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"] },
  { argv = ["vpt", "print-file", "templates/starter/package.json"] },
  { argv = ["vpt", "print-file", "templates/starter/vite.config.ts"] },
  { argv = ["vpt", "print-file", "templates/starter/unit.test.ts"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "templates/starter/tsconfig.json"] },
  { argv = ["vpt", "print-file", "examples/standalone/unit.test.ts"] },
  { argv = ["vpt", "print-file", "packages/app/package.json"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "packages/app/unit.test.ts"] },
  { argv = ["vpt", "print-file", "templates/managed/unit.test.ts"] },
  { argv = ["vpt", "print-file", "pnpm-workspace.yaml"] },
]

[[case]]
name = "migration_ignore_patterns_override_conflict"
vp = "local"
comment = "A conflicting global override is reported before project files change."
steps = [
  { argv = ["vpt", "write-file", "pnpm-workspace.yaml", "packages: ['packages/*', 'templates/*']\noverrides:\n  vite: ^8.0.0\n"] },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "packages/app/package.json"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "packages/app/unit.test.ts"] },
  { argv = ["vpt", "print-file", "pnpm-workspace.yaml"] },
]


[[case]]
name = "migration_ignore_patterns_full"
vp = "local"
comment = "Full setup honors exclusions, and vp check --fix keeps the import policy."
steps = [
  { argv = ["vp", "migrate", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"] },
  { argv = ["vpt", "print-file", "templates/starter/package.json"] },
  { argv = ["vpt", "print-file", "templates/starter/vite.config.ts"] },
  { argv = ["vpt", "print-file", "templates/starter/unit.test.ts"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "templates/starter/tsconfig.json"] },
  { argv = ["vpt", "print-file", "examples/standalone/unit.test.ts"] },
  { argv = ["vpt", "print-file", "packages/app/package.json"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "packages/app/unit.test.ts"] },
  { argv = ["vpt", "print-file", "templates/managed/unit.test.ts"] },
  { argv = ["vpt", "print-file", "pnpm-workspace.yaml"] },
  { argv = ["vp", "migrate", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], comment = "Rerunning uses the same policy and explicit managed dependency specs." },
  { argv = ["vpt", "write-file", "packages/app/unit.test.ts", "import { test } from 'vitest';\ntest('autofix', () => {});\n"] },
  { argv = ["vp", "check", "--no-fmt", "--fix", "templates/starter/unit.test.ts", "packages/app/unit.test.ts"], continue-on-failure = true, comment = "Ignored imports remain upstream; other rules still report the template's debugger statement." },
  { argv = ["vpt", "print-file", "templates/starter/unit.test.ts"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "packages/app/unit.test.ts"] },
]

[[case]]
name = "migration_ignore_patterns_parent_negation"
vp = "local"
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { migrate: { ignorePatterns: ['templates/', '!templates/managed/unit.test.ts'] } };\n"] },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"] },
  { argv = ["vpt", "print-file", "templates/managed/unit.test.ts"] },
  { argv = ["vpt", "print-file", "packages/app/unit.test.ts"] },
]

[[case]]
name = "migration_ignore_patterns_invalid"
vp = "local"
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { migrate: { ignorePatterns: 'templates/' } };\n"] },
  { argv = ["vp", "migrate", "--no-interactive"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "packages/app/package.json"], continue-on-failure = true },
]

[[case]]
name = "migration_ignore_patterns_runtime_config"
vp = "local"
comment = "A runtime config export retains the policy, and the root config can be a plain object."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "const excluded = ['templates/*', '!templates/managed/'];\nexport default () => ({ migrate: { ignorePatterns: excluded } });\n"] },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"] },
  { argv = ["vpt", "print-file", "templates/starter/unit.test.ts"] },
  { argv = ["vpt", "print-file", "templates/managed/unit.test.ts"] },
]

[[case]]
name = "migration_ignore_patterns_explicit_target"
vp = "local"
comment = "An explicit non-workspace template target must not bypass the workspace policy."
steps = [
  { argv = ["vp", "migrate", "examples/standalone", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "examples/standalone/package.json"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "examples/standalone/unit.test.ts"] },
]

[[case]]
name = "migration_ignore_patterns_baseurl_references"
vp = "local"
comment = "The external baseUrl fixer follows references and extends; skip it so excluded configs stay unchanged."
steps = [
  { argv = ["vpt", "write-file", "tsconfig.json", "{ \"compilerOptions\": { \"baseUrl\": \".\" }, \"references\": [{ \"path\": \"./templates/starter\" }] }\n"] },
  { argv = ["vpt", "write-file", "templates/starter/tsconfig.json", "{ \"extends\": \"../../tsconfig.json\", \"compilerOptions\": { \"baseUrl\": \".\", \"paths\": { \"@/*\": [\"src/*\"] } } }\n"] },
  { argv = ["vp", "migrate", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"] },
  { argv = ["vpt", "print-file", "templates/starter/tsconfig.json"] },
  { argv = ["vpt", "print-file", "tsconfig.json"] },
]
