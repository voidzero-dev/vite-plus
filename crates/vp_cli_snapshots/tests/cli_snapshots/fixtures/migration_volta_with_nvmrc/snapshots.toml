[[case]]
name = "migration_volta_with_nvmrc"
vp = "global"
steps = [
  { argv = ["vp", "migrate", "--no-interactive"], comment = "an existing .nvmrc is kept and volta.node is not converted", continue-on-failure = true },
  { argv = ["vpt", "stat-file", ".node-version", "--assert-not", "file"], comment = "no .node-version is written to shadow .nvmrc", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".nvmrc"], comment = ".nvmrc is left untouched", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], comment = "volta field must remain intact", continue-on-failure = true },
]
