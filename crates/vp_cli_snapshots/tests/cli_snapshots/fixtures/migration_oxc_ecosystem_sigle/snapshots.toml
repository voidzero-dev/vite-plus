[[case]]
name = "migration_oxc_ecosystem_sigle"
vp = "global"
comment = "Reproduces the two app-level JSON extends configs in https://github.com/vite-plus-ecosystem-ci/sigle/pull/8, with a shared base to verify inherited rules."
steps = [
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", ".oxlintrc.ts"],
  ["vpt", "stat-file", "apps/sigle/.oxlintrc.json", "--assert", "missing"],
  ["vpt", "stat-file", "apps/custom-domain/.oxlintrc.json", "--assert", "missing"],
  { argv = ["vpt", "print-file", "apps/sigle/vite.config.ts"], comment = "the existing Vite config must import the shared TypeScript rules" },
  { argv = ["vpt", "print-file", "apps/custom-domain/vite.config.ts"], comment = "create a Vite config for the migrated inherited rules" },
  { argv = ["vp", "lint", "src"], cwd = "apps/sigle" },
  { argv = ["vp", "lint", "src"], cwd = "apps/custom-domain" },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "apps/sigle/vite.config.ts"],
  ["vpt", "print-file", "apps/custom-domain/vite.config.ts"],
  { argv = ["vpt", "write-file", "apps/sigle/src/index.ts", "console.log('hello');\n"], snapshot = false },
  { argv = ["vpt", "write-file", "apps/custom-domain/src/index.ts", "console.log('hello');\n"], snapshot = false },
  { argv = ["vp", "lint", "src"], cwd = "apps/sigle", comment = "the app must still apply its inherited rule without -c", continue-on-failure = true },
  { argv = ["vp", "lint", "src"], cwd = "apps/custom-domain", comment = "the app without vite.config.ts must also apply its inherited rule without -c", continue-on-failure = true },
]
