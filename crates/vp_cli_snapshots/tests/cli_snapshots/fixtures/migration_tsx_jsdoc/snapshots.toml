[[case]]
name = "migration_tsx_jsdoc"
vp = "local"
comment = "A JSDoc tsx code fence must not keep the tsx dependency (#3297). The tsx package is a local stub."
steps = [
  { argv = ["vpt", "print-file", "use-editing.ts"], comment = "the source mentions tsx only in a JSDoc code fence" },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], comment = "migration must not warn that use-editing.ts still uses tsx" },
  { argv = ["vpt", "print-file", "package.json"], comment = "start runs vpx, and the unused tsx devDependency is removed" },
]
