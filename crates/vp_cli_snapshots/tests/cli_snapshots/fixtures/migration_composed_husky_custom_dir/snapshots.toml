[[case]]
name = "migration_composed_husky_custom_dir"
vp = "global"
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["vpt", "mkdir", "-p", ".config/husky/_"], snapshot = false },
  { argv = ["vpt", "write-file", ".config/husky/pre-commit", "#!/usr/bin/env sh\nnpx lint-staged\n"], snapshot = false },
  { argv = ["vpt", "write-file", ".config/husky/_/h", "#!/usr/bin/env sh\necho custom dispatcher\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "migration should skip the custom Husky setup", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], comment = "prepare and the Husky dependency should remain", continue-on-failure = true },
  { argv = ["vpt", "print-file", "pnpm-workspace.yaml"], comment = "check pnpm-workspace.yaml has overrides and catalog", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".config/husky/pre-commit"], comment = "custom hook should be unchanged", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".config/husky/_/h"], comment = "custom dispatcher should be unchanged", continue-on-failure = true },
  { argv = ["vpt", "stat-file", ".vite-hooks", "--assert-not", "dir"], comment = "no Vite+ hook tree should be created", continue-on-failure = true },
]
