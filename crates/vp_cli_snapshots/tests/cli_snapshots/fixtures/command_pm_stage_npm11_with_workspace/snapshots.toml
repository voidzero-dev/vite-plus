[[case]]
name = "stage_publish_workspace_selection"
vp = "global"
steps = [
  { argv = ["vp", "pm", "stage", "publish", "--recursive", "--dry-run", "--registry", "http://127.0.0.1:9", "--", "--ignore-scripts", "--loglevel", "error", "--fetch-retries", "0"], comment = "Recursive selects both workspaces without publishing.", continue-on-failure = true },
  { argv = ["vp", "pm", "stage", "publish", "--filter", "vp-stage-workspace-a", "--dry-run", "--registry", "http://127.0.0.1:9", "--", "--ignore-scripts", "--loglevel", "error", "--fetch-retries", "0"], comment = "A single filter selects only workspace a.", continue-on-failure = true },
  { argv = ["vp", "pm", "stage", "publish", "--filter", "vp-stage-workspace-a", "--filter", "vp-stage-workspace-b", "--dry-run", "--registry", "http://127.0.0.1:9", "--", "--ignore-scripts", "--loglevel", "error", "--fetch-retries", "0"], comment = "Repeated filters select both workspaces.", continue-on-failure = true },
  { argv = ["vp", "pm", "stage", "publish", ".", "--recursive", "--filter", "vp-stage-workspace-b", "--dry-run", "--registry", "http://127.0.0.1:9", "--", "--ignore-scripts", "--loglevel", "error", "--fetch-retries", "0"], comment = "An explicit dot target preserves selection, and the filter narrows recursive to b.", continue-on-failure = true },
  { argv = ["vp", "pm", "stage", "publish", "./packages/a", "--dry-run", "--registry", "http://127.0.0.1:9", "--", "--ignore-scripts", "--loglevel", "error", "--fetch-retries", "0"], comment = "An explicit folder without workspace options remains supported.", continue-on-failure = true },
]
