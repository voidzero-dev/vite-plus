  { argv = ["vpt", "write-file", "packages/a/.oxlintrc.json", '{"extends":["./alias.json"]}'], snapshot = false },
  { argv = ["node", "create-config-links.mjs", "--owner-alias"], snapshot = false },
  { argv = ["vp", "lint", "--threads=1", "-c", "alias.json", "index.js"], cwd = "packages/a", comment = "The inherited alias loads the original owner config" },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"] },
  { argv = ["vpt", "stat-file", ".oxlintrc.json", "--assert", "file"], comment = "The surviving inherited alias retains its target" },
  { argv = ["vpt", "stat-file", "packages/a/alias.json", "--assert", "symlink"] },
  { argv = ["vpt", "stat-file", "packages/a/.oxlintrc.json", "--assert", "missing"] },
