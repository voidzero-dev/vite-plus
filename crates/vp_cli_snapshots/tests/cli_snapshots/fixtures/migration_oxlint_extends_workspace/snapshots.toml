[[case]]
name = "migration_oxlint_extends_workspace_repaired_shared_owner"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL"]
steps = [
  { argv = ["vpt", "rm", "packages/b/.oxlintrc.json"], snapshot = false },
  { argv = ["vpt", "write-file", "packages/a/.oxlintrc.json", '{"extends":["./missing.json"]}'], snapshot = false },
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "index.js"], comment = "The original owner reports a warning" },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"] },
  { argv = ["vpt", "write-file", "packages/a/missing.json", '{"extends":["../../.oxlintrc.json"]}'], comment = "The repaired graph reveals that the root is a shared owner" },
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "index.js"], cwd = "packages/a", comment = "The repaired JSON inherits the original warning" },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"] },
  { argv = ["vp", "lint", "--threads=1", "index.js"], comment = "The migrated owner retains its warning" },
  { argv = ["vp", "lint", "--threads=1", "index.js"], cwd = "packages/a", comment = "The repaired consumer retains the same warning" },
  { argv = ["vpt", "replace-file-content", ".oxlintrc.ts", '"no-debugger": "warn"', '"no-debugger": "error"'] },
  { argv = ["vp", "lint", "--threads=1", "index.js"], comment = "The owner follows the shared module edit", continue-on-failure = true },
  { argv = ["vp", "lint", "--threads=1", "index.js"], cwd = "packages/a", comment = "The repaired consumer follows the same edit", continue-on-failure = true },
]

[[case]]
name = "migration_oxlint_extends_workspace_new_consumer"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL"]
steps = [
  { argv = ["vpt", "rm", "packages/b/extra.ts"], snapshot = false },
  { argv = ["vpt", "write-file", "shared/base.json", '{"rules":{"no-console":"error"},"options":{"typeAware":false,"typeCheck":false}}'], snapshot = false },
  { argv = ["vpt", "json-edit", ".oxlintrc.json", "extends", '["./shared/base.json"]'], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"] },
  { argv = ["vpt", "stat-file", "shared/base.ts", "--assert", "file"] },
  { argv = ["vpt", "write-file", "packages/c/package.json", '{"name":"new-consumer","type":"module"}'], snapshot = false },
  { argv = ["vpt", "write-file", "packages/c/vite.config.mjs", "export default {};\n"], snapshot = false },
  { argv = ["vpt", "write-file", "packages/c/.oxlintrc.json", '{"extends":["../../shared/base.json"]}'], snapshot = false },
  { argv = ["vpt", "write-file", "packages/c/index.js", 'console.log("hello");'], snapshot = false },
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "index.js"], cwd = "packages/c", comment = "A new workspace uses the retained shared JSON", continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], comment = "An upgrade does not treat shared modules as a pending migration for the new workspace" },
  { argv = ["vpt", "print-file", "packages/c/vite.config.mjs"], comment = "The unmarked workspace keeps its original Vite config" },
  { argv = ["vpt", "print-file", "packages/c/.oxlintrc.json"], comment = "Its newly authored JSON config remains intact" },
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "index.js"], cwd = "packages/c", comment = "The JSON config retains the same lint output", continue-on-failure = true },
]

[[case]]
name = "migration_oxlint_extends_workspace_full_setup"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL"]
steps = [
  { argv = ["vp", "add", "-D", "vite-plus", "prettier@3.6.2"], snapshot = false },
  { argv = ["vpt", "write-file", ".prettierrc.json", '{"singleQuote":true}'], snapshot = false },
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "index.js"], cwd = "packages/a", comment = "The existing workspace consumer inherits the root JSON rule" },
  { argv = ["vp", "migrate", "--full", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], comment = "Prettier migration merges the root configs without migrating package configs" },
  { argv = ["vpt", "print-file", "vite.config.mjs"], comment = "The root uses its shared module" },
  { argv = ["vpt", "stat-file", ".oxlintrc.json", "--assert", "file"], comment = "The root JSON remains available to untouched consumers" },
  { argv = ["vpt", "stat-file", ".oxlintrc.ts", "--assert", "file"] },
  { argv = ["vpt", "print-file", "packages/a/vite.config.mjs"], comment = "The package Vite config remains unchanged" },
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "index.js"], cwd = "packages/a", comment = "The preserved package JSON still reports the same diagnostic" },
  { argv = ["vp", "lint", "--threads=1", "index.js"], comment = "The migrated root enforces the same rule" },
