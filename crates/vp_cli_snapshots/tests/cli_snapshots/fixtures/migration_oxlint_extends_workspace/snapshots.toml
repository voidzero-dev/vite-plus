[[case]]
name = "migration_oxlint_extends_workspace_shared_owner"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL"]
steps = [
  { argv = ["vpt", "rm", "packages/b/extra.ts"], snapshot = false },
  { argv = ["vp", "lint", "-c", ".oxlintrc.json", "index.js"], comment = "The original owner uses the shared warning" },
  { argv = ["vp", "lint", "-c", ".oxlintrc.json", "index.js"], cwd = "packages/a", comment = "The direct consumer inherits the same warning" },
  { argv = ["vp", "lint", "-c", ".oxlintrc.json", "index.js"], cwd = "packages/b", comment = "The transitive consumer inherits the same warning" },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"] },
  { argv = ["vpt", "print-file", "vite.config.mjs"], comment = "The owner imports its own shared config" },
  { argv = ["vpt", "print-file", "packages/a/vite.config.mjs"], comment = "The intermediate owner also imports its own shared config" },
  { argv = ["vpt", "print-file", "packages/b/vite.config.mjs"] },
  { argv = ["vpt", "print-file", ".oxlintrc.ts"], comment = "Source rules remain in one shared module" },
  { argv = ["vpt", "print-file", "packages/a/.oxlintrc.ts"] },
  { argv = ["vpt", "stat-file", ".oxlintrc.json", "--assert-not", "file"] },
  { argv = ["vpt", "stat-file", "packages/a/.oxlintrc.json", "--assert-not", "file"] },
  { argv = ["vpt", "stat-file", "packages/b/.oxlintrc.json", "--assert-not", "file"] },
  { argv = ["vp", "lint", "index.js"], comment = "The migrated owner reports the same warning" },
  { argv = ["vp", "lint", "index.js"], cwd = "packages/a", comment = "The migrated direct consumer reports the same warning" },
  { argv = ["vp", "lint", "index.js"], cwd = "packages/b", comment = "The migrated transitive consumer reports the same warning" },
  { argv = ["vpt", "replace-file-content", ".oxlintrc.ts", '"no-debugger": "warn"', '"no-debugger": "error"'], comment = "Change the shared rule once" },
  { argv = ["vp", "lint", "index.js"], comment = "The owner now reports an error", continue-on-failure = true },
  { argv = ["vp", "lint", "index.js"], cwd = "packages/a", comment = "The direct consumer now reports the same error", continue-on-failure = true },
  { argv = ["vp", "lint", "index.js"], cwd = "packages/b", comment = "The transitive consumer now reports the same error", continue-on-failure = true },
]

