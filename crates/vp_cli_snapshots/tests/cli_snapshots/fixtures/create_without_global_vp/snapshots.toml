[[case]]
name = "pnpm_without_global_vp"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
steps = [
  { argv = ["node", "assert-create.mjs", "pnpm@12.11.2", "missing"], timeout = 240000 },
]

