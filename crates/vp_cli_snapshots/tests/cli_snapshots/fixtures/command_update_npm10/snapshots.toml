[[case]]
name = "command_update_npm10"
vp = "global"
serial = true
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "update", "testnpm2", "--", "--no-audit"], comment = "should update package within semver range" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "up", "testnpm2", "--latest", "--", "--no-audit"], comment = "reject unsupported --latest without updating dependencies", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "update", "-D", "--", "--no-audit"], comment = "preserve npm's native inclusion of dev dependencies" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "update", "-P", "--no-save", "--", "--no-audit"], comment = "preserve npm's production inclusion and no-save options" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "rm", "testnpm2"], comment = "prepare an optional dependency" },
  ["vp", "add", "testnpm2@1.0.0", "-O", "--", "--no-audit"],
  { argv = ["vp", "update", "--no-optional", "--", "--no-audit"], comment = "preserve npm's native optional dependency exclusion" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "update", "--", "--no-audit"], comment = "should update all packages but won't change the package.json" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
]
