[[case]]
name = "coverage_providers_and_v4_file_set"
vp = "global"
local-registry = true
comment = "Install the packed CLI and project-owned providers together; checkout symlinks cannot test native provider resolution."
steps = [
  { argv = ["npm", "install", "--ignore-scripts", "--no-audit", "--no-fund"], snapshot = false, timeout = 120000 },
  { argv = ["npm", "install", "--prefix", "legacy", "--ignore-scripts", "--no-audit", "--no-fund"], snapshot = false, timeout = 120000 },
  { argv = ["vpt", "cp", "-r", "src", "legacy"], snapshot = false },
  { argv = ["node", "verify.mjs"], timeout = 120000 },
]
