[[case]]
name = "command_preview"
vp = "local"
steps = [
  { argv = ["vp", "preview", "--port", "12312312312"], comment = "without a build, preview stops on the missing dist directory before it tries the port, as `vite preview` does", continue-on-failure = true },
  { argv = ["vpt", "mkdir", "dist"], snapshot = false },
  { argv = ["vp", "preview", "--port", "12312312312"], comment = "intentionally use an invalid port (exceeds 0-65535) to trigger port error", continue-on-failure = true },
]
