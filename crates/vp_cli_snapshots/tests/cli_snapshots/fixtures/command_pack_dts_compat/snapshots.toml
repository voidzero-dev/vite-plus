[[case]]
name = "command_pack_dts_typescript_7"
vp = "global"
local-registry = true
comment = "The packed CLI generates inferred declarations with stable TypeScript 7.0.2 and automatic generator selection."
steps = [
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  ["vp", "pack"],
  ["vpt", "print-file", "dist/index.d.mts"],
]

[[case]]
name = "command_pack_dts_tsgo_beta"
vp = "global"
local-registry = true
env = { PACK_DTS_GENERATOR = "tsgo" }
comment = "An explicit tsgo generator uses the TypeScript 7.1 beta API with pnpm hoist:false."
steps = [
  { argv = ["vpt", "json-edit", "package.json", "devDependencies.typescript", "7.1.0-beta"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  ["vp", "pack"],
  ["vpt", "print-file", "dist/index.d.mts"],
]
