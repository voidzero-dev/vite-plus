[[case]]
name = "command_pack_pnpm10"
vp = "global"
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "pm", "pack", "--help"], comment = "should show help", continue-on-failure = true },
  { argv = ["vp", "pm", "pack"], comment = "should pack current package" },
  { argv = ["vpt", "rm", "-f", "command-pack-pnpm10-1.0.0.tgz"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--out", "./dist/package.tgz"], comment = "should pack with output file" },
  { argv = ["vpt", "rm", "-rf", "./dist"], continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--pack-destination", "./dist"], comment = "should pack with destination" },
  { argv = ["vpt", "rm", "-rf", "./dist"], continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--json", "--pack-gzip-level", "9"], comment = "should pack with gzip compression level" },
  { argv = ["vpt", "rm", "-f", "command-pack-pnpm10-1.0.0.tgz"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--json"], comment = "should pack with json output" },
  { argv = ["vpt", "rm", "-f", "command-pack-pnpm10-1.0.0.tgz"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--", "--loglevel=warn"], comment = "should support pass through arguments" },
  { argv = ["vpt", "rm", "-f", "command-pack-pnpm10-1.0.0.tgz"], snapshot = false, continue-on-failure = true },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "pnpm@10.10.0"], snapshot = false },
  { argv = ["vp", "pm", "pack", "--recursive"], comment = "Reject recursive pack before pnpm 10.11.0.", continue-on-failure = true },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "pnpm@9.15.9"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--out", "package.tgz"], comment = "Reject --out before pnpm 10.0.0.", continue-on-failure = true },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "pnpm@9.13.2"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--json"], comment = "Reject --json before pnpm 9.14.0.", continue-on-failure = true },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "pnpm@8.2.0"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--pack-gzip-level", "0"], comment = "Reject --pack-gzip-level before pnpm 8.3.0, including an explicit zero.", continue-on-failure = true },
]
