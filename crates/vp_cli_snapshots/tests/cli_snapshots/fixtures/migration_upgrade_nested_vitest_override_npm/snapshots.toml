[[case]]
name = "migration_upgrade_nested_vitest_override_npm"
vp = "global"
steps = [
  { argv = ["vp", "migrate", "--no-interactive"], comment = "add the Vite alias to the nested override", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], comment = "preserve the Rollup and Vitest runner overrides", continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "nested override must not make migration permanently pending", continue-on-failure = true },
]
