[[case]]
name = "core_resolution_upstream_vite"
vp = "local"
steps = [
  { argv = ["vpt", "write-file", "node_modules/vite/package.json", "{\"name\":\"vite\",\"version\":\"8.2.2\"}\n"], snapshot = false },
  { argv = ["vp", "dev"], continue-on-failure = true },
  ["vp", "pack", "index.ts"],
]

