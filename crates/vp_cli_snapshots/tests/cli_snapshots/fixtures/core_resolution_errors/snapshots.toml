  { argv = ["vpt", "write-file", "node_modules/vite/package.json", "{\"name\":\"@voidzero-dev/vite-plus-core\",\"version\":\"0.0.0-stale\"}\n"], snapshot = false },
  { argv = ["vp", "dev"], continue-on-failure = true },
  ["vp", "pack", "index.ts"],
]
