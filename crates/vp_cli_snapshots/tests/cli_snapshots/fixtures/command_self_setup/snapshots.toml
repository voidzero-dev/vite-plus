[[case]]
name = "command_self_setup"
vp = "global"
steps = [
  { argv = ["vpt", "rm", "$VP_HOME/current/bin/.vp-setup-complete"], snapshot = false },
  { argv = ["vp", "--help"], envs = [["VP_SELF_SETUP_SUPPORT_CHECK", "1"]], comment = "The capability probe does not perform setup" },
  ["vpt", "stat-file", "$VP_HOME/current/bin/.vp-setup-complete", "--assert", "missing"],
  { argv = ["vp", "--help"], comment = "An unmarked deployed binary completes setup and executes the requested command", snapshot = false },
  ["vpt", "stat-file", "$VP_HOME/current/bin/.vp-setup-complete", "--assert", "file"],
  { argv = ["vp", "not-a-command"], comment = "Once marked, the binary dispatches commands normally", continue-on-failure = true },
]

[[case]]
name = "command_self_setup_handoff"
vp = "global"
requires = ["bash"]
skip-platforms = ["windows"]
steps = [
  { argv = ["vpt", "mkdir", "-p", "external", "project", "home/js_runtime/node"], snapshot = false },
  { argv = ["vpt", "cp", "-r", "$VP_HOME/js_runtime/node/22.18.0", "home/js_runtime/node/22.18.0"], snapshot = false },
  { argv = ["vpt", "cp", "$VP_HOME/bin/vp", "external/vp"], snapshot = false },
  { argv = ["vpt", "chmod", "+x", "external/vp"], snapshot = false },
  { argv = ["vpt", "pipe-stdin", "original stdin", "--", "bash", "-c", 'exec ./external/vp "$@" 2>setup.log', "--", "-C", "project", "env", "exec", "--node", "22.18.0", "node", "-e", "console.log(JSON.stringify({cwd: require('node:path').basename(process.cwd()), value: process.env.HANDOFF_VALUE, input: require('node:fs').readFileSync(0, 'utf8')})); process.exit(17)"], tty = false, envs = [["VP_HOME", "${workspace}/home"], ["VP_SKIP_DEPS_INSTALL", "1"], ["VP_VERSION", "handoff-test"], ["VP_NODE_MANAGER", "no"], ["VP_SELF_SETUP_NO_MODIFY_PATH", "1"], ["HANDOFF_VALUE", "original environment"]], comment = "The deployed binary executes the original command with its cwd, environment, stdin and exit status", continue-on-failure = true },
]

[[case]]
name = "command_self_setup_retry"
vp = "global"
skip-platforms = ["windows"]
steps = [
  { argv = ["vpt", "rm", "$VP_HOME/current/bin/.vp-setup-complete", "$VP_HOME/env"], snapshot = false },
  { argv = ["vpt", "mkdir", "$VP_HOME/env"], snapshot = false },
  { argv = ["vp", "env", "setup", "--refresh"], comment = "A failed setup does not mark the deployed binary as complete", continue-on-failure = true },
  ["vpt", "stat-file", "$VP_HOME/current/bin/.vp-setup-complete", "--assert", "missing"],
  { argv = ["vpt", "rm", "-r", "$VP_HOME/env"], snapshot = false },
  { argv = ["vp", "env", "setup", "--refresh"], comment = "The same upgrade handoff retries setup after the failure is repaired", snapshot = false },
  ["vpt", "stat-file", "$VP_HOME/current/bin/.vp-setup-complete", "--assert", "file"],
]

[[case]]
name = "command_self_setup_bootstrap_options"
vp = "global"
skip-platforms = ["windows"]
steps = [
  { argv = ["vpt", "mkdir", "-p", "external", "home", "user"], snapshot = false },
  { argv = ["vpt", "cp", "$VP_HOME/bin/vp", "external/vp"], snapshot = false },
  { argv = ["vpt", "chmod", "+x", "external/vp"], snapshot = false },
  { argv = ["vpt", "write-file", "user/.bashrc", "# Existing shell configuration\n"], snapshot = false },
  { argv = ["./external/vp"], tty = false, envs = [["HOME", "${workspace}/user"], ["VP_HOME", "${workspace}/home"], ["VP_SKIP_DEPS_INSTALL", "1"], ["VP_VERSION", "bootstrap-test"], ["VP_NODE_MANAGER", "no"], ["VP_SELF_SETUP_NO_MODIFY_PATH", "1"]], comment = "A piped standalone binary installs with the bootstrap's choices", snapshot = false },
  ["vpt", "stat-file", "home/current/bin/.vp-setup-complete", "--assert", "file"],
  ["vpt", "print-file", "home/config.json"],
  ["vpt", "print-file", "user/.bashrc"],
  ["vpt", "stat-file", "user/.zshenv", "--assert", "missing"],
]

[[case]]
name = "command_self_setup_combined_default"
vp = "global"
skip-platforms = ["windows"]
steps = [
  { argv = ["vpt", "mkdir", "-p", "external", "home"], snapshot = false },
  { argv = ["vpt", "cp", "$VP_HOME/bin/vp", "external/vp"], snapshot = false },
  { argv = ["vpt", "chmod", "+x", "external/vp"], snapshot = false },
  { argv = ["./external/vp"], tty = false, envs = [["VP_HOME", "${workspace}/home"], ["VP_SKIP_DEPS_INSTALL", "1"], ["VP_VERSION", "combined-default"], ["VP_SELF_SETUP_NO_MODIFY_PATH", "1"], ["CI", "true"], ["VP_PNPM_MANAGER", "no"]], comment = "Without an explicit Node override, automatic setup still enables both; a family override takes precedence", snapshot = false },
  ["vpt", "print-file", "home/config.json"],
]

[[case]]
name = "command_self_setup_package_manager_choices"
vp = "global"
skip-platforms = ["windows"]
env = { VP_SKIP_DEPS_INSTALL = "1", VP_SELF_SETUP_NO_MODIFY_PATH = "1", VP_NODE_MANAGER = "no" }
steps = [
  { argv = ["vpt", "mkdir", "-p", "external", "home"], snapshot = false },
  { argv = ["vpt", "cp", "$VP_HOME/bin/vp", "external/vp"], snapshot = false },
  { argv = ["vpt", "chmod", "+x", "external/vp"], snapshot = false },
  { argv = ["./external/vp"], tty = false, envs = [["VP_HOME", "${workspace}/home"], ["VP_VERSION", "pm-default"], ["VP_PM_MANAGER", "yes"], ["VP_PNPM_MANAGER", "no"], ["VP_YARN_MANAGER", "no"]], comment = "Package-manager choices are independent of Node; pnpm and Yarn override the group default", snapshot = false },
  ["vpt", "print-file", "home/config.json"],
  { argv = ["./external/vp"], tty = false, envs = [["VP_HOME", "${workspace}/home"], ["VP_VERSION", "pm-overrides"], ["VP_PM_MANAGER", "no"], ["VP_NPM_MANAGER", "yes"], ["VP_BUN_MANAGER", "yes"]], comment = "npm and Bun can opt into management while the other families prefer system tools", snapshot = false },
  ["vpt", "print-file", "home/config.json"],
  { argv = ["./external/vp"], tty = false, envs = [["VP_HOME", "${workspace}/home"], ["VP_VERSION", "pm-preserved"], ["VP_NODE_MANAGER", "yes"]], comment = "Changing only Node management preserves all saved package-manager choices", snapshot = false },
  ["vpt", "print-file", "home/config.json"],
]

[[case]]
name = "command_self_setup_shell_warning"
vp = "global"
skip-platforms = ["windows"]
requires = ["bash"]
steps = [
  { argv = ["vpt", "mkdir", "-p", "external", "home", "user/.bashrc"], snapshot = false },
  { argv = ["vpt", "cp", "$VP_HOME/bin/vp", "external/vp"], snapshot = false },
  { argv = ["vpt", "chmod", "+x", "external/vp"], snapshot = false },
  { argv = ["bash", "-c", "./external/vp > setup.log 2>&1"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", "${workspace}/home"], ["VP_SKIP_DEPS_INSTALL", "1"], ["VP_VERSION", "bootstrap-test"], ["VP_NODE_MANAGER", "no"]], comment = "An unreadable shell profile warns without preventing installation", snapshot = false },
  ["vpt", "grep-file", "setup.log", "Could not configure shell profiles"],
  ["vpt", "stat-file", "home/current/bin/.vp-setup-complete", "--assert", "file"],
  ["vpt", "stat-file", "user/.bashrc", "--assert", "dir"],
  { argv = ["./home/bin/vp", "--help"], envs = [["VP_HOME", "${workspace}/home"]], comment = "The installed CLI accepts commands after the warning", snapshot = false },
]

[[case]]
name = "command_self_setup_mixed_shim_refresh"
vp = "global"
skip-platforms = ["windows"]
env = { VP_SKIP_DEPS_INSTALL = "1", VP_SELF_SETUP_NO_MODIFY_PATH = "1" }
steps = [
  { argv = ["vpt", "mkdir", "-p", "external", "home/bin", "other/bin"], snapshot = false },
  { argv = ["vpt", "cp", "$VP_HOME/bin/vp", "external/vp"], snapshot = false },
  { argv = ["vpt", "chmod", "+x", "external/vp"], snapshot = false },
  { argv = ["vpt", "write-file", "home/bin/node", "existing-node"], snapshot = false },
  { argv = ["vpt", "write-file", "home/bin/npm", "existing-npm"], snapshot = false },
  { argv = ["vpt", "write-file", "home/bin/pnpm", "existing-pnpm"], snapshot = false },
  { argv = ["vpt", "write-file", "home/bin/pnpx", "existing-pnpx"], snapshot = false },
  { argv = ["./external/vp"], tty = false, envs = [["VP_HOME", "${workspace}/home"], ["VP_VERSION", "mixed-shims"], ["VP_NODE_MANAGER", "no"], ["VP_PM_MANAGER", "no"], ["VP_PNPM_MANAGER", "yes"]], comment = "Managing pnpm replaces its existing commands while preserving system-first Node and npm", snapshot = false },
  ["vpt", "print-file", "home/bin/node"],
  ["vpt", "print-file", "home/bin/npm"],
  ["vpt", "stat-file", "home/bin/pnpm", "--assert", "symlink"],
  ["vpt", "stat-file", "home/bin/pnpx", "--assert", "symlink"],
  { argv = ["vpt", "write-file", "other/bin/node", "existing-node"], snapshot = false },
  { argv = ["vpt", "write-file", "other/bin/npm", "existing-npm"], snapshot = false },
  { argv = ["./external/vp"], tty = false, envs = [["VP_HOME", "${workspace}/other"], ["VP_VERSION", "mixed-shims"], ["VP_NODE_MANAGER", "yes"], ["VP_PM_MANAGER", "no"]], comment = "Managing Node preserves an existing system-first npm command", snapshot = false },
  ["vpt", "stat-file", "other/bin/node", "--assert", "symlink"],
  ["vpt", "print-file", "other/bin/npm"],
]
