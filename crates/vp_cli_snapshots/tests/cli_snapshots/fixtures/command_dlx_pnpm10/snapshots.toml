[[case]]
name = "command_dlx_pnpm10"
vp = ["local", "global"]
local-registry = true
steps = [
  { argv = ["vp", "dlx", "--help"], comment = "should show help message", continue-on-failure = true },
  { argv = ["vp", "dlx", "-s", "vp-test-echo", "hello"], comment = "should run vp-test-echo with pnpm dlx", continue-on-failure = true },
  { argv = ["vp", "dlx", "-s", "vp-test-echo@1.0.0", "hello"], comment = "should run specific version", continue-on-failure = true },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "pnpm@7.20.0"], snapshot = false },
  { argv = ["vp", "dlx", "--shell-mode", "echo hello"], comment = "Reject shell mode before pnpm 7.21.0 without executing the package manager.", continue-on-failure = true },
]
