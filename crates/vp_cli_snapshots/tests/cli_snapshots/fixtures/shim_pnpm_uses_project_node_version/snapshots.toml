[[case]]
name = "shim_pnpm_uses_project_node_version"
vp = "global"
local-registry = true
skip-platforms = ["windows"]
steps = [
  { argv = ["pnpm", "--version"], comment = "The unpinned pnpm shim resolves the latest version", snapshot = false },
  { argv = ["pnpm", "--version"], envs = [["NPM_CONFIG_REGISTRY", "http://127.0.0.1:9"]], comment = "The unpinned shim reuses its fresh latest-version cache without registry access", snapshot = false },
  { argv = ["node", "-e", "const {execFileSync}=require('node:child_process');const {delimiter}=require('node:path');const env={...process.env,PATH:[process.env.VP_HOME+'/bin','/usr/bin','/bin'].join(delimiter)};const version=execFileSync('pnpm',['--version'],{encoding:'utf8',env}).trim();if(!version)process.exit(1);console.log('node child reached pnpm shim')"], comment = "A Node process launched through its shim can invoke the pnpm shim" },
  { argv = ["node", "-e", "const {execFileSync}=require('node:child_process');execFileSync('pnpm',['--silent','exec','node','-e','if(process.version!==process.env.EXPECTED_NODE_VERSION)process.exit(1)'],{stdio:'inherit',env:{...process.env,EXPECTED_NODE_VERSION:process.version}});console.log('pnpm child uses project Node version')"], comment = "pnpm uses the project Node version" },
  { argv = ["vp", "env", "exec", "--node", "22.13", "pnpm", "exec", "node", "-e", "if(!process.version.startsWith('v22.13.'))process.exit(1);console.log('explicit Node reaches pnpm child')"], comment = "Explicit env exec version overrides the project version through the pnpm shim" },
  { argv = ["vpt", "write-file", ".node-version", ">=999.0.0\n"], snapshot = false },
  { argv = ["pnpm", "--version"], envs = [["VP_NODE_DIST_MIRROR", "http://127.0.0.1:9"]], comment = "JS package-manager shims report project Node resolution failures", continue-on-failure = true },
]

[[case]]
name = "shim_bun_default_latest_matches_fallback"
vp = "global"
local-registry = true
skip-platforms = ["windows"]
steps = [
  { argv = ["node", "-e", "const {execFileSync}=require('node:child_process');const {writeFileSync}=require('node:fs');writeFileSync(process.env.VP_HOME+'/bun-fallback-version',execFileSync('bun',['--version'],{encoding:'utf8'}))"], snapshot = false },
  { argv = ["vp", "env", "default", "bun@latest"], snapshot = false },
  { argv = ["node", "-e", "const {execFileSync}=require('node:child_process');const {readFileSync}=require('node:fs');const expected=readFileSync(process.env.VP_HOME+'/bun-fallback-version','utf8');const actual=execFileSync('bun',['--version'],{encoding:'utf8'});if(actual!==expected)throw new Error(`expected ${expected.trim()}, got ${actual.trim()}`);console.log('default bun@latest matches the unconfigured fallback')"], envs = [["NPM_CONFIG_REGISTRY", "http://127.0.0.1:9"]], comment = "the explicit floating default behaves like the unconfigured Bun fallback" },
]

[[case]]
name = "shim_package_manager_defaults_are_independent"
vp = "global"
comment = "Package-manager defaults are per family so changing Bun cannot silently replace the pnpm shim's configured version."
local-registry = true
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "env", "default", "pnpm@10.18.0"], snapshot = false },
  { argv = ["vp", "env", "default", "bun@1.2.0"], snapshot = false },
  { argv = ["vpt", "print-file", "$VP_HOME/config.json"], comment = "pnpm and Bun defaults are persisted independently" },
  { argv = ["node", "-e", "const {execFileSync}=require('node:child_process');const pnpm=execFileSync('pnpm',['--version'],{encoding:'utf8'}).trim();const bun=execFileSync('bun',['--version'],{encoding:'utf8'}).trim();if(pnpm!=='10.18.0'||bun!=='1.2.0')throw new Error(`expected pnpm 10.18.0 and bun 1.2.0, got pnpm ${pnpm} and bun ${bun}`);console.log('direct shims use independent defaults')"], comment = "direct package-manager shims use their own configured versions" },
]
