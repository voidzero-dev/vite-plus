[[case]]
name = "create_existing_pnpm_workspace"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
comment = "Adding an application to a plain pnpm workspace supplies the catalog entries needed for installation."
steps = [
  { argv = ["vp", "create", "vite:application", "--directory", "apps/web", "--package-manager", "pnpm", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], snapshot = false },
  { argv = ["vpt", "stat-file", "pnpm-lock.yaml", "--assert", "file"] },
  { argv = ["vpt", "print-file", "pnpm-workspace.yaml"] },
  { argv = ["vp", "install", "--frozen-lockfile"], snapshot = false },
  { argv = ["vp", "run", "build"], cwd = "apps/web", snapshot = false },
]

[[case]]
name = "migrate_existing_pnpm_catalog_order"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
comment = "Migration writes Vite+ into the same catalog selected for dependency references when a named catalog precedes the default."
steps = [
  { argv = ["vpt", "write-file", "pnpm-workspace.yaml", "packages:\n  - apps/*\ncatalogs:\n  legacy:\n    vite: 'npm:@voidzero-dev/vite-plus-core@*'\n  default:\n    vite: 'npm:@voidzero-dev/vite-plus-core@*'\n"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "devDependencies.vite", "catalog:legacy"], snapshot = false },
  { argv = ["vp", "install"], snapshot = false, timeout = 240000 },
  { argv = ["vp", "migrate", "--no-interactive"], snapshot = false, timeout = 240000 },
  ["vpt", "print-file", "package.json"],
  ["vpt", "print-file", "pnpm-workspace.yaml"],
  { argv = ["vp", "install", "--frozen-lockfile"], snapshot = false },
]
