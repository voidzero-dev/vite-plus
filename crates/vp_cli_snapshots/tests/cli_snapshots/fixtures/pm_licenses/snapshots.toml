[[case]]
name = "pm_licenses_unsupported"
vp = ["local", "global"]
steps = [
  { argv = ["vp", "pm", "licenses", "--help"] },
  { argv = ["vp", "pm", "licenses", "list", "--help"] },
  { argv = ["vp", "pm", "licenses", "list"], comment = "npm warns and exits successfully without installing a scanner" },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "yarn@4.18.0"], snapshot = false },
  { argv = ["vp", "pm", "licenses", "list", "--json"], comment = "Yarn Modern still warns when JSON output is requested" },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "pnpm@7.16.0"], snapshot = false },
  { argv = ["vp", "pm", "licenses", "list"], comment = "older pnpm versions warn and exit successfully" },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "bun@1.3.11"], snapshot = false },
  { argv = ["vp", "pm", "licenses", "list"], comment = "older Bun versions warn and exit successfully" },
  { argv = ["vpt", "stat-file", "node_modules", "--assert", "missing"] },
]
