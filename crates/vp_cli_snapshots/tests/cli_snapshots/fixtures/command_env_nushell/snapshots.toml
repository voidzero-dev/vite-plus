[[case]]
name = "command_env_nushell"
vp = "global"
skip-platforms = ["windows"]
requires = ["nu"]
steps = [
  { argv = ["vp", "env", "setup", "--refresh"], envs = [["VP_HOME", '${workspace}/vp "home\with spaces"']], snapshot = false },
  { argv = ["vpt", "cp", "assert.nu", 'vp "home\with spaces"/assert.nu'], snapshot = false },
  { argv = ["vpt", "write-file", 'vp "home\with spaces"/.node-version', "22.23.4\n"], snapshot = false },
  { argv = ["nu", "assert.nu"], cwd = 'vp "home\with spaces"', comment = "loads the generated env.nu and verifies setup, explicit use, unset, and file-based use", envs = [["EXPECTED_VP_HOME", "${workspace}"], ["PATH", "${workspace}/bin:${workspace}/bin:${PATH}"]] },
]

[[case]]
name = "command_env_nushell_metachar_dirs"
vp = "global"
skip-platforms = ["windows"]
requires = ["nu"]
steps = [
  { argv = ["vp", "env", "setup", "--refresh"], envs = [["HOME", "${workspace}/shell-home"], ["USERPROFILE", "${workspace}/shell-home"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/bin-$USER-\"quote\"-'single'-`tick`-\\slash"], ["VP_DATA_DIR", "${workspace}/data-$USER-\"quote\"-'single'-`tick`-\\slash"], ["VP_CACHE_DIR", "${workspace}/cache-$USER-\"quote\"-'single'-`tick`-\\slash"], ["XDG_CONFIG_HOME", "${workspace}/config-$USER-\"quote\"-'single'-`tick`-\\slash"]], snapshot = false },
  { argv = ["vpt", "cp", "assert_dirs.nu", "config-$USER-\"quote\"-'single'-`tick`-\\slash/vite-plus/assert_dirs.nu"], snapshot = false },
  { argv = ["nu", "config-$USER-\"quote\"-'single'-`tick`-\\slash/vite-plus/assert_dirs.nu"], comment = "Nushell loads env.nu, preserves a PATH with shell metacharacters, and omits internal directory variables", envs = [["HOME", "${workspace}/shell-home"], ["USERPROFILE", "${workspace}/shell-home"], ["VP_HOME", ""], ["EXPECTED_VP_BIN_DIR", "${workspace}/bin-$USER-\"quote\"-'single'-`tick`-\\slash"], ["PATH", "${workspace}/bin-$USER-\"quote\"-'single'-`tick`-\\slash:${workspace}/bin-$USER-\"quote\"-'single'-`tick`-\\slash:${PATH}"]] },
]

[[case]]
name = "command_env_nushell_shadowed_builtins"
vp = "global"
skip-platforms = ["windows"]
requires = ["nu"]
steps = [
  { argv = ["vp", "env", "setup", "--refresh"], envs = [["VP_HOME", "${workspace}/home"]], snapshot = false },
  { argv = ["vpt", "cp", "assert_shadowed.nu", "home/assert_shadowed.nu"], snapshot = false },
  { argv = ["nu", "assert_shadowed.nu"], cwd = "home", comment = "env.nu loads and runs `vp env use` when user commands shadow the built-ins it calls (#3092)", envs = [["VP_HOME", "${workspace}/home"]] },
]

[[case]]
name = "command_env_nushell_completer_input"
vp = "global"
skip-platforms = ["windows"]
requires = ["nu", "fish"]
steps = [
  { argv = ["vp", "env", "setup", "--refresh"], envs = [["VP_HOME", "${workspace}/home"]], snapshot = false },
  { argv = ["vpt", "cp", "assert_completion.nu", "home/assert_completion.nu"], snapshot = false },
  { argv = ["nu", "assert_completion.nu"], cwd = "home", comment = "env.nu completers complete `vp` after a pipeline and do not use the positional input that Nushell 0.116 deprecates (#3127)", envs = [["VP_HOME", "${workspace}/home"]] },
]

[[case]]
name = "command_env_nushell_without_fish"
vp = "global"
skip-platforms = ["windows"]
requires = ["nu"]
steps = [
  { argv = ["vp", "env", "setup", "--refresh"], envs = [["VP_HOME", "${workspace}/home"]], snapshot = false },
  { argv = ["vpt", "cp", "assert_without_fish.nu", "home/assert_without_fish.nu"], snapshot = false },
  { argv = ["nu", "assert_without_fish.nu"], cwd = "home", comment = "without fish on PATH, env.nu completers return null so Nushell 0.116 falls back to file completion (#3272)", envs = [["VP_HOME", "${workspace}/home"]] },
]
