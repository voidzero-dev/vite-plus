[[case]]
name = "migration_oxlint_extends"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL"]
# Lint each file separately because directory traversal order differs across platforms.
steps = [
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "index.js"], comment = "Original inherited errors and warnings", continue-on-failure = true },
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "example.test.js"], comment = "Original override rules and plugin", continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"] },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "Path extends become imports of shared TypeScript configs" },
  { argv = ["vpt", "print-file", "shared/nested/first.ts"], comment = "Nested imports preserve overrides and their plugin declarations" },
  { argv = ["vpt", "print-file", "shared/base.ts"] },
  { argv = ["vpt", "print-file", "shared/second.ts"], comment = "Relative plugin paths resolve from the shared module" },
  { argv = ["vpt", "stat-file", ".oxlintrc.json", "--assert-not", "file"] },
  { argv = ["vpt", "print-file", "shared/second.jsonc"], comment = "Shared JSON configs are retained" },
  { argv = ["vp", "exec", "tsc", "--noEmit"], comment = "Generated config types accept the resolved inheritance" },
  { argv = ["vp", "lint", "--threads=1", "index.js"], comment = "The diagnostics and exit code match the original config without a config flag", continue-on-failure = true },
  { argv = ["vp", "lint", "--threads=1", "example.test.js"], comment = "The override diagnostics and exit code match the original config", continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"] },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "A second migration leaves the config unchanged" },
  { argv = ["vp", "lint", "--threads=1", "index.js"], comment = "The diagnostics and exit code remain unchanged after the second migration", continue-on-failure = true },
  { argv = ["vp", "lint", "--threads=1", "example.test.js"], comment = "The override diagnostics and exit code also remain unchanged", continue-on-failure = true },
  { argv = ["vpt", "replace-file-content", "shared/base.ts", '"no-debugger": "error"', '"no-debugger": "warn"'], comment = "Edits to the shared TS config propagate through its imports" },
  { argv = ["vp", "lint", "--threads=1", "index.js"], comment = "The edited base rule now warns in index.js", continue-on-failure = true },
  { argv = ["vp", "lint", "--threads=1", "example.test.js"], comment = "The test override remains unchanged after the shared config edit", continue-on-failure = true },
]

[[case]]
name = "migration_oxlint_extends_type_options"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL"]
steps = [
  { argv = ["vpt", "json-edit", "shared/base.json", "options", '{"typeAware":true,"typeCheck":true}'], snapshot = false },
  { argv = ["vpt", "json-edit", ".oxlintrc.json", "rules.typescript/no-floating-promises", '"error"'], snapshot = false },
  { argv = ["vpt", "write-file", "tsconfig.json", '{"compilerOptions":{"target":"ESNext","strict":true},"include":["*.ts"]}'], snapshot = false },
  { argv = ["vpt", "write-file", "type-error.ts", "export const value: string = 1;\n"], snapshot = false },
  { argv = ["vpt", "write-file", "type-aware.ts", "Promise.resolve(1);\n"], snapshot = false },
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "type-error.ts"], comment = "Inherited typeCheck reports the original TypeScript diagnostic", continue-on-failure = true },
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "type-aware.ts"], comment = "Inherited typeAware enables no-floating-promises", continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"] },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "Local options stay empty so inherited settings remain live" },
  { argv = ["vp", "lint", "--threads=1", "type-error.ts"], comment = "Imported typeCheck produces the same diagnostic and exit code", continue-on-failure = true },
  { argv = ["vp", "lint", "--threads=1", "type-aware.ts"], comment = "Imported typeAware produces the same diagnostic and exit code", continue-on-failure = true },
  { argv = ["vpt", "replace-file-content", "shared/base.ts", "typeAware: true", "typeAware: false"] },
  { argv = ["vpt", "replace-file-content", "shared/base.ts", "typeCheck: true", "typeCheck: false"] },
  { argv = ["vp", "lint", "--threads=1", "type-error.ts"], comment = "Disabling the shared options removes the TypeScript diagnostic" },
  { argv = ["vp", "lint", "--threads=1", "type-aware.ts"], comment = "Disabling the shared options removes the type-aware diagnostic" },
]

[[case]]
name = "migration_oxlint_extends_import_paths"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL"]
steps = [
  { argv = ["vpt", "cp", "shared/base.json", "shared/base#%.json"], snapshot = false },
  { argv = ["vpt", "cp", "shared/nested/first.json", "shared/nested/first#%.json"], snapshot = false },
  { argv = ["vpt", "json-edit", "shared/nested/first#%.json", "extends", '["../base#%.json"]'], snapshot = false },
  { argv = ["vpt", "json-edit", ".oxlintrc.json", "extends", '["./shared/nested/first#%.json","./shared/second.jsonc"]'], snapshot = false },
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "index.js"], comment = "Original diagnostics with special characters in shared config paths", continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"] },
  { argv = ["vpt", "print-file", "vite.config.ts"] },
  { argv = ["vpt", "print-file", "shared/nested/first#%.ts"] },
  { argv = ["vp", "exec", "tsc", "--noEmit"], comment = "TypeScript resolves the literal import paths" },
  { argv = ["vp", "lint", "--threads=1", "index.js"], comment = "The migrated imports retain the same diagnostics and exit code", continue-on-failure = true },
]

[[case]]
name = "migration_oxlint_extends_backslash_path"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL"]
skip-platforms = ["windows"]
steps = [
  { argv = ["vpt", "cp", "shared/base.json", 'shared/base\name.json'], snapshot = false },
  { argv = ["vpt", "json-edit", "shared/nested/first.json", "extends", '["../base\\name.json"]'], snapshot = false },
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "index.js"], comment = "Original diagnostics with a literal backslash in the shared config filename", continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], comment = "Warn and preserve the JSON because TypeScript treats the backslash as a separator" },
  { argv = ["vpt", "stat-file", ".oxlintrc.json", "--assert", "file"] },
  { argv = ["vpt", "stat-file", "shared/nested/first.ts", "--assert", "missing"] },
  { argv = ["vpt", "stat-file", 'shared/base\name.ts', "--assert", "missing"] },
  { argv = ["vp", "lint", "--threads=1", "-c", ".oxlintrc.json", "index.js"], comment = "The retained JSON still produces the same diagnostics and exit code", continue-on-failure = true },
]

