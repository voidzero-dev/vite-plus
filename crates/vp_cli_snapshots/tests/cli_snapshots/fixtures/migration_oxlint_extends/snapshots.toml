  { argv = ["vpt", "replace-file-content", "vite.config.mjs", "lint: {},", ""], comment = "Remove the conflicting lint block" },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"] },
  { argv = ["vpt", "stat-file", ".oxlintrc.json", "--assert", "missing"] },
  { argv = ["vpt", "print-file", "vite.config.mjs"] },
  { argv = ["vp", "lint", "--threads=1", "index.js"], comment = "The retried migration retains the original diagnostics and exit code", continue-on-failure = true },
]

[[case]]
name = "migration_oxlint_extends_ts_check_pragma"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL"]
steps = [
  { argv = ["vpt", "write-file", "vite.config.mjs", "// @ts-check\n/** @type {string} */\nexport const value = 1;\nexport default {};\n"], snapshot = false },
  { argv = ["vpt", "json-edit", "tsconfig.json", "compilerOptions.allowJs", "true"], snapshot = false },
  { argv = ["vpt", "json-edit", "tsconfig.json", "include", '["vite.config.mjs"]'], snapshot = false },
  { argv = ["vp", "install"], snapshot = false },
  { argv = ["vp", "exec", "tsc", "--noEmit"], comment = "The file-level pragma enables the original type diagnostic", continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"] },
  { argv = ["vpt", "print-file", "vite.config.mjs"], comment = "Generated imports follow the file-level pragma and precede the statement's type annotation" },
  { argv = ["vp", "exec", "tsc", "--noEmit"], comment = "The pragma still enables the same type diagnostic after migration", continue-on-failure = true },
  { argv = ["vpt", "replace-file-content", "vite.config.mjs", "@ts-check", "@ts-nocheck"] },
  { argv = ["vpt", "json-edit", "tsconfig.json", "compilerOptions.checkJs", "true"] },
  { argv = ["vp", "exec", "tsc", "--noEmit"], comment = "A leading ts-nocheck pragma can still disable project-level JavaScript checking" },
]

