[[case]]
name = "yarn_install_with_options"
vp = "local"
skip-platforms = ["linux", "windows"]
env = { NODE_OPTIONS = "--no-deprecation" }
steps = [
  { argv = ["vp", "install", "--help"], comment = "print help message", continue-on-failure = true },
  { argv = ["vp", "run", "install"], continue-on-failure = true },
  { argv = ["vpt", "list-dir", "node_modules"], continue-on-failure = true },
  { argv = ["vp", "run", "install"], comment = "install again hit cache", continue-on-failure = true },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "yarn@2.4.2"], snapshot = false },
  { argv = ["vp", "install", "--fix-lockfile"], comment = "Reject lockfile refresh before Yarn 4.", continue-on-failure = true },
]
