[[case]]
name = "pm_team_npm"
vp = ["local", "global"]
steps = [
  { argv = ["vp", "pm", "team", "--help"] },
  { argv = ["vp", "pm", "team", "add", "--help"] },
  { argv = ["vp", "pm", "team", "ls", "@org", "--", "--version"], snapshot = false },
  { argv = ["node", "registry.mjs"], comment = "all team operations use a loopback registry with fake credentials", timeout = 120000 },
]

[[case]]
name = "pm_team_pnpm"
vp = ["local", "global"]
steps = [
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "pnpm@11.13.0"], snapshot = false },
  { argv = ["vp", "pm", "team", "ls", "@org", "--", "--version"], snapshot = false },
  { argv = ["node", "registry.mjs"], comment = "pnpm uses its native team command at the minimum supported version", timeout = 120000 },
]

[[case]]
name = "pm_team_yarn_classic"
vp = ["local", "global"]
steps = [
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "yarn@1.22.22"], snapshot = false },
  { argv = ["vp", "pm", "team", "ls", "@org", "--", "--version"], snapshot = false },
  { argv = ["node", "registry.mjs"], comment = "Yarn Classic uses its native team command without correcting scope or username values", timeout = 120000 },
