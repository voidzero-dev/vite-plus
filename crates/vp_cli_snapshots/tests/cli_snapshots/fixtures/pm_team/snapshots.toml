[[case]]
name = "pm_team_old_pnpm"
vp = ["local", "global"]
steps = [
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "pnpm@11.12.0"], snapshot = false },
  { argv = ["vp", "pm", "team", "ls", "@org", "--", "--version"], snapshot = false },
  { argv = ["node", "registry.mjs"], comment = "older pnpm versions warn and execute npm team without dropping mutations", timeout = 120000 },
