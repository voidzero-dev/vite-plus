[[case]]
name = "dev_uses_custom_vite_root"
vp = ["local", "global"]
comment = """
A workspace root remains the app target when its static Vite root points to
the directory that contains index.html. Bare vp dev starts there instead of
eliciting a member package.
"""
steps = [
  { argv = ["vp", "dev", "--host", "127.0.0.1", "--port", "0"], interactions = [
    { "expect-milestone" = "dev-server:ready" },
    { "write-line" = "q" },
  ] },
]

[[case]]
name = "build_and_preview_use_custom_vite_root"
vp = ["local", "global"]
comment = """
A workspace root remains the app target when its static Vite root contains
index.html. Bare vp build creates the app, and vp preview serves its output.
"""
steps = [
  ["vp", "build"],
  { argv = ["vp", "preview", "--host", "127.0.0.1", "--port", "0"], interactions = [
    { "expect-milestone" = "preview-server:ready" },
    { "write-line" = "q" },
  ] },
]
