[[case]]
name = "configdir_descendant"
vp = "global"
local-registry = true
env = { VP_NODE_VERSION = "22.23.4" }
unset-env = ["VP_SKIP_INSTALL"]
steps = [
  { argv = ["vpt", "json-edit", "package.json", "devDependencies.vite-plus", "^1.7.0"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "devDependencies.typescript", "7.0.2"], snapshot = false },
  { argv = ["vpt", "write-file", "pnpm-workspace.yaml", "packages: ['.', 'packages/*']\ncatalogs:\n  build:\n    tsdown: 0.23.4\n"], snapshot = false },
  { argv = ["vpt", "write-file", "tsdown.config.ts", "export default { entry: ['src/library.ts'], publicDir: 'public' };"], snapshot = false },
  { argv = ["vpt", "write-file", "vite.config.ts", "import { defineConfig } from 'vite-plus'; import pack from './tsdown.config.ts'; export default defineConfig({ pack });"], snapshot = false },
  { argv = ["vpt", "mkdir", "-p", "configs", "packages/member/src"], snapshot = false },
  { argv = ["vpt", "write-file", "configs/base.json", '''
{
  "compilerOptions": {
    "composite": true,
    "noEmit": true,
    "target": "ES2022",
    "module": "NodeNext",
    "skipLibCheck": true,
    "allowImportingTsExtensions": true
  },
  "include": ["${configDir}/src", "${configDir}/vite.config.ts", "${configDir}/tsdown.config.ts"]
}
'''], snapshot = false },
  { argv = ["vpt", "write-file", "tsconfig.json", '{"extends":"./configs/base.json"}'], snapshot = false },
  { argv = ["vpt", "write-file", "packages/member/package.json", '{"name":"member","private":true,"type":"module"}'], snapshot = false },
  { argv = ["vpt", "write-file", "packages/member/tsconfig.json", '{"extends":"../../tsconfig.json"}'], snapshot = false },
  { argv = ["vpt", "write-file", "packages/member/src/member.ts", "export const member = true;"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vp", "exec", "tsc", "--showConfig", "-p", "packages/member/tsconfig.json"], comment = "The inherited source paths are relative to the member." },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], snapshot = false },
  { argv = ["vp", "exec", "tsc", "-b", "--force", "tsconfig.json", "packages/member/tsconfig.json"], snapshot = false },
  ["vpt", "stat-file", "vite-pack.config.ts", "--assert", "file"],
  ["vpt", "print-file", "tsconfig.json"],
  { argv = ["vp", "exec", "tsc", "--showConfig", "-p", "packages/member/tsconfig.json"], comment = "The member still lists its own source after migration." },
]
