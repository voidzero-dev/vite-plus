[[case]]
name = "active_pack_override"
vp = "global"
local-registry = true
unset-env = ["VP_SKIP_INSTALL"]
comment = "Keep the standalone build when the active pack overrides the converted config's entry."
steps = [
  { argv = ["vpt", "json-edit", "package.json", "scripts.build", "tsdown"], snapshot = false },
  { argv = ["vpt", "write-file", "tsdown.config.ts", "import { defineConfig } from 'tsdown'; export default defineConfig({ entry: ['src/library.ts'] });"], snapshot = false },
  { argv = ["vpt", "write-file", "src/browser.ts", "export const answer = 21;"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], snapshot = false },
  ["vpt", "stat-file", "vite-pack.config.ts", "--assert", "file"],
  { argv = ["vpt", "json-edit", "package.json", "scripts", '{"build":"tsdown"}'], snapshot = false },
  { argv = ["vpt", "write-file", "vite.config.ts", "import { defineConfig } from 'vite-plus'; import config from './vite-pack.config.js'; export default defineConfig({ pack: { ...config, entry: ['src/browser.ts'] } });"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "package.json"],
  { argv = ["vp", "run", "build"], snapshot = false },
  ["vpt", "stat-file", "dist/library.mjs", "--assert", "file"],
  ["vpt", "stat-file", "dist/browser.mjs", "--assert", "missing"],
]

