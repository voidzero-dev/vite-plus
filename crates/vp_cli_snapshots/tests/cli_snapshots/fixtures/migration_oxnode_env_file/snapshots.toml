[[case]]
name = "migration_oxnode_env_file"
vp = ["local", "global"]
local-registry = true
env = { VP_NODE_VERSION = "22.23.4" }
unset-env = ["NODE_OPTIONS", "VP_SCRIPT_TSCONFIG", "TSX_TSCONFIG_PATH", "OXC_TSCONFIG_PATH", "TS_NODE_PROJECT"]
comment = "Local oxc-node stub packages show whether Node can still load the standalone registration named only in explicitly selected environment files."
steps = [
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  ["vp", "run", "run"],
  ["vp", "run", "run-optional"],
  ["vp", "migrate", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  { argv = ["vpt", "print-file", "package.json", "config/node.env", "config/runtime.conf"], comment = "The build migrates, while the env-file commands and their required loader dependency stay intact." },
  { argv = ["vpt", "rm", "-rf", "node_modules"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  ["vpt", "stat-file", "node_modules/@oxc-node/cli", "node_modules/@oxc-node/core"],
  ["vp", "run", "build"],
  { argv = ["vp", "run", "run"], comment = "The required env file still loads the registration after a fresh install." },
  { argv = ["vp", "run", "run-optional"], comment = "The optional env file also keeps its registration dependency available." },
]
