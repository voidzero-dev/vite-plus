[[case]]
name = "npm_lockfile_uses_bundled_version"
vp = "global"
steps = [
  { argv = ["node", "assert-npm.cjs"], comment = "A Node-only devEngines declaration and npm lockfile use bundled npm without querying the registry", envs = [["NPM_CONFIG_REGISTRY", "http://127.0.0.1:9"]] },
  { argv = ["vp", "pm", "patch", "example"], comment = "Bundled npm retains its version gates for unsupported commands" },
  { argv = ["vp", "pm", "approve-builds"], comment = "Bundled npm does not invoke approval commands added in later npm releases" },
  { argv = ["vp", "env", "default", "npm@10.5.0"], snapshot = false },
  { argv = ["node", "assert-npm.cjs", "10.5.0"], comment = "An npm default overrides the bundled version even when a lockfile exists" },
  { argv = ["vpt", "json-edit", "package.json", "devEngines.packageManager", "{\"name\":\"npm\",\"version\":\"10.9.4\"}"], snapshot = false },
  { argv = ["node", "assert-npm.cjs", "10.9.4"], comment = "A devEngines npm version overrides the default" },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "npm@10.8.2"], snapshot = false },
  { argv = ["node", "assert-npm.cjs", "10.8.2"], comment = "A top-level npm pin still has priority" },
]

[[case]]
name = "npm_current_does_not_install_node"
vp = "global"
seed-runtime = false
env = { VP_NODE_VERSION = "22.18.0", VP_NODE_DIST_MIRROR = "http://127.0.0.1:9" }
steps = [
  { argv = ["vp", "env", "current", "--json"], comment = "An absent Node runtime and bundled npm are reported without downloading" },
  { argv = ["vp", "env", "current", "npm", "--json"], comment = "The explicit npm scope also reports an unknown, uninstalled version" },
  { argv = ["vpt", "stat-file", "$VP_HOME/js_runtime/node/22.18.0", "--assert", "missing"], comment = "Reporting the environment leaves the runtime uninstalled" },
]

[[case]]
name = "npm_bundled_ignores_project_bin"
vp = "global"
skip-platforms = ["windows"]
steps = [
  { argv = ["vpt", "write-file", "bin/npm", "#!/bin/sh\necho project npm must not run\nexit 1\n"], snapshot = false },
  { argv = ["vpt", "chmod", "+x", "bin/npm"], snapshot = false },
  { argv = ["node", "assert-npm.cjs"], comment = "The version probe and actual command both use bundled npm despite an executable project bin/npm" },
]

[[case]]
name = "npm_bundled_env_print"
vp = "global"
env = { VP_SHELL = "bash", NPM_CONFIG_REGISTRY = "http://127.0.0.1:9" }
steps = [
  { argv = ["vp", "env", "print", "pm"], comment = "The selected package manager uses Node's bundled npm directory" },
  { argv = ["vp", "env", "print", "npm"], comment = "The explicit npm scope uses the same bundled directory" },
  { argv = ["vp", "env", "print"], comment = "The combined scope includes the shared directory only once" },
]

[[case]]
name = "npm_bundled_version_probe_ignores_preloads"
vp = "global"
env = { NODE_OPTIONS = "--require ./preload.cjs" }
steps = [
  { argv = ["vpt", "write-file", "preload.cjs", "console.log('preload start');\n"], snapshot = false },
  { argv = ["vp", "pm", "patch", "example"], comment = "A noisy preload cannot bypass npm's patch version gate" },
  { argv = ["vp", "pm", "approve-builds"], comment = "A noisy preload cannot bypass npm's approval version gate" },
  { argv = ["vp", "pm", "version", "--json"], comment = "The actual npm command still executes the user's preload" },
]
