[[case]]
name = "build_uses_top_level_input"
vp = ["local", "global"]
comment = "A top-level Vite `input` makes the workspace root runnable for `vp build`."
steps = [
  { argv = ["vpt", "cp", "configs/input.ts", "vite.config.ts"], snapshot = false },
  ["vp", "build"],
]

[[case]]
name = "build_uses_environment_input"
vp = ["local", "global"]
comment = "A static `environments.*.input` makes the workspace root runnable for `vp build`."
steps = [
  { argv = ["vpt", "cp", "configs/environment-input.ts", "vite.config.ts"], snapshot = false },
  ["vp", "build"],
]

[[case]]
name = "dev_uses_custom_app_type"
vp = ["local", "global"]
comment = "A static `appType: 'custom'` makes the workspace root runnable for `vp dev`."
steps = [
  { argv = ["vpt", "cp", "configs/custom-app.ts", "vite.config.ts"], snapshot = false },
  { argv = ["vp", "dev", "--host", "127.0.0.1", "--port", "0"], interactions = [
    { "expect-milestone" = "dev-server:ready" },
    { "write-line" = "q" },
  ] },
]

[[case]]
name = "dev_uses_configured_root_without_index"
vp = ["local", "global"]
comment = "A non-static Vite `root` makes the workspace root runnable without `index.html`."
steps = [
  { argv = ["vpt", "cp", "configs/root-no-index.ts", "vite.config.ts"], snapshot = false },
  { argv = ["vp", "dev", "--host", "127.0.0.1", "--port", "0"], interactions = [
    { "expect-milestone" = "dev-server:ready" },
    { "write-line" = "q" },
  ] },
]

[[case]]
name = "preview_uses_build_output"
vp = ["local", "global"]
comment = "A static `build.outDir` with `index.html` makes the workspace root runnable for `vp preview`."
steps = [
  { argv = ["vpt", "cp", "configs/preview-output.ts", "vite.config.ts"], snapshot = false },
  { argv = ["vp", "preview", "--host", "127.0.0.1", "--port", "0"], interactions = [
    { "expect-milestone" = "preview-server:ready" },
    { "write-line" = "q" },
  ] },
]
