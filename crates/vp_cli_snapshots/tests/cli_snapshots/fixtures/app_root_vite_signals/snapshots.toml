[[case]]
name = "build_uses_top_level_input"
vp = ["local", "global"]
comment = "A non-static Vite `input` makes the workspace root runnable for `vp build`."
steps = [
  { argv = ["vpt", "cp", "configs/input.ts", "vite.config.ts"], snapshot = false },
  ["vp", "build"],
]

[[case]]
name = "build_uses_environment_input"
vp = ["local", "global"]
comment = "A non-static Vite `environments` field makes the workspace root runnable for `vp build`."
steps = [
  { argv = ["vpt", "cp", "configs/environment-input.ts", "vite.config.ts"], snapshot = false },
  ["vp", "build"],
]

[[case]]
name = "dev_uses_custom_app_type"
vp = ["local", "global"]
comment = "A non-static Vite `appType` makes the workspace root runnable for `vp dev`."
steps = [
  { argv = ["vpt", "cp", "configs/custom-app.ts", "vite.config.ts"], snapshot = false },
  { argv = ["vp", "dev"], interactions = [
    { "expect-milestone" = "dev-server:ready" },
    { "write-line" = "q" },
  ] },
]

