[[case]]
name = "build_uses_top_level_input"
vp = ["local", "global"]
comment = "A declared Vite `input` field is a root intent signal for `vp build`."
steps = [
  { argv = ["vpt", "cp", "configs/input.ts", "vite.config.ts"], snapshot = false },
  ["vp", "build"],
]

