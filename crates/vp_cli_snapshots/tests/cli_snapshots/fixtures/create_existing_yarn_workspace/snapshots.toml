[[case]]
name = "create_existing_yarn_workspace"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
comment = "Creating an application supplies missing Yarn catalog entries before installation."
env = { YARN_NPM_MINIMAL_AGE_GATE = "0" }
steps = [
  { argv = ["vp", "create", "vite:application", "--directory", "apps/web", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], snapshot = false, timeout = 240000 },
  ["vpt", "stat-file", "yarn.lock", "--assert", "file"],
  ["vpt", "print-file", ".yarnrc.yml"],
  { argv = ["vp", "install", "--frozen-lockfile"], snapshot = false },
  { argv = ["vp", "run", "build"], cwd = "apps/web", snapshot = false },
]

[[case]]
name = "create_existing_yarn_named_default_catalog"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
env = { YARN_NPM_MINIMAL_AGE_GATE = "0" }
comment = "Yarn's named default catalog must remain catalog:default, not catalog:."
steps = [
  { argv = ["vp", "create", "vite:application", "--directory", "apps/seed", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], snapshot = false, timeout = 240000 },
  { argv = ["vpt", "replace-file-content", ".yarnrc.yml", "catalog:\n", "catalogs:\n  default:\n"], snapshot = false },
  { argv = ["vpt", "replace-file-content", ".yarnrc.yml", "  vite:", "    vite:"], snapshot = false },
  { argv = ["vpt", "replace-file-content", ".yarnrc.yml", "  vite-plus:", "    vite-plus:"], snapshot = false },
  { argv = ["vpt", "json-edit", "apps/seed/package.json", "devDependencies.vite", "catalog:default"], snapshot = false },
  { argv = ["vpt", "json-edit", "apps/seed/package.json", "devDependencies.vite-plus", "catalog:default"], snapshot = false },
  { argv = ["vp", "install"], comment = "Verify that the existing workspace installs before adding another app.", snapshot = false },
  { argv = ["vp", "create", "vite:application", "--directory", "apps/web", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], snapshot = false, timeout = 240000 },
  ["vpt", "print-file", ".yarnrc.yml"],
  ["vpt", "print-file", "apps/web/package.json"],
  { argv = ["vp", "install", "--frozen-lockfile"], snapshot = false },
  { argv = ["vp", "run", "build"], cwd = "apps/web", snapshot = false },
]

[[case]]
name = "create_existing_yarn_aligned_vitest_catalog"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
env = { YARN_NPM_MINIMAL_AGE_GATE = "0" }
comment = "Creating a member completes aligned Vitest entries in the named toolchain catalog without changing the default catalog."
steps = [
  { argv = ["vpt", "cp", "vitest-template.config.ts", "vite.config.ts"], snapshot = false },
  { argv = ["vpt", "write-file", ".yarnrc.yml", "nodeLinker: node-modules\ncatalog:\n  '@vitest/utils': '^5.0.0'\ncatalogs:\n  tools:\n    vite-plus: '*'\n"], snapshot = false },
  { argv = ["vp", "install"], snapshot = false },
  { argv = ["vp", "create", "vitest-app", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], snapshot = false, timeout = 240000 },
  ["vpt", "print-file", "apps/web/package.json"],
  ["vpt", "print-file", ".yarnrc.yml"],
  { argv = ["vp", "install", "--frozen-lockfile"], snapshot = false },
]

[[case]]
name = "create_existing_yarn_without_catalog_support"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
comment = "Yarn before 4.10 receives concrete versions instead of unsupported catalog references."
steps = [
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "yarn@4.9.0"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "resolutions.typescript", "5.9.3"], comment = "Yarn 4.9's built-in TypeScript patch predates TypeScript 7.", snapshot = false },
  { argv = ["vp", "create", "vite:application", "--directory", "apps/web", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], snapshot = false, timeout = 240000 },
  ["vpt", "stat-file", "yarn.lock", "--assert", "file"],
  ["vpt", "print-file", "apps/web/package.json"],
  { argv = ["vp", "install", "--frozen-lockfile"], snapshot = false },
  { argv = ["vp", "run", "build"], cwd = "apps/web", snapshot = false },
]
