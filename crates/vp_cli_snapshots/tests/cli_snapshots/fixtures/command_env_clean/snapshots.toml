[[case]]
name = "command_env_clean"
vp = "global"
seed-runtime = false
steps = [
  { argv = ["vp", "env", "clean"], comment = "Clean isolated Vite+ caches" },
  { argv = ["vp", "env", "clean", "node"], comment = "Clean only Node.js runtimes" },
  { argv = ["vp", "env", "clean", "pm"], comment = "Clean all package-manager families" },
  { argv = ["vp", "env", "clean", "pnpm"], comment = "Clean one package-manager family" },
]

[[case]]
name = "env_clean_preserves_concrete_package_manager_fallback"
vp = "global"
comment = "System-first changes dispatch preference, not cache ownership; clean must retain the managed fallback used when no system manager is available."
local-registry = true
seed-runtime = false
steps = [
  { argv = ["node", "prepare-pnpm-versions.cjs"], snapshot = false },
  { argv = ["vp", "env", "off", "pnpm"], snapshot = false },
  { argv = ["vp", "env", "clean", "pnpm"], comment = "cleanup removes stale installs but preserves the concrete family's managed fallback even in system-first mode" },
  { argv = ["node", "assert-one-pnpm-version.cjs"], comment = "the cached registry fallback remains available" },
]
