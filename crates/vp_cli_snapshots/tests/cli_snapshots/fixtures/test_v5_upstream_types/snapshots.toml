[[case]]
name = "jest_dom_browser_type_order"
vp = "global"
local-registry = true
comment = "Known upstream type conflict: browser-first declarations reject valid Node jest-dom assertions. Check upstream imports without Vite+ installed, plus the opposite-order control; this is not a passed release gate."
steps = [
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false, timeout = 180000 },
  ["node", "verify.mjs"],
]

[[case]]
name = "jest_dom_v7_browser_type_order"
vp = "global"
local-registry = true
comment = "Check whether the current jest-dom release resolves the upstream declaration-order conflict."
steps = [
  { argv = ["vpt", "json-edit", "package.json", "devDependencies.@testing-library/jest-dom", "7.0.1"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "devDependencies.@testing-library/dom", "10.4.1"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false, timeout = 180000 },
  ["node", "verify.mjs"],
]
