[[case]]
name = "migration_lintstagedrc_quoted_staged_key"
vp = "global"
comment = "A quoted `'staged'` key is existing staged config, so the standalone file must be kept instead of merged as a duplicate key."
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "should warn when staged already exists in vite.config.ts", continue-on-failure = true },
  { argv = ["vpt", "stat-file", ".lintstagedrc.json", "--assert", "file"], comment = "lintstagedrc.json should still exist", continue-on-failure = true },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "vite config should have a single staged key", continue-on-failure = true },
]
