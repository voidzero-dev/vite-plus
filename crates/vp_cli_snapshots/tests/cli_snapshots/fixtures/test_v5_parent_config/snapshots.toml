[[case]]
name = "directory_local_config"
vp = ["local"]
skip-platforms = ["windows"]
cwd = "sub"
steps = [["vp", "test", "run"]]

[[case]]
name = "directory_local_config"
vp = ["global"]
cwd = "sub"
steps = [["vp", "test", "run"]]

[[case]]
name = "explicit_config"
vp = "local"
cwd = "sub"
steps = [["vp", "test", "run", "--config", "../vite.config.ts", "--dir", "."]]
