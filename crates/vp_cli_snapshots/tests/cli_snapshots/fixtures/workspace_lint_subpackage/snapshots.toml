[[case]]
name = "workspace_lint_subpackage"
vp = "local"
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "lint", "packages/app-a"], comment = "Running from the root uses the root no-console:warn rule.", continue-on-failure = true },
  { argv = ["vp", "lint"], cwd = "packages/app-a", comment = "Running from the package discovers its no-console:off rule.", continue-on-failure = true },
  { argv = ["vpt", "write-file", "packages/app-a/vite.config.ts", "export default {};\n"] },
  { argv = ["vp", "lint"], cwd = "packages/app-a", comment = "A package config without lint settings falls back to the root config.", continue-on-failure = true },
]
