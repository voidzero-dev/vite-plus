[[case]]
name = "command_pack_picomatch_hoist_false"
vp = "global"
# Exceeded 40 seconds on Windows in CI run 38687702831.
skip-platforms = ["windows"]
local-registry = true
steps = [
  { argv = ["vp", "install", "--ignore-scripts"], timeout = 120000, snapshot = false, continue-on-failure = true },
  { argv = ["vp", "pack", "src/index.ts"], continue-on-failure = true },
]
