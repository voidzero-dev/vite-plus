[[case]]
name = "command_config_workspace_hook_path"
vp = "local"
steps = [
  { argv = ["git", "init"], snapshot = false },
  { argv = ["vp", "config", "--no-agent", "--hooks-dir", ".vite-hooks"], snapshot = false },
  { argv = ["vpt", "cp", "-r", "workspace-deps", "packages/ui/node_modules"], snapshot = false },
  { argv = ["git", "hook", "run", "pre-commit"], comment = "a root hook can find a binary installed only in the child workspace after cd", continue-on-failure = true },
  { argv = ["vpt", "cp", "-r", "root-deps", "node_modules"], snapshot = false },
  { argv = ["git", "hook", "run", "pre-push"], comment = "a root hook runs the root binary before cd and the workspace binary after cd" },
]
