[[case]]
name = "npm_install_and_runtime"
vp = "global"
local-registry = true
steps = [
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "npm@10.9.4"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts", "--", "--no-audit", "--no-fund"], snapshot = false, timeout = 180000 },
  ["vp", "test", "run"],
]

