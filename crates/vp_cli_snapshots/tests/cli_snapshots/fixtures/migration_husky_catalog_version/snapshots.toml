[[case]]
name = "migration_husky_catalog_version"
vp = "global"
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "catalog dependencies should still be recognized as a Husky setup", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], comment = "Husky and lint-staged metadata should remain", continue-on-failure = true },
  { argv = ["vpt", "print-file", "pnpm-workspace.yaml"], comment = "check pnpm-workspace.yaml has overrides and catalog", continue-on-failure = true },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "no staged config should be introduced", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".husky/pre-commit"], comment = "the Husky hook should remain unchanged", continue-on-failure = true },
]
