[[case]]
name = "migration_oxnode_custom_loaders"
vp = "local"
local-registry = true
env = { VP_NODE_VERSION = "22.23.2" }
unset-env = ["NODE_OPTIONS", "VP_SCRIPT_TSCONFIG", "TSX_TSCONFIG_PATH", "OXC_TSCONFIG_PATH", "TS_NODE_PROJECT"]
comment = "The local registry supplies published oxc-node 0.1.0 to compare original and migrated loader chains. The variant and image loaders are locally authored fixtures; the referenced Athena Crisis loaders are not in its public tree."
steps = [
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vp", "run", "loader"], comment = "The original register runs TypeScript, variant resolution, image imports, and both custom loaders in order." },
  ["vp", "migrate", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  { argv = ["vpt", "print-file", "package.json", "scripts/build-assets.tsx", "bin/build-assets"], comment = "Only the register import changes; Node.js flags, custom loader order, and script bodies stay intact." },
  { argv = ["vpt", "rm", "-rf", "node_modules"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vpt", "stat-file", "node_modules/@oxc-node/core"], comment = "A fresh install no longer includes standalone oxc-node." },
  { argv = ["vp", "run", "loader"], comment = "The migrated register produces the same values and loader order." },
]

[[case]]
name = "migration_oxnode_shebang_async"
vp = "local"
local-registry = true
env = { VP_NODE_VERSION = "22.18.0" }
unset-env = ["NODE_OPTIONS", "VP_SCRIPT_TSCONFIG", "TSX_TSCONFIG_PATH", "OXC_TSCONFIG_PATH", "TS_NODE_PROJECT"]
skip-platforms = ["windows"]
comment = "The local registry supplies published oxc-node 1.0.1 to compare original and migrated loader chains. The variant and image loaders are locally authored fixtures; the referenced Athena Crisis loaders are not in its public tree."
steps = [
  { argv = ["vpt", "json-edit", "package.json", "devDependencies.@oxc-node/core", "1.0.1"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vp", "run", "loader"], comment = "The original register runs TypeScript, variant resolution, image imports, and both custom loaders in order." },
  ["vp", "run", "shebang"],
  ["vp", "run", "extensionless"],
  ["vp", "migrate", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  { argv = ["vpt", "print-file", "package.json", "scripts/build-assets.tsx", "bin/build-assets"], comment = "Only the register import changes; Node.js flags, custom loader order, and script bodies stay intact." },
  { argv = ["vpt", "rm", "-rf", "node_modules"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vpt", "stat-file", "node_modules/@oxc-node/core"], comment = "A fresh install no longer includes standalone oxc-node." },
  { argv = ["vp", "run", "loader"], comment = "The migrated register produces the same values and loader order." },
  ["vp", "run", "shebang"],
  ["vp", "run", "extensionless"],
]

