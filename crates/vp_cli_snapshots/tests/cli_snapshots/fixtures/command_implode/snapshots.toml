[[case]]
name = "implode_confirmation"
vp = "global"
seed-runtime = false
steps = [
  { argv = ["vpt", "rm", "$VP_HOME/cache/.vp-owned"], snapshot = false },
  { argv = ["vp", "implode", "--yes"], comment = "A nested cache needs its own ownership marker before any deletion", continue-on-failure = true },
  { argv = ["vpt", "write-file", "$VP_HOME/cache/.vp-owned", "vite-plus-owned-directory\n"], snapshot = false },
  { argv = ["vp", "implode"], comment = "The old confirmation word leaves the installation intact", interactions = [
    { expect-milestone = "text:implode:ready" },
    { write-line = "uninstall" },
  ] },
  ["vpt", "stat-file", "$VP_HOME", "--assert", "dir"],
  { argv = ["vp", "implode"], comment = "The command name does not confirm removal", interactions = [
    { expect-milestone = "text:implode:ready" },
    { write-line = "implode" },
  ] },
  ["vpt", "stat-file", "$VP_HOME", "--assert", "dir"],
  { argv = ["vp", "implode"], comment = "Empty input cancels removal", interactions = [
    { expect-milestone = "text:implode:ready" },
    { write-key = "enter" },
  ] },
  ["vpt", "stat-file", "$VP_HOME", "--assert", "dir"],
  # Cleanup messages differ by platform; assert removal below.
  { argv = ["vp", "implode"], comment = "boom confirms removal", snapshot = false, interactions = [
    { expect-milestone = "text:implode:ready" },
    { write-line = "boom" },
  ] },
  ["vpt", "stat-file", "$VP_HOME", "--assert", "missing"],
]

[[case]]
name = "implode_unowned_directory"
vp = "global"
seed-runtime = false
skip-platforms = ["windows"]
env = { VP_SKIP_DEPS_INSTALL = "1", VP_NODE_MANAGER = "no", VP_SELF_SETUP_NO_MODIFY_PATH = "1" }
steps = [
  { argv = ["vpt", "mkdir", "external"], snapshot = false },
  { argv = ["vpt", "cp", "$VP_HOME/bin/vp", "external/vp"], snapshot = false },
  { argv = ["vpt", "chmod", "+x", "external/vp"], snapshot = false },
  { argv = ["vpt", "write-file", "$HOME/Documents/personal.txt", "keep my documents\n"], snapshot = false },
  { argv = ["vpt", "write-file", "$HOME/.bashrc", "# personal config\n# Vite+ bin\n. \"$HOME/Documents/env\"\n"], snapshot = false },
  { argv = ["./external/vp"], tty = false, envs = [["VP_HOME", "${HOME}/Documents"]], comment = "Setup succeeds without claiming a nonempty personal directory", snapshot = false },
  ["vpt", "stat-file", "$HOME/Documents/current/bin/.vp-setup-complete", "--assert", "file"],
  { argv = ["vp", "implode", "--yes"], envs = [["VP_HOME", "${HOME}/Documents"]], comment = "Changing VP_HOME cannot authorize recursive deletion", continue-on-failure = true },
  ["vpt", "stat-file", "$HOME/Documents/.vp-owned", "--assert", "missing"],
  ["vpt", "print-file", "$HOME/Documents/personal.txt"],
  ["vpt", "print-file", "$HOME/.bashrc"],
]
