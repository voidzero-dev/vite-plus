[[case]]
name = "workspace_root_dependency_prompts_install"
vp = "global"
cwd = "packages/app"
steps = [
  { argv = ["vp", "run", "build"], comment = "a workspace-root vite-plus declaration should recommend installing dependencies" },
]

[[case]]
name = "dynamic_task_completion_stays_silent"
vp = "global"
cwd = "packages/app"
steps = [
  { argv = ["vp", "--", "vp", "run", ""], envs = [["VP_COMPLETE", "bash"], ["_CLAP_COMPLETE_INDEX", "2"]], comment = "dynamic task completion should not print missing-local guidance" },
]
