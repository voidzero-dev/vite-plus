[[case]]
name = "task_added_by_plugin"
vp = "local"
comment = "A plugin config hook can provide a task when the config has no run field."
steps = [["vp", "run", "build:prod"]]

[[case]]
name = "task_overridden_by_plugin"
vp = "local"
comment = "A plugin config hook can override a statically analyzable task."
steps = [
  { argv = ["vpt", "replace-file-content", "vite.config.ts", "export default {", "export default { run: { tasks: { 'build:prod': { command: 'vpt exit 1' } } },"], snapshot = false },
  ["vp", "run", "build:prod"],
]
