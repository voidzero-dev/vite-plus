[[case]]
name = "benchmark_parenthesized_workloads"
vp = "global"
comment = "Migrate and run parenthesized arrows, function expressions, and local callbacks without losing parentheses, comments, or trailing commas."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { test: {} };\n"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "scripts.bench", "vitest bench --run"], snapshot = false },
  { argv = ["vpt", "write-file", "example.bench.js", "import { bench } from 'vitest';\nconst workload = () => { for (let i = 0; i < 100; i++) JSON.parse('{\"value\":42}'); };\nbench('arrow', (() => workload()));\nbench('nested', ((() => workload())));\nbench('function', (function () { workload(); }));\nbench('local', (workload));\nbench('comments', (/* before */ (() => workload()) /* after */), /* trailing */);\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "example.bench.js"],
  { argv = ["vp", "test", "bench", "--run", "--reporter=json", "--outputFile=benchmark.json"], snapshot = false },
