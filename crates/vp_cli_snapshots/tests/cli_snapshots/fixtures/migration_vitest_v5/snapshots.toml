[[case]]
name = "compatibility"
vp = "global"
steps = [
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "vite.config.ts"],
  ["vpt", "print-file", "example.test.ts"],
  ["vpt", "print-file", "package.json"],
  ["vpt", "print-file", ".vite-plus/migrations.json"],
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
]

[[case]]
name = "node_preflight"
vp = "global"
steps = [
  { argv = ["vpt", "write-file", ".node-version", "20.19.0\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], continue-on-failure = true },
  ["vpt", "print-file", "package.json"],
  ["vpt", "print-file", "example.test.ts"],
]

[[case]]
name = "external_project_inheritance"
vp = "global"
comment = "Preserve external clearMocks and locator settings, and retain the unresolved inheritance review after migration."
steps = [
  { argv = ["vpt", "write-file", "base.mjs", "export default { test: { clearMocks: true, browser: { enabled: false, locators: { exact: true } } } };\n"], snapshot = false },
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { test: { projects: [{ extends: './base.mjs', test: { name: 'unit', browser: { enabled: false } } }] } };\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "vite.config.ts"],
  ["vpt", "print-file", "base.mjs"],
  ["node", "verify-review.mjs", "--inheritance"],
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
]

[[case]]
name = "global_ownership_and_sequential_timeouts"
vp = "global"
comment = "Migrate only the Vitest globals and preserve numeric sequential timeouts in runtime collection. Leave the separate Jest suite unchanged."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { test: { globals: true, include: ['unit/**/*.test.js'] } };\n"], snapshot = false },
  { argv = ["vpt", "write-file", "jest.config.cjs", "module.exports = { testMatch: ['<rootDir>/integration/**/*.test.js'] };\n"], snapshot = false },
  { argv = ["vpt", "write-file", "unit/slow.test.js", "test.sequential('slow test', async () => {}, 15000);\nit.sequential('slow it', async () => {}, 12000);\n"], snapshot = false },
  { argv = ["vpt", "write-file", "integration/other.test.js", "test('throws', () => { expect(() => { throw new Error('boom'); }).toThrow(''); });\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "unit/slow.test.js"],
  ["vpt", "print-file", "integration/other.test.js"],
  ["node", "verify-review.mjs"],
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
]

[[case]]
name = "version_gate_preserves_sources"
vp = "global"
comment = "A version check after initial setup must abort before Vitest compatibility edits."
steps = [
  { argv = ["vpt", "write-file", "node_modules/vite/package.json", "{\"name\":\"vite\",\"version\":\"6.4.0\"}\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], continue-on-failure = true },
  ["vpt", "print-file", "vite.config.ts"],
  ["vpt", "print-file", "example.test.ts"],
  ["vpt", "print-file", "package.json"],
  ["vpt", "stat-file", ".vite-plus/migrations.json", "--assert", "missing"],
]

[[case]]
name = "selected_config_and_setup_globals"
vp = "global"
comment = "An inactive Vite config must not suppress Vitest globals. Migrate the selected test and its globals-only setup hook."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default {};\n"], snapshot = false },
  { argv = ["vpt", "write-file", "vitest.config.mjs", "export default { test: { globals: true, include: ['unit/*.test.js'], setupFiles: './setup.js' } };\n"], snapshot = false },
  { argv = ["vpt", "write-file", "setup.js", "beforeEach(() => { expect(Promise.resolve(1)).resolves.toBe(1); });\n"], snapshot = false },
  { argv = ["vpt", "write-file", "unit/right.test.js", "test.sequential('works', () => { expect(() => { throw new Error(''); }).toThrow(''); });\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "unit/right.test.js"],
  ["vpt", "print-file", "setup.js"],
  ["node", "verify-review.mjs", "--scopes"],
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
]

[[case]]
name = "test_root_override"
vp = "global"
comment = "test.root overrides the Vite root. Migrate only that test and setup scope, leaving the similarly named unrelated suite unchanged."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { root: './app', test: { root: './unit', globals: true, setupFiles: './setup.js' } };\n"], snapshot = false },
  { argv = ["vpt", "write-file", "unit/setup.js", "beforeEach(() => { expect(Promise.resolve(1)).resolves.toBe(1); });\n"], snapshot = false },
  { argv = ["vpt", "write-file", "unit/right.test.js", "test.sequential('works', () => {});\n"], snapshot = false },
  { argv = ["vpt", "write-file", "app/unit/wrong.test.js", "test('other runner', () => { expect(() => { throw new Error('boom'); }).toThrow(''); });\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "unit/right.test.js"],
  ["vpt", "print-file", "unit/setup.js"],
  ["vpt", "print-file", "app/unit/wrong.test.js"],
  ["node", "verify-review.mjs", "--scopes", "--root"],
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
]

[[case]]
name = "test_discovery_dir"
vp = "global"
comment = "Match includes and excludes under test.dir, keep setup resolution relative to root, and preserve files outside the discovery directory."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { root: './app', test: { globals: true, dir: './unit', include: ['*.test.js'], exclude: ['excluded.test.js'], setupFiles: '../setup.js' } };\n"], snapshot = false },
  { argv = ["vpt", "write-file", "setup.js", "beforeEach(() => { expect(Promise.resolve(1)).resolves.toBe(1); });\n"], snapshot = false },
  { argv = ["vpt", "write-file", "unit/right.test.js", "test.sequential('works', () => {});\n"], snapshot = false },
  { argv = ["vpt", "write-file", "wrong.test.js", "test('other runner', () => { expect(() => { throw Error('boom'); }).toThrow(''); });\n"], snapshot = false },
  { argv = ["vpt", "write-file", "unit/excluded.test.js", "test.sequential('excluded', () => {});\n"], snapshot = false },
  { argv = ["vpt", "write-file", "app/unit/wrong.test.js", "test.sequential('wrong root', () => {});\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "unit/right.test.js", "setup.js", "wrong.test.js", "unit/excluded.test.js", "app/unit/wrong.test.js"],
  ["node", "verify-review.mjs", "--scopes"],
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
]

[[case]]
name = "cli_discovery_dir"
vp = "global"
comment = "A literal --dir overrides config discovery without changing setup-file ownership."
steps = [
  { argv = ["vpt", "json-edit", "package.json", "scripts.test", "vitest run --dir ./unit"], snapshot = false },
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { test: { globals: true, dir: './ignored', include: ['*.test.js'], setupFiles: './setup.js' } };\n"], snapshot = false },
  { argv = ["vpt", "write-file", "setup.js", "beforeEach(() => { expect(Promise.resolve(1)).resolves.toBe(1); });\n"], snapshot = false },
  { argv = ["vpt", "write-file", "unit/right.test.js", "test.sequential('works', () => {});\n"], snapshot = false },
  { argv = ["vpt", "write-file", "wrong.test.js", "expect(() => { throw Error('boom'); }).toThrow('');\n"], snapshot = false },
  { argv = ["vpt", "write-file", "ignored/wrong.test.js", "test.sequential('ignored', () => {});\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "unit/right.test.js", "setup.js", "wrong.test.js", "ignored/wrong.test.js"],
  ["node", "verify-review.mjs", "--scopes", "--dir", "./unit"],
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
]

[[case]]
name = "directory_setup_globals"
vp = "global"
comment = "An extensionless setup directory resolves its index file and migrates its globals-only hook."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { test: { globals: true, setupFiles: ['./setup'], include: ['unit.test.js'] } };\n"], snapshot = false },
  { argv = ["vpt", "write-file", "setup/index.js", "beforeEach(() => { expect(Promise.resolve(1)).resolves.toBe(1); });\n"], snapshot = false },
  { argv = ["vpt", "write-file", "unit.test.js", "test('works', () => {});\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "setup/index.js"],
  ["node", "verify-review.mjs", "--scopes"],
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
]

[[case]]
name = "setup_extension_precedence"
vp = "global"
comment = "Prefer setup.mjs over setup.js, and leave the inactive JavaScript file unchanged."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { test: { globals: true, setupFiles: ['./setup'], include: ['unit.test.js'] } };\n"], snapshot = false },
  { argv = ["vpt", "write-file", "setup.mjs", "beforeEach(() => { expect(Promise.resolve(1)).resolves.toBe(1); });\n"], snapshot = false },
  { argv = ["vpt", "write-file", "setup.js", "expect(() => { throw Error('boom'); }).toThrow('');\n"], snapshot = false },
  { argv = ["vpt", "write-file", "unit.test.js", "test('works', () => {});\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "setup.mjs", "setup.js"],
  ["node", "verify-review.mjs", "--scopes"],
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
]

[[case]]
name = "conflicting_setup_globals"
vp = "global"
comment = "Preserve a setup file shared by projects with conflicting globals settings and retain its ownership review on repeated migration."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { test: { projects: [{ test: { globals: true, setupFiles: './setup.js' } }, { test: { globals: false, setupFiles: './setup.js' } }] } };\n"], snapshot = false },
  { argv = ["vpt", "write-file", "setup.js", "beforeEach(() => { expect(Promise.resolve(1)).resolves.toBe(1); });\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "setup.js"],
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
]

[[case]]
name = "node_container_scope"
vp = "global"
comment = "Check the runtime image and feature option, not source properties or Dev Container feature tags."
steps = [
  { argv = ["vpt", "write-file", "worker.js", "export const options = { node:2 };\n"], snapshot = false },
  { argv = ["vpt", "write-file", ".devcontainer/devcontainer.json", "{\"features\":{\"ghcr.io/devcontainers/features/node:1\":{\"version\":\"lts\"}}}\n"], snapshot = false },
  { argv = ["vpt", "write-file", "Dockerfile", "# FROM node:20\nFROM node:20-alpine AS build\nRUN echo node:2\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], continue-on-failure = true },
  ["vpt", "print-file", "package.json"],
  { argv = ["vpt", "write-file", "Dockerfile", "# FROM node:20\nFROM node:24.11.0-alpine AS build\nRUN echo node:2\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "worker.js"],
  ["vpt", "print-file", ".devcontainer/devcontainer.json"],
]

[[case]]
name = "mixed_project_assertions"
vp = "global"
comment = "Keep Node DOM matchers, migrate browser matchers, and retain review findings for shared transform inputs across repeated migrations."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { test: { projects: [{ test: { name: 'node', include: ['node.test.ts', 'shared.test.ts'] } }, { test: { name: 'browser', browser: { enabled: true }, include: ['browser.test.ts', 'shared.test.ts'] } }] } };\n"], snapshot = false },
  { argv = ["vpt", "write-file", "node.test.ts", "import { expect } from 'vitest';\nexpect(element).toHaveTextContent('partial');\n"], snapshot = false },
  { argv = ["vpt", "write-file", "browser.test.ts", "import { expect } from 'vitest';\nawait expect.element(element)['toHaveTextContent']('partial');\n"], snapshot = false },
  { argv = ["vpt", "write-file", "shared.test.ts", "import { expect } from 'vitest';\nexpect(element).toHaveTextContent('partial');\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "node.test.ts"],
  ["vpt", "print-file", "browser.test.ts"],
  ["vpt", "print-file", "shared.test.ts"],
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
]

[[case]]
name = "plugin_projects_and_dom_types"
vp = "global"
comment = "Do not scan plugin project paths as Vitest configs; report the Jest-only DOM type entry without changing a mixed test contract."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "import { defineConfig } from 'vitest/config';\nconst config = defineConfig({ plugins: [{ name: 'paths', projects: ['./tsconfig.json', './plugin-options.ts'] }], test: {} });\nexport default config;\n"], snapshot = false },
  { argv = ["vpt", "write-file", "tsconfig.json", "{\"compilerOptions\":{\"types\":[\"@testing-library/jest-dom\",\"vitest/globals\"]}}\n"], snapshot = false },
  { argv = ["vpt", "write-file", "plugin-options.ts", "export default { test: {} };\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "plugin-options.ts"],
  ["vpt", "print-file", "tsconfig.json"],
]

[[case]]
name = "removed_api_preflight"
vp = "global"
steps = [
  { argv = ["vpt", "write-file", "custom-runner.ts", "import { startTests } from '@vitest/runner';\nstartTests([]);\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], continue-on-failure = true },
  ["vpt", "print-file", "package.json"],
]

[[case]]
name = "api_conflict_preflight"
vp = "global"
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { test: { api: { port: 1 }, browser: { api: { port: 2 } } } };\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], continue-on-failure = true },
  ["vpt", "print-file", "package.json"],
]

[[case]]
name = "benchmark_preflight"
vp = "global"
steps = [
  { argv = ["vpt", "write-file", "example.bench.ts", "import { bench } from 'vitest';\nbench('old benchmark', () => 20 + 22);\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], continue-on-failure = true },
  ["vpt", "print-file", "package.json"],
  ["vpt", "print-file", "example.bench.ts"],
]
