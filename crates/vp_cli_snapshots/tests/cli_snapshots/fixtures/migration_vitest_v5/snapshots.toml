  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
]

[[case]]
name = "benchmark_migration"
vp = "global"
comment = "Migrate direct benchmarks, preserve suite closures and modifiers, and execute the migrated workloads with Vitest 5. Keep the supported bench command."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { test: { include: ['unused.test.js'], benchmark: { include: ['example.bench.ts'] } } };\n"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "scripts.bench", "vitest bench --run"], snapshot = false },
  { argv = ["vpt", "write-file", "example.bench.ts", "import { bench, describe } from 'vitest';\ndescribe('utilities', () => {\n  const json = '{\"value\":42}';\n  bench('parse', () => { if (JSON.parse(json).value !== 42) throw new Error('scope lost'); });\n  bench('async', async () => { if (await Promise.resolve(json) !== json) throw new Error('scope lost'); });\n  bench.skip('skipped', () => { throw new Error('must not run'); });\n  bench.todo('later');\n});\n"], snapshot = false },
