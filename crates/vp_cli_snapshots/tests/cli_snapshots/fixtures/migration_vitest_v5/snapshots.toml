[[case]]
name = "stateless_rerun"
vp = "global"
comment = "After upgrading, preserve new v5 choices on reruns without migration metadata. Ignore a legacy preview state file without overwriting it."
steps = [
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "stat-file", ".vite-plus/migrations.json", "--assert", "missing"],
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { test: {} };\n"], snapshot = false },
  { argv = ["vpt", "write-file", "example.test.ts", "import { expect, test } from 'vite-plus/test';\ntest('v5 assertion', () => { expect(() => { throw new Error('boom'); }).toThrow(''); });\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "vite.config.ts", "example.test.ts"],
  ["vpt", "stat-file", ".vite-plus/migrations.json", "--assert", "missing"],
  { argv = ["vpt", "write-file", ".vite-plus/migrations.json", "legacy preview state: invalid JSON\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", ".vite-plus/migrations.json"],
]

