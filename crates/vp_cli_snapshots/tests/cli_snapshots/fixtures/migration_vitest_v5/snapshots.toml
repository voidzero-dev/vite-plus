steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "export default { test: { include: ['unused.test.js'], benchmark: { include: ['example.bench.ts'], reporters: 'verbose', outputJson: 'reports/config.json' } } };\n"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "scripts.bench", "vitest bench --run --outputJson='reports/cli bench.json'"], snapshot = false },
  { argv = ["vpt", "write-file", "example.bench.ts", "import { bench, describe } from 'vitest';\ndescribe('utilities', () => {\n  let calls = 0;\n  const name = () => { if (++calls !== 1) throw new Error('name evaluated twice'); return 'parse'; };\n  const json = '{\"value\":42}';\n  function workload() { if (JSON.parse(json).value !== 42) throw new Error('scope lost'); }\n  bench(name(), workload);\n});\n"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
