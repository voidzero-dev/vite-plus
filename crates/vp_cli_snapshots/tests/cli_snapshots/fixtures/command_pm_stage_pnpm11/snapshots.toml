[[case]]
name = "command_pm_stage_pnpm11"
vp = "global"
steps = [
  { argv = ["vp", "pm", "stage", "--help"], comment = "should list the staged-publishing subcommands", continue-on-failure = true },
  { argv = ["vp", "pm", "stage", "publish", "--help"], comment = "should show stage publish options", continue-on-failure = true },
  { argv = ["vp", "pm", "stage", "approve", "--help"], comment = "should show stage approve options", continue-on-failure = true },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "pnpm@11.2.0"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "pm", "stage", "list"], comment = "Before pnpm 11.3.0, warn and skip the unavailable stage command." },
]
