[[case]]
name = "create_existing_bun_aligned_vitest_catalog"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
comment = "Creating a member completes aligned Vitest entries in the named toolchain catalog without changing the default catalog."
steps = [
  { argv = ["vpt", "cp", "vitest-template.config.ts", "vite.config.ts"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "catalog.@vitest/utils", "^5.0.0"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "catalogs.tools.vite-plus", "*"], snapshot = false },
  { argv = ["vp", "install"], snapshot = false },
  { argv = ["vp", "create", "vitest-app", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], snapshot = false, timeout = 240000 },
  ["vpt", "print-file", "apps/web/package.json"],
  ["vpt", "print-file", "package.json"],
  { argv = ["vp", "install", "--frozen-lockfile"], snapshot = false },
]

[[case]]
name = "create_existing_bun_nested_catalogs"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
comment = "Bun uses nested catalog configuration without falling back to ignored root entries."
steps = [
  { argv = ["vpt", "cp", "nested-catalogs.json", "package.json"], snapshot = false },
  { argv = ["vp", "install"], comment = "The ignored root catalog does not prevent installation before creation.", snapshot = false },
  { argv = ["vp", "create", "vite:application", "--directory", "apps/web", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], snapshot = false, timeout = 240000 },
  ["vpt", "stat-file", "bun.lock", "--assert", "file"],
  ["vpt", "print-file", "package.json"],
  { argv = ["vp", "install", "--frozen-lockfile"], snapshot = false },
  { argv = ["vp", "run", "build"], cwd = "apps/web", snapshot = false },
]
