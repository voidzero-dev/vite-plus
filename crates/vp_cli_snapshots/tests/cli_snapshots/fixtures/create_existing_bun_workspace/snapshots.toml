[[case]]
name = "create_existing_bun_workspace"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
comment = "Creating an application supplies missing Bun catalog entries before installation."
steps = [
  { argv = ["vp", "create", "vite:application", "--directory", "apps/web", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], snapshot = false, timeout = 240000 },
  ["vpt", "stat-file", "bun.lock", "--assert", "file"],
  ["vpt", "print-file", "package.json"],
  { argv = ["vp", "install", "--frozen-lockfile"], snapshot = false },
  { argv = ["vp", "run", "build"], cwd = "apps/web", snapshot = false },
]

[[case]]
name = "create_existing_bun_split_default_catalog"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
comment = "Creating and migrating a member keeps Bun's shared default catalog installable without duplicating entries."
steps = [
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "bun@1.4.4"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "catalog.vite", "npm:@voidzero-dev/vite-plus-core@*"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "catalog.vite-plus", "*"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "catalogs.default.react", "19.2.0"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "devDependencies.react", "catalog:default"], snapshot = false },
  { argv = ["vp", "install"], snapshot = false },
  { argv = ["vp", "create", "vite:application", "--directory", "apps/web", "--no-interactive", "--no-agent", "--no-editor", "--no-hooks"], snapshot = false, timeout = 240000 },
  ["vpt", "print-file", "package.json"],
  { argv = ["vp", "install", "--frozen-lockfile"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], snapshot = false, timeout = 240000 },
  ["vpt", "print-file", "package.json"],
  { argv = ["vp", "install", "--frozen-lockfile"], snapshot = false },
  { argv = ["vp", "run", "build"], cwd = "apps/web", snapshot = false },
]

