[[case]]
name = "command_env_use_shells"
vp = "global"
skip-platforms = ["windows"]
env = { VP_ENV_USE_EVAL_ENABLE = "1" }
steps = [
  { argv = ["vp", "env", "use", "20.18.0", "pnpm@10.18.0", "--no-install"], comment = "should detect bash and output both posix exports", envs = [["VP_SHELL", "bash"]], continue-on-failure = true },
  { argv = ["vp", "env", "use", "20.18.0", "pnpm@10.18.0", "--no-install"], comment = "should detect zsh and output both posix exports", envs = [["VP_SHELL", "zsh"]], continue-on-failure = true },
  { argv = ["vp", "env", "use", "20.18.0", "pnpm@10.18.0", "--no-install"], comment = "should detect fish and output both fish exports", envs = [["VP_SHELL", "fish"]], continue-on-failure = true },
  { argv = ["vp", "env", "use", "20.18.0", "pnpm@10.18.0", "--no-install"], comment = "should detect nushell and output both nushell exports", envs = [["VP_SHELL", "nu"]], continue-on-failure = true },
  { argv = ["vp", "env", "use", "20.18.0", "pnpm@10.18.0", "--no-install"], comment = "should detect powershell and output both powershell exports", envs = [["VP_SHELL", "pwsh"]], continue-on-failure = true },
  { argv = ["vp", "env", "use", "20.18.0", "pnpm@10.18.0", "--no-install"], comment = "should detect cmd and output both cmd exports", envs = [["VP_SHELL", "cmd"]], continue-on-failure = true },
  { argv = ["vp", "env", "use", "20.18.0", "pnpm@10.18.0", "--no-install"], comment = "should detect case-insensitive bash", envs = [["VP_SHELL", "BASH"]], continue-on-failure = true },
  { argv = ["vp", "env", "use", "20.18.0", "pnpm@10.18.0", "--no-install"], comment = "should detect case-insensitive fish", envs = [["VP_SHELL", "FISH"]], continue-on-failure = true },
  { argv = ["vp", "env", "use", "20.18.0", "pnpm@10.18.0", "--no-install"], comment = "should detect case-insensitive powershell", envs = [["VP_SHELL", "POWERSHELL"]], continue-on-failure = true },
]

[[case]]
name = "env_use_clears_stale_package_manager_override"
vp = "global"
skip-platforms = ["windows"]
env = { VP_ENV_USE_EVAL_ENABLE = "1", VP_PACKAGE_MANAGER = "pnpm@10.18.0" }
steps = [
  { argv = ["vp", "env", "use", "--no-install"], comment = "activating a project with no package-manager selection clears the previous override", envs = [["VP_SHELL", "bash"]] },
]
