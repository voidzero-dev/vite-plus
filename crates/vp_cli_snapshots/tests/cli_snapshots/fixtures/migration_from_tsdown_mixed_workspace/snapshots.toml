steps = [
  { argv = ["vpt","json-edit","package.json","devDependencies","{\"vite\":\"8.3.8\"}"], snapshot = false },
  { argv = ["vpt","write-file","pnpm-workspace.yaml","packages:\n  - 'packages/*'\nsharedWorkspaceLockfile: false\n"], snapshot = false },
  { argv = ["vpt","mkdir","-p","packages/generator/src"], snapshot = false },
  { argv = ["vpt","write-file","packages/generator/package.json","{\"name\":\"generator\",\"private\":true,\"type\":\"module\",\"scripts\":{\"release\":\"tsdown -c release.config.mts\",\"generate\":\"npx --no-install vpx ./generate.ts\"},\"devDependencies\":{\"tsdown\":\"0.22.14\"}}"], snapshot = false },
  { argv = ["vpt","write-file","packages/generator/src/index.ts","export const release = true;\n"], snapshot = false },
  { argv = ["vpt","write-file","packages/generator/release.config.mts","export default { entry: 'src/index.ts', outDir: 'release-out', dts: false };\n"], snapshot = false },
  { argv = ["vpt","write-file","packages/generator/generate.ts","const value: string = 'LOCAL_VPX_RAN';\nconsole.log(value);\n"], snapshot = false },
  { argv = ["vp","migrate","--full","--no-interactive","--no-hooks","--no-agent","--no-editor"], snapshot = false },
  { argv = ["pnpm","--filter","generator","install","--ignore-scripts"], snapshot = false },
