[[case]]
name = "focused_vitest_only_config_install"
vp = "global"
local-registry = true
env = { VP_NODE_VERSION = "24.22.3", VP_SKIP_INSTALL = "1" }
comment = "A member with its own Vitest config can load it after a filtered install and still publish with tsdown."
steps = [
  { argv = ["vpt", "json-edit", "package.json", "devDependencies", '{"vite":"8.3.8","vitest":"5.1.1"}'], snapshot = false },
  { argv = ["vpt", "write-file", "pnpm-workspace.yaml", "packages: ['packages/*']\nsharedWorkspaceLockfile: false\n"], snapshot = false },
  { argv = ["vpt", "mkdir", "-p", "packages/test-member/src"], snapshot = false },
  { argv = ["vpt", "write-file", "packages/test-member/package.json", '{"name":"test-member","private":true,"type":"module","scripts":{"release":"tsdown -c release.config.mts"},"devDependencies":{"tsdown":"0.22.14"}}'], snapshot = false },
  { argv = ["vpt", "write-file", "packages/test-member/vitest.config.ts", "import { defineConfig } from 'vitest/config'; export default defineConfig({ test: { globals: true } });"], snapshot = false },
  { argv = ["vpt", "write-file", "packages/test-member/release.config.mts", "export default { entry: 'src/index.ts', outDir: 'release-out', dts: false };"], snapshot = false },
  { argv = ["vpt", "write-file", "packages/test-member/src/index.ts", "export const sample = true;"], snapshot = false },
  { argv = ["vpt", "write-file", "packages/test-member/src/example.spec.ts", "test('loads the member config', () => expect(1 + 1).toBe(2));"], snapshot = false },
  { argv = ["vp", "migrate", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], snapshot = false },
  ["vpt", "print-file", "packages/test-member/package.json", "packages/test-member/vitest.config.ts"],
  { argv = ["pnpm", "--filter", "test-member", "install", "--ignore-scripts"], snapshot = false },
  ["vpt", "stat-file", "node_modules/vite-plus", "--assert", "missing"],
  { argv = ["node", "--input-type=module", "-e", "console.log((await import('./vitest.config.ts')).default.test.globals)"], cwd = "packages/test-member" },
  { argv = ["vp", "test", "run", "--config", "vitest.config.ts"], cwd = "packages/test-member", snapshot = false },
  { argv = ["vp", "run", "release"], cwd = "packages/test-member", snapshot = false },
  ["vpt", "stat-file", "packages/test-member/release-out/index.mjs", "--assert", "file"],
]

