[[case]]
name = "migration_husky_latest_dist_tag_v9_installed"
vp = "global"
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "an installed Husky version should still be preserved", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], comment = "Husky metadata should remain", continue-on-failure = true },
  { argv = ["vpt", "print-file", "pnpm-workspace.yaml"], comment = "check pnpm-workspace.yaml has overrides and catalog", continue-on-failure = true },
]
