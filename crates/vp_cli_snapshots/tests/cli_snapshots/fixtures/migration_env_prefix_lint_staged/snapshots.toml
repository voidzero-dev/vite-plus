[[case]]
name = "migration_env_prefix_lint_staged"
vp = "global"
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "migration should preserve the existing Husky setup", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], comment = "check Husky prepare, dependencies, and lint-staged config are preserved", continue-on-failure = true },
  { argv = ["vpt", "print-file", "pnpm-workspace.yaml"], comment = "check pnpm-workspace.yaml has overrides and catalog", continue-on-failure = true },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "check staged config is not migrated while Husky owns the hook", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".husky/pre-commit"], comment = "check the env-prefixed Husky hook is unchanged", continue-on-failure = true },
]
