[[case]]
name = "global_bin_name_validation"
vp = "global"
comment = "Skip unsafe bin names and targets even with --ignore-scripts, while installing valid commands and preserving files outside VP_HOME."
steps = [{ argv = ["node", "verify.mjs"], tty = false }]

[[case]]
name = "global_bin_name_deduplication"
vp = "global"
comment = "Keep the first valid target for duplicate normalized bin names, including native and JavaScript collisions."
steps = [{ argv = ["node", "verify-duplicates.mjs"], tty = false }]
