[[case]]
name = "staged_preserves_config_hooks"
vp = "local"
unset-env = ["NODE_ENV"]
steps = [
  { argv = ["git", "init", "--quiet"], snapshot = false },
  { argv = ["git", "add", "input.txt"], snapshot = false },
  { argv = ["git", "commit", "--quiet", "-m", "initial"], snapshot = false },
  { argv = ["vpt", "write-file", "input.txt", "changed\n"], snapshot = false },
  { argv = ["git", "add", "input.txt"], snapshot = false },
  { argv = ["vp", "staged", "--quiet", "--no-stash"], comment = "Run staged configuration supplied by a Vite plugin with normal config metadata." },
  ["vpt", "print-file", "result.txt"],
]

[[case]]
name = "pack_preserves_config_hooks"
vp = "local"
env = { NODE_ENV = "development" }
steps = [
  { argv = ["vp", "pack", "--logLevel", "silent"], comment = "Build with plugin-supplied pack options and configuration metadata available in configResolved." },
  ["node", "verify-pack.mjs"],
]
