[[case]]
name = "migration_existing_husky"
vp = "global"
steps = [
  { argv = ["git", "init"], snapshot = false, continue-on-failure = true },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "migration should preserve the Husky setup", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], comment = "prepare and the Husky dependency should remain", continue-on-failure = true },
  { argv = ["vpt", "print-file", "pnpm-workspace.yaml"], comment = "check pnpm-workspace.yaml has overrides and catalog", continue-on-failure = true },
  { argv = ["vpt", "print-file", ".husky/pre-commit"], comment = "the Husky hook should remain unchanged", continue-on-failure = true },
  { argv = ["vpt", "stat-file", ".vite-hooks", "--assert-not", "dir"], comment = "Vite+ hooks should not be installed alongside Husky", continue-on-failure = true },
]
