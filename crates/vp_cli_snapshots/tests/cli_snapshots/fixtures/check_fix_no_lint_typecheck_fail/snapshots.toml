[[case]]
name = "check_fix_no_lint_typecheck_fail"
vp = "local"
steps = [
  { argv = ["vp", "check", "--fix", "--no-lint"], continue-on-failure = true },
]

[[case]]
name = "check_fix_dangerously_no_lint_typecheck_fail"
vp = "local"
steps = [
  { argv = ["vp", "check", "--fix-dangerously", "--no-lint"], continue-on-failure = true },
]
