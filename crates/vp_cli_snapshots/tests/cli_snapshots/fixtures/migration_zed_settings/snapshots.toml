[[case]]
name = "migration_zed_settings"
vp = "global"
steps = [
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--editor", "zed"], snapshot = false },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "Migration preserves the project's lint options." },
  { argv = ["node", "--input-type=module", "-e", "import fs from 'node:fs'; const settings = JSON.parse(fs.readFileSync('.zed/settings.json', 'utf8')); console.log(JSON.stringify(settings.lsp, null, 2));"], comment = "Generated Zed settings leave typeAware and unusedDisableDirectives unset so Oxlint uses the project config." },
  { argv = ["vpt", "json-edit", ".zed/settings.json", "lsp.oxlint.initialization_options.settings.typeAware", "true"], snapshot = false },
  { argv = ["vpt", "json-edit", ".zed/settings.json", "lsp.oxlint.initialization_options.settings.unusedDisableDirectives", "deny"], snapshot = false },
  { argv = ["vp", "migrate", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--editor", "zed"], snapshot = false },
  { argv = ["node", "--input-type=module", "-e", "import fs from 'node:fs'; const settings = JSON.parse(fs.readFileSync('.zed/settings.json', 'utf8')); console.log(JSON.stringify(settings.lsp.oxlint, null, 2));"], comment = "A later migration preserves explicit editor overrides." },
]
