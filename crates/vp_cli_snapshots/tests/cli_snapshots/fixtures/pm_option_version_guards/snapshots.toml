[[case]]
name = "npm_option_version_guards"
vp = ["local", "global"]
env = { VP_PACKAGE_MANAGER = "npm@5.8.0" }
steps = [
  { argv = ["vp", "pm", "publish", "--dry-run"], comment = "Reject preview before an npm version that would publish despite dry-run. The fixture is also private for safety.", continue-on-failure = true },
  { argv = ["vp", "pm", "publish", "--provenance"], continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--filter", "app"], continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--pack-destination", "dist"], continue-on-failure = true },
  { argv = ["vp", "install", "--filter", "app"], continue-on-failure = true },
  { argv = ["vp", "install", "--workspace-root"], continue-on-failure = true },
]

[[case]]
name = "pnpm_option_version_guards"
vp = ["local", "global"]
env = { VP_PACKAGE_MANAGER = "pnpm@10.3.0" }
steps = [
  { argv = ["vp", "add", "testnpm2", "--allow-build", "testnpm2"], continue-on-failure = true },
  { argv = ["vp", "add", "testnpm2", "--save-catalog-name", "web"], continue-on-failure = true },
  { argv = ["vp", "install", "testnpm2", "--save-catalog"], comment = "The install alias must use the add support checks.", continue-on-failure = true },
  { argv = ["vp", "pm", "pack", "--recursive"], continue-on-failure = true },
  { argv = ["vp", "pm", "list", "--find-by", "finder"], continue-on-failure = true },
  { argv = ["vp", "why", "testnpm2", "--find-by", "finder"], continue-on-failure = true },
  { argv = ["vp", "why", "--find-by", "finder"], comment = "Package names remain required even when a finder is supplied.", continue-on-failure = true },
]

[[case]]
name = "pnpm_publish_json_regression"
vp = ["local", "global"]
env = { VP_PACKAGE_MANAGER = "pnpm@11.0.6" }
steps = [
  { argv = ["vp", "pm", "publish", "--dry-run", "--json"], comment = "Reject the release range that silently omitted JSON output." },
]

[[case]]
name = "yarn_option_version_guards"
vp = ["local", "global"]
env = { VP_PACKAGE_MANAGER = "yarn@2.4.2" }
steps = [
  { argv = ["vp", "install", "--fix-lockfile"], continue-on-failure = true },
  { argv = ["vp", "add", "testnpm2", "--ignore-scripts"], comment = "Yarn 2 supports skip-builds for install, but not for add.", continue-on-failure = true },
]

[[case]]
name = "bun_option_version_guards"
vp = ["local", "global"]
env = { VP_PACKAGE_MANAGER = "bun@1.3.14" }
steps = [
  { argv = ["vp", "update", "--prod"], continue-on-failure = true },
  { argv = ["vp", "update", "--no-optional"], continue-on-failure = true },
  { argv = ["vp", "update", "--recursive"], continue-on-failure = true },
  { argv = ["vp", "update", "--filter", "app"], comment = "Older Bun supports filters only in interactive update.", continue-on-failure = true },
]
