[[case]]
name = "vpx_script_node22"
vp = ["local", "global"]
comment = "Node.js 22.22.3+ uses the in-thread module.registerHooks() too, without nodejs/node#62920, and lowers `using` to a runtime helper."
steps = [
  { argv = ["vpx", "./main.ts"] },
  { argv = ["vpx", "./import-cjs.ts"], comment = "An imported CommonJS module can require() other files" },
  { argv = ["vpx", "./import-both.ts"], comment = "A .cts with ES module syntax fails with the same error on the in-thread path" },
  { argv = ["vpx", "./deco.ts"], cwd = "cjs", comment = "CommonJS output require()s runtime helpers that the project cannot resolve itself" },
]
