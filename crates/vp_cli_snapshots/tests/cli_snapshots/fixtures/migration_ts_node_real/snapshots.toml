[[case]]
name = "migration_ts_node_real_project"
vp = "local"
local-registry = true
env = { VP_NODE_VERSION = "22.18.0" }
unset-env = ["NODE_OPTIONS", "VP_SCRIPT_TSCONFIG", "TSX_TSCONFIG_PATH", "OXC_TSCONFIG_PATH", "TS_NODE_PROJECT", "TS_NODE_TRANSPILE_ONLY", "TS_NODE_TYPE_CHECK"]
comment = "The local registry fetches pinned published ts-node 10.9.2 and TypeScript 5.9.3 on the first run to compare the real compilers; response bytes are cached for the run and installations remain case-local. Explicit transpile-only options override the selected config."
steps = [
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vp", "run", "cli"], comment = "Before migration: the CLI --project selects the project JSX factory, even though that config disables transpile-only." },
  { argv = ["vp", "run", "register"], comment = "Before migration: TS_NODE_PROJECT and register/transpile-only select the same config and execution mode." },
  ["vp", "migrate", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "package.json"],
  { argv = ["vpt", "rm", "-rf", "node_modules"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vpt", "stat-file", "node_modules/ts-node"], comment = "A clean install no longer contains ts-node." },
  { argv = ["vp", "run", "cli"], comment = "After migration: vpx selects the same project JSX factory." },
  { argv = ["vp", "run", "register"], comment = "After migration: the public register produces the same output without ts-node." },
]

[[case]]
name = "migration_ts_node_real_discovery"
vp = "local"
local-registry = true
env = { VP_NODE_VERSION = "22.18.0" }
unset-env = ["NODE_OPTIONS", "VP_SCRIPT_TSCONFIG", "TSX_TSCONFIG_PATH", "OXC_TSCONFIG_PATH", "TS_NODE_PROJECT", "TS_NODE_TRANSPILE_ONLY", "TS_NODE_TYPE_CHECK"]
comment = "Real ts-node searches from the entry directory for its CLI and from the working directory for its Node.js preload. Different JSX factories make that distinction visible."
steps = [
  { argv = ["vpt", "json-edit", "package.json", "scripts.cli", "ts-node ./scripts/config.tsx"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "scripts.register", "node --require ts-node/register ./scripts/config.tsx"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vp", "run", "cli"], comment = "Before migration: CLI discovery uses scripts/tsconfig.json." },
  { argv = ["vp", "run", "register"], comment = "Before migration: preload discovery uses the root tsconfig.json." },
  ["vp", "migrate", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  { argv = ["vpt", "print-file", "package.json"], comment = "The CLI pins its discovered config. The preload and ts-node dependency stay because its config was not explicitly selected." },
  { argv = ["vpt", "rm", "-rf", "node_modules"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vp", "run", "cli"], comment = "After migration: vpx still uses the entry-directory factory." },
  { argv = ["vp", "run", "register"], comment = "After migration: the retained ts-node preload still uses the working-directory factory." },
]

[[case]]
name = "migration_ts_node_real_precedence"
vp = "local"
local-registry = true
env = { VP_NODE_VERSION = "22.18.0", NODE_OPTIONS = "--stack-trace-limit=0" }
unset-env = ["VP_SCRIPT_TSCONFIG", "TSX_TSCONFIG_PATH", "OXC_TSCONFIG_PATH", "TS_NODE_PROJECT", "TS_NODE_TRANSPILE_ONLY", "TS_NODE_TYPE_CHECK"]
comment = "A deliberate TS2322 error distinguishes transpilation from type checking. Config overrides the transpile-only environment setting, while an explicit type-check option or environment setting wins over transpile-only."
steps = [
  { argv = ["vpt", "json-edit", "package.json", "scripts", "{}"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "scripts.config-wins", "TS_NODE_TRANSPILE_ONLY=false ts-node ./scripts/type-error.ts"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "scripts.type-check", "ts-node --transpileOnly --typeCheck ./scripts/type-error.ts"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "scripts.env-type-check", "TS_NODE_TYPE_CHECK=true ts-node --transpileOnly ./scripts/type-error.ts"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vp", "run", "config-wins"], comment = "Before migration: transpileOnly:true in the entry config overrides TS_NODE_TRANSPILE_ONLY=false and executes the invalid assignment." },
  { argv = ["vp", "run", "type-check"], comment = "Before migration: --typeCheck wins over --transpileOnly and rejects the assignment.", continue-on-failure = true },
  { argv = ["vp", "run", "env-type-check"], comment = "Before migration: TS_NODE_TYPE_CHECK=true also keeps type checking enabled.", continue-on-failure = true },
  { argv = ["vp", "migrate", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], continue-on-failure = true },
  ["vpt", "print-file", "package.json"],
  { argv = ["vpt", "rm", "-rf", "node_modules"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vp", "run", "config-wins"], comment = "After migration: vpx produces the same value for the supported transpile-only command." },
  { argv = ["vp", "run", "type-check"], comment = "After migration: the retained command still rejects the assignment.", continue-on-failure = true },
  { argv = ["vp", "run", "env-type-check"], comment = "After migration: the retained environment-controlled type check still rejects it.", continue-on-failure = true },
]
