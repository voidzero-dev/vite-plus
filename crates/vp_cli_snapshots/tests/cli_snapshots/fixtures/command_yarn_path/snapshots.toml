[[case]]
name = "command_yarn_path"
vp = "global"
steps = [
  { argv = ["vp", "env", "exec", "--package-manager", "yarn@3.8.7", "node", "setup.cjs", "3.8.7"], snapshot = false },
  { argv = ["vp", "env", "exec", "--package-manager", "yarn@2.4.2", "node", "setup.cjs", "2.4.2"], snapshot = false },
  { argv = ["vp", "env", "exec", "--package-manager", "yarn@4.18.0", "node", "setup.cjs", "4.18.0"], snapshot = false },
  { argv = ["vpt", "write-file", ".yarnrc.yml", "nodeLinker: node-modules\nyarnPath: .yarn/releases/yarn-3.8.7.cjs\n"], snapshot = false },
  { argv = ["vp", "install"], snapshot = false },
  { argv = ["vpt", "mkdir", "-p", "../linked-lib"], snapshot = false },
  { argv = ["vpt", "write-file", "../linked-lib/package.json", "{\"name\":\"linked-lib\",\"version\":\"1.0.0\"}\n"], snapshot = false },
  { argv = ["vp", "link", "../linked-lib"], snapshot = false },
  { argv = ["vp", "unlink", "linked-lib"], comment = "The Yarn 2 launcher delegates unlink to Yarn 3." },
  { argv = ["node", "verify.cjs", "unlink"] },
  { argv = ["node", "verify.cjs", "patch"], comment = "The same launcher must let Yarn 3 save a patch." },
  { argv = ["vpt", "write-file", ".yarnrc.yml", "yarnPath: .yarn/releases/yarn-3.8.7.cjs\nignorePath: true\n"], snapshot = false },
  { argv = ["vp", "unlink", "linked-lib"], comment = "ignorePath keeps Yarn 2 active, so unlink is skipped." },
  { argv = ["vp", "pm", "patch-commit", "unused"], comment = "ignorePath also keeps the patch saving gate on Yarn 2." },
  { argv = ["vpt", "write-file", ".yarnrc.yml", "yarnPath: .yarn/releases/yarn-3.8.7.cjs\n"], snapshot = false },
  { argv = ["vp", "unlink", "linked-lib"], envs = [["YARN_IGNORE_PATH", "1"]], comment = "The environment override also disables delegation." },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "yarn@3.8.7"], snapshot = false },
  { argv = ["vpt", "write-file", ".yarnrc.yml", "yarnPath: .yarn/releases/yarn-2.4.2.cjs\n"], snapshot = false },
  { argv = ["vp", "unlink", "linked-lib"], comment = "A newer launcher delegating to Yarn 2 must still skip unlink." },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "yarn@4.18.0"], snapshot = false },
  { argv = ["vpt", "write-file", ".yarnrc.yml", "nodeLinker: node-modules\nyarnPath: .yarn/releases/yarn-3.8.7.cjs\n"], snapshot = false },
  { argv = ["vp", "unlink", "linked-lib"], comment = "A Yarn 4 launcher must not inject Yarn 4 settings into the effective Yarn 3." },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "yarn@2.4.2"], snapshot = false },
  { argv = ["vpt", "write-file", ".yarnrc.yml", "nodeLinker: node-modules\nyarnPath: .yarn/releases/yarn-4.18.0.cjs\n"], snapshot = false },
  { argv = ["vp", "unlink", "linked-lib"], comment = "The Yarn 2 launcher must also accept the settings for its effective Yarn 4." },
  { argv = ["vpt", "write-file", "preload.cjs", "console.log('preload output');\n"], snapshot = false },
  { argv = ["vp", "unlink", "linked-lib"], envs = [["NODE_OPTIONS", "--require ./preload.cjs"]], comment = "A preload that prints to stdout must not break the version query." },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "yarn@3.8.7"], snapshot = false },
  { argv = ["vpt", "write-file", ".yarnrc.yml", "yarnPath: .yarn/releases/missing.cjs\n"], snapshot = false },
  { argv = ["vp", "unlink", "linked-lib"], comment = "A failed version query must report an error rather than fall back to the launcher version.", continue-on-failure = true },
  { argv = ["vpt", "write-file", ".yarn/releases/invalid.cjs", "console.log('not-a-version');\n"], snapshot = false },
  { argv = ["vpt", "write-file", ".yarnrc.yml", "yarnPath: .yarn/releases/invalid.cjs\n"], snapshot = false },
  { argv = ["vp", "unlink", "linked-lib"], comment = "An invalid version response must not pass the gate.", continue-on-failure = true },
]
