[[case]]
name = "migration_merge_vite_config_ts"
vp = "global"
steps = [
  { argv = ["vp", "migrate", "--no-interactive"], comment = "migration should merge vite.config.ts and remove oxlintrc and oxfmtrc", continue-on-failure = true },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "check merged config preserves the Rolldown chunk name callback", continue-on-failure = true },
  { argv = ["vpt", "stat-file", ".oxlintrc.json", "--assert-not", "file"], comment = "check .oxlintrc.json is removed", continue-on-failure = true },
  { argv = ["vpt", "stat-file", ".oxfmtrc.json", "--assert-not", "file"], comment = "check .oxfmtrc.json is removed", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], comment = "check package.json", continue-on-failure = true },
  { argv = ["vpt", "print-file", "pnpm-workspace.yaml"], comment = "check pnpm-workspace.yaml has overrides and catalog", continue-on-failure = true },
]

[[case]]
name = "migration_merge_wrapped_callback"
vp = "global"
comment = "Merge settings through parentheses and type wrappers while preserving nested function returns."
steps = [
  { argv = ["vpt", "replace-file-content", "vite.config.ts", "export default defineConfig({", "import type { UserConfigFn } from 'vite';\n\nexport default defineConfig(<UserConfigFn>(((() => {\n  return {"], snapshot = false },
  { argv = ["vpt", "replace-file-content", "vite.config.ts", "});", "  };\n}) as UserConfigFn) satisfies UserConfigFn)!);"], snapshot = false },
  ["vp", "migrate", "--no-interactive"],
  ["vpt", "print-file", "vite.config.ts"],
  ["vpt", "stat-file", ".oxlintrc.json", "--assert", "missing"],
  ["vpt", "stat-file", ".oxfmtrc.json", "--assert", "missing"],
]

[[case]]
name = "migration_merge_partial_returns"
vp = "global"
comment = "Keep the standalone configs when a direct callback return cannot receive the merged settings."
steps = [
  { argv = ["vpt", "write-file", "vite.config.ts", "import { defineConfig } from 'vite';\n\nexport default defineConfig(({ command }) => {\n  function devConfig() {\n    return { server: { port: 3000 } };\n  }\n  if (command === 'serve') return devConfig();\n  return { build: { sourcemap: true } };\n});\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], continue-on-failure = true },
  { argv = ["vpt", "print-file", "vite.config.ts"], comment = "neither branch receives lint or fmt", continue-on-failure = true },
  { argv = ["vpt", "stat-file", ".oxlintrc.json", "--assert", "file"], comment = "check .oxlintrc.json is preserved", continue-on-failure = true },
  { argv = ["vpt", "stat-file", ".oxfmtrc.json", "--assert", "file"], comment = "check .oxfmtrc.json is preserved", continue-on-failure = true },
]
