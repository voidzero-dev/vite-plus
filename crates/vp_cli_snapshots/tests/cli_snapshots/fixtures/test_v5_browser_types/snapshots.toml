[[case]]
name = "packed_browser_declarations"
vp = "global"
local-registry = true
comment = "Packed browser declarations must preserve DOM matchers, provider augmentations, and role types without importing all aliases together."
steps = [
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false, timeout = 180000 },
  { argv = ["node", "verify.mjs"], timeout = 120000 },
]
