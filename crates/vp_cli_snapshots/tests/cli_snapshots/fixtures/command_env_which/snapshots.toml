[[case]]
name = "command_env_which"
vp = "global"
local-registry = true
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "env", "exec", "node", "--version"], comment = "Ensure Node.js is installed first", continue-on-failure = true },
  { argv = ["vp", "env", "which", "node"], comment = "Core tool - shows resolved Node.js binary path", continue-on-failure = true },
  { argv = ["vp", "env", "which", "npm"], comment = "Core tool - shows resolved npm binary path", continue-on-failure = true },
  { argv = ["vp", "env", "which", "npx"], comment = "Core tool - shows resolved npx binary path", continue-on-failure = true },
  { argv = ["vp", "install", "-g", "cowsay@1.6.0"], comment = "Install a global package via vp", continue-on-failure = true },
  { argv = ["vp", "env", "which", "cowsay"], comment = "Global package - shows binary path with metadata", continue-on-failure = true },
  { argv = ["vp", "remove", "-g", "cowsay"], comment = "Cleanup", continue-on-failure = true },
  { argv = ["vp", "env", "which", "unknown-tool"], comment = "Unknown tool - error message", continue-on-failure = true },
]

[[case]]
name = "command_env_print_concrete_package_manager_fallback"
vp = "global"
local-registry = true
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "env", "print", "pnpm"], comment = "a concrete family falls back to its latest release and Fish keeps a spaced install path intact", envs = [["VP_HOME", "${workspace}/custom home"], ["VP_SHELL", "fish"]] },
]

[[case]]
name = "command_env_print_npm_uses_standalone_fallback"
vp = "global"
local-registry = true
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "env", "print", "npm"], comment = "an explicit npm scope uses the standalone registry fallback" },
]

[[case]]
name = "command_env_current_concrete_package_manager_fallback"
vp = "global"
local-registry = true
steps = [
  { argv = ["vp", "env", "current", "pnpm", "--json"], comment = "a concrete family reports the same registry fallback as its shim" },
]

[[case]]
name = "command_env_current_npm_uses_standalone_fallback"
vp = "global"
local-registry = true
steps = [
  { argv = ["vp", "env", "current", "npm", "--json"], comment = "an explicit npm scope reports the standalone registry fallback" },
]
