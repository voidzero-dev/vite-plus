[[case]]
name = "global_wanted_range"
vp = "global"
steps = [
  { argv = ["vp", "install", "-g", "testnpm2@^1", "range-alias@npm:testnpm2@^1"], snapshot = false },
  { argv = ["vp", "list", "-g"], comment = "npm prefers the matching latest tag for both installs" },
  { argv = ["vp", "outdated", "-g", "--format", "json"] },
  { tty = false, argv = ["vp", "update", "-g"], comment = "both installed versions already satisfy the update" },
]
