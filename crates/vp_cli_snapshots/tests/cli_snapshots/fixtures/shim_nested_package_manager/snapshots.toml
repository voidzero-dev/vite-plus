[[case]]
name = "nested_package_manager_respects_shim_mode"
vp = "global"
skip-platforms = ["windows"]
steps = [
  { argv = ["vpt", "chmod", "+x", "system-bin/pnpm"], snapshot = false },
  { argv = ["vp", "env", "on", "pnpm"], snapshot = false },
  { argv = ["pnpm", "--version"], snapshot = false },
  { argv = ["npx", "--offline", "--call", "pnpm --version"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "Managed mode keeps the project pin even when system pnpm is available" },
  { argv = ["vp", "env", "off", "pnpm"], snapshot = false },
  { argv = ["npx", "--offline", "--call", "pnpm --version"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "System-first mode still selects system pnpm" },
]

[[case]]
name = "nested_explicit_versions_replace_injected_tools"
vp = "global"
# Keep pnpm's own version switching from overriding the explicit vp selection.
env = { npm_config_manage_package_manager_versions = "false" }
steps = [
  { argv = ["vp", "env", "on", "pnpm"], snapshot = false },
  { argv = ["npx", "--offline", "--call", "pnpm exec vp env exec --node 22.18.0 --package-manager pnpm@10.18.0 node assert-injected-tools.cjs pnpm 10.18.0 22.18.0"], comment = "Explicit versions replace the inherited runtime and package manager", snapshot = false },
  { argv = ["npx", "--offline", "--call", "pnpm exec vp env exec --node 22.18.0 --package-manager pnpm@10.18.0 node assert-injected-tools.cjs pnpm 10.18.0 22.18.0"], comment = "Re-entering a shim keeps the explicitly selected versions" },
]
