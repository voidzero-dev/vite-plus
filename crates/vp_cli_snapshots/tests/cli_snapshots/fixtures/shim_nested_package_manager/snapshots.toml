[[case]]
name = "nested_package_manager_resolves_project_version"
vp = "global"
steps = [
  { argv = ["vp", "env", "on", "pnpm"], snapshot = false },
  { argv = ["npx", "--offline", "--call", "pnpm --version"], comment = "A nested shim resolves and installs the pinned pnpm on first use", snapshot = false },
  { argv = ["npx", "--offline", "--call", "pnpm --version"], comment = "npx can invoke the project pnpm without a system pnpm" },
  { argv = ["npm", "run", "--silent", "probe"], comment = "npm lifecycle scripts can invoke the project pnpm" },
  { argv = ["npx", "--offline", "--call", "pnpm exec node assert-injected-tools.cjs pnpm 10.19.0 20.18.0"], comment = "Injected tools accumulate and an explicit shim invocation reuses them" },
  { argv = ["pnpm", "exec", "pnpm", "--version"], comment = "Same-family child calls still reach the real binary" },
  { argv = ["npx", "--offline", "--call", "pnpm exec node -e \"require('node:assert/strict').equal(process.version,'v20.18.0');console.log('project Node version preserved')\""], comment = "The nested package manager keeps the selected Node.js runtime" },
  { argv = ["npx", "--offline", "--call", "pnpm exec npx --offline --call \"pnpm --version\""], comment = "Repeated cross-family calls complete without a shim loop" },
]

[[case]]
name = "nested_yarn_resolves_project_version"
vp = "global"
steps = [
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "yarn@4.12.0"], snapshot = false },
  { argv = ["vp", "env", "on", "yarn"], snapshot = false },
  { argv = ["npx", "--offline", "--call", "yarn --version"], comment = "A nested shim installs the project Yarn on first use", snapshot = false },
  { argv = ["npx", "--offline", "--call", "yarn --version"], comment = "npx resolves the project Yarn without a system Yarn" },
  { argv = ["npx", "--offline", "--call", "yarnpkg --version"], comment = "The Yarn alias resolves the same project version" },
]

