[[case]]
name = "pm_audit_bun"
# Exceeded 20 seconds on Windows in CI run 35299447671.
skip-platforms = ["windows"]
vp = "global"
cwd = "bun"
# mock-manifest.json keeps audit responses local so these command-routing checks
# do not depend on the availability or contents of npm's advisory service.
steps = [
  { argv = ["vp", "install", "--", "--silent"], comment = "should install packages first", continue-on-failure = true },
  { argv = ["vp", "pm", "audit", "--production"], comment = "should audit production dependencies" },
  { argv = ["vp", "pm", "audit", "--fix"], comment = "bun 1.4 runs bun audit fix" },
  { argv = ["node", "../setup-yarn.cjs"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "yarn@2.3.1"], snapshot = false },
  { argv = ["vp", "pm", "audit", "--json"], comment = "Yarn Berry before 2.4.0 has no npm audit, so warn without querying the registry." },
]
