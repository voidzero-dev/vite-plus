[[case]]
name = "placement_and_path_precedence"
vp = "global"
steps = [
  # Start with all tools managed; system-bin provides an alternative Node.
  { argv = ["node", "setup-system-node.cjs"], snapshot = false },
  { argv = ["vp", "env", "on"], snapshot = false },
  # Keep inspection steps on case-owned Node even when Windows PATH includes a host installation.
  { argv = ["node", "list-shims.cjs", "$VP_HOME/bin", "$VP_HOME/fallback-bin"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "Managed mode keeps all tool families in the main bin; fallback can be empty." },

  # Move Node to fallback and verify that the external tool takes precedence.
  ["vp", "env", "off", "node"],
  { argv = ["node", "list-shims.cjs", "$VP_HOME/bin", "$VP_HOME/fallback-bin"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "Only Node moves to fallback." },
  { argv = ["node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "The shell selects system Node before fallback." },
  { argv = ["node", "assert-node-resolution.cjs"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "Internal Node resolution agrees with PATH." },
  { argv = ["vp", "node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "vp node (env exec node) selects system Node like the shell." },

  # Move the pnpm family together; refresh must preserve both preferences.
  ["vp", "env", "off", "pnpm"],
  { argv = ["node", "list-shims.cjs", "$VP_HOME/bin", "$VP_HOME/fallback-bin"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "pnpm and pnpx move together; other families and vpx/vpr stay managed." },
  { argv = ["vp", "env", "setup", "--refresh"], snapshot = false },
  { argv = ["node", "list-shims.cjs", "$VP_HOME/bin", "$VP_HOME/fallback-bin"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "Refresh preserves saved choices." },

  # Reverse PATH: reaching the Vite+ shim first must select managed Node.
  { argv = ["node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/fallback-bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "A fallback shim before system Node selects managed Node." },
  { argv = ["node", "assert-node-resolution.cjs"], envs = [["PATH", "${VP_HOME}/fallback-bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "Internal resolution must also stop at the first Vite+ shim." },
  { argv = ["vp", "node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/fallback-bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "vp node also stops at the first Vite+ shim." },

  # Restore each family independently; fallback should end up empty.
  ["vp", "env", "on", "node"],
  { argv = ["node", "list-shims.cjs", "$VP_HOME/bin", "$VP_HOME/fallback-bin"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "Restoring Node leaves the pnpm preference intact and removes its old fallback entry." },
  { argv = ["node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "Managed Node takes precedence again." },
  ["vp", "env", "on", "pnpm"],
  { argv = ["node", "list-shims.cjs", "$VP_HOME/bin", "$VP_HOME/fallback-bin"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "Restoring pnpm empties fallback again." },
]

[[case]]
name = "foreign_manager_falls_back_without_recursion"
vp = "global"
steps = [
  # The external manager forwards to Vite+ without removing itself from PATH.
  { argv = ["node", "setup-foreign-manager.cjs"], snapshot = false },
  ["vp", "env", "off", "node"],
  # Piped std::process execution handles the Windows .cmd manager; ConPTY cannot launch it directly.
  { argv = ["node", "--version"], tty = false, envs = [["PATH", "${workspace}/foreign-bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "The external manager forwards to the managed fallback without re-entering itself." },
  { argv = ["node", "--version"], tty = false, envs = [["PATH", "${workspace}/foreign-bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"], ["VP_PATH_INJECTED_TOOLS", "node"]], comment = "An inherited injection marker must not cause recursion either." },
  { argv = ["vp", "env", "exec", "node", "--version"], envs = [["PATH", "${workspace}/foreign-bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "env exec still runs managed Node when the inherited PATH contains the external manager." },
  # Under system-only the external manager forwards to the fallback shim, which fails at once.
  { argv = ["node", "--version"], tty = false, timeout = 20000, envs = [["PATH", "${workspace}/foreign-bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "System-only Node.js fails in the fallback shim instead of forwarding back to the external manager or using the managed runtime.", continue-on-failure = true },
]

[[case]]
name = "split_layout_preserves_foreign_tools"
vp = "global"
# Windows resolves config through OS known folders, which HOME/APPDATA overrides do not isolate.
skip-platforms = ["windows"]
requires = ["sh"]
steps = [
  # Prepare isolated roots and an existing foreign Node in shared-bin.
  { argv = ["vpt", "mkdir", "-p", "data/current"], snapshot = false },
  { argv = ["vpt", "cp", "-r", "$VP_HOME/current/bin", "data/current/bin"], comment = "Copy the installed CLI and its setup marker into the split data root.", snapshot = false },
  { argv = ["node", "setup-split-layout.cjs"], snapshot = false },

  # Setup must preserve the foreign Node and generate the split shell PATH.
  { argv = ["vp", "env", "setup", "--refresh"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["XDG_CONFIG_HOME", "${workspace}/config"], ["PATH", "${workspace}/data/current/bin${PATH_SEPARATOR}${PATH}"]], snapshot = false },
  { argv = ["node", "list-shims.cjs", "shared-bin", "data/fallback-bin"], comment = "Setup preserves the existing executable in the shared bin." },
  { argv = ["sh", "split.sh"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["XDG_CONFIG_HOME", "${workspace}/config"]], comment = "The generated shell script puts shared bin first and data-root fallback last." },
  { argv = ["node", "-p", "process.execPath.includes('shared-bin')"], envs = [["PATH", "${workspace}/shared-bin${PATH_SEPARATOR}${PATH}"]], comment = "The foreign Node remains executable." },
  { argv = ["vpx", "node", "-p", "process.execPath.includes('shared-bin')"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["XDG_CONFIG_HOME", "${workspace}/config"], ["PATH", "${workspace}/shared-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "System-only Node.js selects the foreign Node first on PATH in the shared bin." },

  # System-first adds a fallback under data while keeping the foreign Node intact.
  { argv = ["vp", "env", "off", "node"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["XDG_CONFIG_HOME", "${workspace}/config"], ["PATH", "${workspace}/data/current/bin${PATH_SEPARATOR}${PATH}"]], snapshot = false },
  { argv = ["node", "list-shims.cjs", "shared-bin", "data/fallback-bin"], comment = "System-first Node lives under the data root." },
  { argv = ["node", "-p", "process.execPath.includes('shared-bin')"], envs = [["PATH", "${workspace}/shared-bin${PATH_SEPARATOR}${PATH}"]], comment = "The foreign Node remains executable." },
  { argv = ["node", "-p", "process.env.VP_BIN_DIR === require('node:path').resolve('shared-bin')"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["PATH", "${workspace}/data/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "The split fallback executes managed Node with the configured main bin root." },

  # Refresh must retain the saved placement and the foreign executable.
  { argv = ["vp", "env", "setup", "--refresh"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["XDG_CONFIG_HOME", "${workspace}/config"], ["PATH", "${workspace}/data/current/bin${PATH_SEPARATOR}${PATH}"]], snapshot = false },
  { argv = ["node", "list-shims.cjs", "shared-bin", "data/fallback-bin"], comment = "Refresh preserves both placement and the foreign Node." },
  { argv = ["node", "-p", "process.execPath.includes('shared-bin')"], envs = [["PATH", "${workspace}/shared-bin${PATH_SEPARATOR}${PATH}"]], comment = "The foreign Node remains executable." },

  # Switching back removes the fallback without overwriting the foreign Node.
  { argv = ["vp", "env", "on", "node"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["XDG_CONFIG_HOME", "${workspace}/config"], ["PATH", "${workspace}/data/current/bin${PATH_SEPARATOR}${PATH}"]], snapshot = false },
  { argv = ["node", "list-shims.cjs", "shared-bin", "data/fallback-bin"], comment = "Managed mode must not overwrite a foreign executable either." },
  { argv = ["node", "-p", "process.execPath.includes('shared-bin')"], envs = [["PATH", "${workspace}/shared-bin${PATH_SEPARATOR}${PATH}"]], comment = "The foreign Node remains executable." },
]

# Bash command-cache behavior needs a persistent Unix shell; placement and recursion run on all platforms.
[[case]]
name = "bash_path_precedence_and_cache"
vp = "global"
skip-platforms = ["windows"]
requires = ["bash"]
steps = [
  { argv = ["bash", "placement.sh"], comment = "Reloading env is idempotent; mode changes invalidate Bash command paths." },
]

[[case]]
name = "vpx_script_follows_vp_node"
vp = "global"
cwd = "vpx-project"
comment = "vpx script mode runs on the Node.js that vp node selects, including system-first and system-only modes."
steps = [
  { argv = ["node", "../setup-system-node.cjs"], snapshot = false },
  { argv = ["vp", "env", "on"], snapshot = false },
  { argv = ["vp", "env", "off", "node"], snapshot = false },
  { argv = ["vpx", "--print", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "System-first: the system Node.js found on PATH, as vp node selects." },
  { argv = ["vpx", "--print", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/fallback-bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "A Vite+ shim before system Node.js selects managed Node.js." },
  ["vp", "env", "on", "node"],
  { argv = ["vpx", "--print", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "Managed mode ignores system Node.js." },
  { argv = ["vpx", "--print", "process.execPath.includes('system-bin')"], envs = [["PATH", "${workspace}/system-bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "System-only: the system Node.js first on PATH, as vp node selects, even with managed config.json." },
  { argv = ["vpx", "--print", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "System-only with the node shim first on PATH fails and suggests `vp env off node`, as vp node does.", continue-on-failure = true },
]

[[case]]
name = "system_only_overrides_managed_shims"
vp = "global"
comment = "VP_NODE_MANAGER=system-only restricts the Node.js and package-manager shims alike: they never search PATH or use managed installs. With managed config.json they fail and suggest `vp env off`; system tools still run when they come before the shims, as in a devShell, or after `vp env off`. Nothing is downloaded and the child PATH is unchanged."
steps = [
  { argv = ["node", "setup-system-node.cjs"], snapshot = false },
  { argv = ["node", "setup-system-tools.cjs"], snapshot = false },
  { argv = ["vpt", "write-file", "package.json", '{"packageManager":"pnpm@10.18.0"}'], snapshot = false },
  { argv = ["node", "list-managed.cjs"], comment = "Managed installs before the system-only steps: the pinned runtime is cached, and the override is not." },

  # Managed config.json puts the shims first; the unreachable mirror and registry fail any request.
  { argv = ["node", "--version"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "The node shim fails without searching PATH for the system Node.js after it, and suggests `vp env off node`.", continue-on-failure = true },
  { argv = ["node", "--version"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_BYPASS", "1"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "VP_BYPASS does not make it search PATH either.", continue-on-failure = true },
  { argv = ["pnpm", "--version"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "The pnpm shim fails the same way, despite the packageManager pin, and suggests `vp env off pnpm`.", continue-on-failure = true },
  { argv = ["npm", "--version"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "So does the npm shim, instead of running the npm bundled with a runtime.", continue-on-failure = true },
  { argv = ["node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "System-Only"]], comment = "Only the exact lowercase value is system-only; managed config.json stays in effect." },

  # A devShell puts the system tools before the shims; VP_NODE_VERSION would select a managed version.
  { argv = ["vp", "node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${workspace}/system-bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_VERSION", "24.0.0"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "vp node runs the system Node.js first on PATH, ignoring the session override." },
  { argv = ["vpx", "node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${workspace}/system-bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_VERSION", "24.0.0"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "vpx node does the same." },
  { argv = ["vp", "env", "exec", "npm", "--version"], envs = [["PATH", "${workspace}/system-bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${PATH}"], ["EXPECTED_PATH", "${workspace}/system-bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_VERSION", "24.0.0"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "vp env exec runs the system npm first on PATH, and the child PATH is unchanged." },

  # After `vp env off node`, the node shim moves after the system tools.
  ["vp", "env", "off", "node"],
  { argv = ["node", "--version"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "Without a system Node.js before the fallback shim, the shim fails instead of using the managed runtime.", continue-on-failure = true },
  # Without node in bin, the default PATH would resolve the host Node.js, which the runner rejects.
  { argv = ["node", "list-managed.cjs"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "The system-only steps downloaded nothing." },
]

[[case]]
name = "system_only_child_processes"
vp = "global"
comment = "VP_NODE_MANAGER=system-only holds for what the selected tools run: a `#!/usr/bin/env node` shebang and a nested `npm` resolve from the child PATH. The shims add no directory to it and leave directories inherited from a parent in place; where Vite+ selects a tool from PATH, a managed install there fails. A nested managed npm would print its version instead of the system marker."
# The fake npm is a shebang script, and run-shim.cjs starts shims without the `.exe` suffix.
skip-platforms = ["windows"]
steps = [
  { argv = ["node", "setup-system-node.cjs"], snapshot = false },
  { argv = ["node", "setup-child-tools.cjs"], snapshot = false },

  # The seeded runtime for the .node-version pin plays the managed runtime. It is only read:
  # it links the shared seed, so the case cannot plant fake managed tools there.
  # Its npm prints a version where the system npm prints a marker.
  # run-shim.cjs starts the shim by path while the managed runtime is first on PATH.
  # The unreachable mirror and registry fail any request.
  { argv = ["node", "run-shim.cjs", "npm", "nested"], envs = [["PATH", "${VP_HOME}/js_runtime/node/20.20.2/bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_PATH_INJECTED_TOOLS", "node,npm,npx"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "The npm shim fails before it would reuse the managed npm that a parent selected, and suggests `vp env off npm`.", continue-on-failure = true },
  { argv = ["node", "run-shim.cjs", "npm", "--version"], envs = [["PATH", "${VP_HOME}/js_runtime/node/20.20.2/bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_BYPASS", "1"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "VP_BYPASS does not hand the npm shim to the first npm on PATH outside the shims either.", continue-on-failure = true },
  { argv = ["vpx", "node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/js_runtime/node/20.20.2/bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "vpx takes Node.js from the first PATH match, the inherited managed runtime, and fails instead of skipping it.", continue-on-failure = true },
  { argv = ["vpx", "npm", "nested"], envs = [["PATH", "${VP_HOME}/js_runtime/node/20.20.2/bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "vpx fails the same way for npm when the first match is the npm bundled with the inherited managed runtime.", continue-on-failure = true },
  { argv = ["vpx", "npm", "--version"], envs = [["PATH", "${VP_HOME}/js_runtime/node/20.20.2/bin${PATH_SEPARATOR}${VP_HOME}/bin"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "Without a system npm either, the first match is the npm bundled with the inherited managed runtime, so vpx fails with a pointer to `vp env doctor` instead of running it or downloading one through dlx.", continue-on-failure = true },

  # run-shim.cjs starts shims from the bin directory, so the steps above come before the shims move.
  ["vp", "env", "off", "npm"],
  # The npm shim lives in fallback-bin from here on; the node shim stays in bin.
  { argv = ["npm", "nested"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "The shell runs system npm, whose shebang reaches the node shim still first on PATH. The shim fails and suggests `vp env off node` instead of running the managed runtime.", continue-on-failure = true },
  # Both shims live in fallback-bin from here on, after the system tools.
  ["vp", "env", "off", "node"],
  { argv = ["npm", "nested"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "With the shims after the system tools, the shell runs system npm on system Node.js, and so does its nested npm, without Vite+." },
