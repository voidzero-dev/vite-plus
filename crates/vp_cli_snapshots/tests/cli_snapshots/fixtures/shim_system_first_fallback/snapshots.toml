[[case]]
name = "placement_and_path_precedence"
vp = "global"
steps = [
  # Start with all tools managed; system-bin provides an alternative Node.
  { argv = ["node", "setup-system-node.cjs"], snapshot = false },
  { argv = ["vp", "env", "on"], snapshot = false },
  # Keep inspection steps on case-owned Node even when Windows PATH includes a host installation.
  { argv = ["node", "list-shims.cjs", "$VP_HOME/bin", "$VP_HOME/fallback-bin"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "Managed mode keeps all tool families in the main bin; fallback can be empty." },

  # Move Node to fallback and verify that the external tool takes precedence.
  ["vp", "env", "off", "node"],
  { argv = ["node", "list-shims.cjs", "$VP_HOME/bin", "$VP_HOME/fallback-bin"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "Only Node moves to fallback." },
  { argv = ["node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "The shell selects system Node before fallback." },
  { argv = ["node", "assert-node-resolution.cjs"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "Internal Node resolution agrees with PATH." },
  { argv = ["vp", "node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "vp node (env exec node) selects system Node like the shell." },

  # Move the pnpm family together; refresh must preserve both preferences.
  ["vp", "env", "off", "pnpm"],
  { argv = ["node", "list-shims.cjs", "$VP_HOME/bin", "$VP_HOME/fallback-bin"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "pnpm and pnpx move together; other families and vpx/vpr stay managed." },
  { argv = ["vp", "env", "setup", "--refresh"], snapshot = false },
  { argv = ["node", "list-shims.cjs", "$VP_HOME/bin", "$VP_HOME/fallback-bin"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "Refresh preserves saved choices." },

  # Reverse PATH: reaching the Vite+ shim first must select managed Node.
  { argv = ["node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/fallback-bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "A fallback shim before system Node selects managed Node." },
  { argv = ["node", "assert-node-resolution.cjs"], envs = [["PATH", "${VP_HOME}/fallback-bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "Internal resolution must also stop at the first Vite+ shim." },
  { argv = ["vp", "node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/fallback-bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "vp node also stops at the first Vite+ shim." },

  # Restore each family independently; fallback should end up empty.
  ["vp", "env", "on", "node"],
  { argv = ["node", "list-shims.cjs", "$VP_HOME/bin", "$VP_HOME/fallback-bin"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "Restoring Node leaves the pnpm preference intact and removes its old fallback entry." },
  { argv = ["node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "Managed Node takes precedence again." },
  ["vp", "env", "on", "pnpm"],
  { argv = ["node", "list-shims.cjs", "$VP_HOME/bin", "$VP_HOME/fallback-bin"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "Restoring pnpm empties fallback again." },
]

[[case]]
name = "foreign_manager_falls_back_without_recursion"
vp = "global"
steps = [
  # The external manager forwards to Vite+ without removing itself from PATH.
  { argv = ["node", "setup-foreign-manager.cjs"], snapshot = false },
  ["vp", "env", "off", "node"],
  # Piped std::process execution handles the Windows .cmd manager; ConPTY cannot launch it directly.
  { argv = ["node", "--version"], tty = false, envs = [["PATH", "${workspace}/foreign-bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "The external manager forwards to the managed fallback without re-entering itself." },
  { argv = ["node", "--version"], tty = false, envs = [["PATH", "${workspace}/foreign-bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"], ["VP_PATH_INJECTED_TOOLS", "node"]], comment = "An inherited injection marker must not cause recursion either." },
  { argv = ["vp", "env", "exec", "node", "--version"], envs = [["PATH", "${workspace}/foreign-bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "env exec still runs managed Node when the inherited PATH contains the external manager." },
  # Under system-only the shim selects the external manager, which forwards straight back.
  { argv = ["node", "--version"], tty = false, timeout = 20000, envs = [["PATH", "${workspace}/foreign-bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "System-only Node.js detects the forwarding loop and fails instead of re-entering the external manager forever or using the managed runtime.", continue-on-failure = true },
  { argv = ["npm", "--version"], tty = false, timeout = 20000, envs = [["PATH", "${workspace}/foreign-bin${PATH_SEPARATOR}${VP_HOME}/fallback-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "npm on system-only Node.js reports the loop that its query of the external manager ran into.", continue-on-failure = true },
]

[[case]]
name = "split_layout_preserves_foreign_tools"
vp = "global"
# Windows resolves config through OS known folders, which HOME/APPDATA overrides do not isolate.
skip-platforms = ["windows"]
requires = ["sh"]
steps = [
  # Prepare isolated roots and an existing foreign Node in shared-bin.
  { argv = ["vpt", "mkdir", "-p", "data/current"], snapshot = false },
  { argv = ["vpt", "cp", "-r", "$VP_HOME/current/bin", "data/current/bin"], comment = "Copy the installed CLI and its setup marker into the split data root.", snapshot = false },
  { argv = ["node", "setup-split-layout.cjs"], snapshot = false },

  # Setup must preserve the foreign Node and generate the split shell PATH.
  { argv = ["vp", "env", "setup", "--refresh"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["XDG_CONFIG_HOME", "${workspace}/config"], ["PATH", "${workspace}/data/current/bin${PATH_SEPARATOR}${PATH}"]], snapshot = false },
  { argv = ["node", "list-shims.cjs", "shared-bin", "data/fallback-bin"], comment = "Setup preserves the existing executable in the shared bin." },
  { argv = ["sh", "split.sh"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["XDG_CONFIG_HOME", "${workspace}/config"]], comment = "The generated shell script puts shared bin first and data-root fallback last." },
  { argv = ["node", "-p", "process.execPath.includes('shared-bin')"], envs = [["PATH", "${workspace}/shared-bin${PATH_SEPARATOR}${PATH}"]], comment = "The foreign Node remains executable." },
  { argv = ["vpx", "node", "-p", "process.execPath.includes('shared-bin')"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["XDG_CONFIG_HOME", "${workspace}/config"], ["PATH", "${workspace}/shared-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "System-only Node.js selects the foreign Node in the shared bin." },

  # System-first adds a fallback under data while keeping the foreign Node intact.
  { argv = ["vp", "env", "off", "node"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["XDG_CONFIG_HOME", "${workspace}/config"], ["PATH", "${workspace}/data/current/bin${PATH_SEPARATOR}${PATH}"]], snapshot = false },
  { argv = ["node", "list-shims.cjs", "shared-bin", "data/fallback-bin"], comment = "System-first Node lives under the data root." },
  { argv = ["node", "-p", "process.execPath.includes('shared-bin')"], envs = [["PATH", "${workspace}/shared-bin${PATH_SEPARATOR}${PATH}"]], comment = "The foreign Node remains executable." },
  { argv = ["node", "-p", "process.env.VP_BIN_DIR === require('node:path').resolve('shared-bin')"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["PATH", "${workspace}/data/fallback-bin${PATH_SEPARATOR}${PATH}"]], comment = "The split fallback executes managed Node with the configured main bin root." },

  # Refresh must retain the saved placement and the foreign executable.
  { argv = ["vp", "env", "setup", "--refresh"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["XDG_CONFIG_HOME", "${workspace}/config"], ["PATH", "${workspace}/data/current/bin${PATH_SEPARATOR}${PATH}"]], snapshot = false },
  { argv = ["node", "list-shims.cjs", "shared-bin", "data/fallback-bin"], comment = "Refresh preserves both placement and the foreign Node." },
  { argv = ["node", "-p", "process.execPath.includes('shared-bin')"], envs = [["PATH", "${workspace}/shared-bin${PATH_SEPARATOR}${PATH}"]], comment = "The foreign Node remains executable." },

  # Switching back removes the fallback without overwriting the foreign Node.
  { argv = ["vp", "env", "on", "node"], envs = [["HOME", "${workspace}/user"], ["VP_HOME", ""], ["VP_BIN_DIR", "${workspace}/shared-bin"], ["VP_DATA_DIR", "${workspace}/data"], ["VP_CACHE_DIR", "${workspace}/cache"], ["XDG_CONFIG_HOME", "${workspace}/config"], ["PATH", "${workspace}/data/current/bin${PATH_SEPARATOR}${PATH}"]], snapshot = false },
  { argv = ["node", "list-shims.cjs", "shared-bin", "data/fallback-bin"], comment = "Managed mode must not overwrite a foreign executable either." },
  { argv = ["node", "-p", "process.execPath.includes('shared-bin')"], envs = [["PATH", "${workspace}/shared-bin${PATH_SEPARATOR}${PATH}"]], comment = "The foreign Node remains executable." },
]

# Bash command-cache behavior needs a persistent Unix shell; placement and recursion run on all platforms.
[[case]]
name = "bash_path_precedence_and_cache"
vp = "global"
skip-platforms = ["windows"]
requires = ["bash"]
steps = [
  { argv = ["bash", "placement.sh"], comment = "Reloading env is idempotent; mode changes invalidate Bash command paths." },
]

[[case]]
name = "vpx_script_follows_vp_node"
vp = "global"
cwd = "vpx-project"
comment = "vpx script mode runs on the Node.js that vp node selects, including system-first mode."
steps = [
  { argv = ["node", "../setup-system-node.cjs"], snapshot = false },
  { argv = ["vp", "env", "on"], snapshot = false },
  { argv = ["vp", "env", "off", "node"], snapshot = false },
  { argv = ["vpx", "--print", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "System-first: the system Node.js found on PATH, as vp node selects." },
  { argv = ["vpx", "--print", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/fallback-bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "A Vite+ shim before system Node.js selects managed Node.js." },
  ["vp", "env", "on", "node"],
  { argv = ["vpx", "--print", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"]], comment = "Managed mode ignores system Node.js." },
]

[[case]]
name = "system_only_overrides_managed_shims"
vp = "global"
comment = "With managed config.json, VP_*_MANAGER=system-only makes the shims use only system tools: no downloads, no network, no cached managed installs, and an unchanged child PATH."
# The pinned pnpm must not switch itself to another version.
env = { npm_config_manage_package_manager_versions = "false" }
steps = [
  { argv = ["node", "setup-system-node.cjs"], snapshot = false },
  { argv = ["node", "setup-system-tools.cjs"], snapshot = false },
  { argv = ["vpt", "write-file", "package.json", '{"packageManager":"pnpm@10.18.0"}'], snapshot = false },
  { argv = ["node", "list-managed.cjs"], comment = "Managed installs before the system-only steps: the pinned runtime is cached, and the override is not." },

  # The unreachable mirror and registry fail any request, and VP_NODE_VERSION would select a managed version.
  { argv = ["node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_VERSION", "24.0.0"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "The node shim runs system Node.js, ignoring the session override and the cached managed runtime." },
  { argv = ["node", "-p", "process.env.PATH === process.env.EXPECTED_PATH"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["EXPECTED_PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "The system Node.js directory is not moved to the front of the child PATH." },
  { argv = ["npm", "--version"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["EXPECTED_PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "npm follows its own (managed) mode: without an npm pin it is the npm beside system Node.js, and the child PATH is unchanged." },

  # Family-specific values take precedence over VP_PM_MANAGER (ADR-2).
  { argv = ["pnpm", "--version"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_PNPM_MANAGER", "system-only"], ["VP_PM_MANAGER", "yes"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "VP_PNPM_MANAGER=system-only wins over VP_PM_MANAGER=yes and over the packageManager pin. Node.js stays managed, so only its directory is added to the child PATH." },
  { argv = ["npm", "--version"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_PNPM_MANAGER", "yes"], ["VP_PM_MANAGER", "system-only"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "VP_PM_MANAGER=system-only applies to families without their own value." },
  { argv = ["node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "System-Only"]], comment = "Only the exact lowercase value is system-only; managed config.json stays in effect." },
  { argv = ["node", "nest-node.cjs"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["NEST_DEPTH", "8"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "Nested calls with the same arguments and cwd still run through 8 shim entries." },
  { argv = ["node", "nest-node.cjs"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["NEST_DEPTH", "9"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "A 9th identical entry is treated as a forwarding loop, so the count reaches nested shims.", continue-on-failure = true },
  { argv = ["node", "list-managed.cjs"], comment = "The system-only steps downloaded nothing." },

  { argv = ["node", "check-managed-pnpm.cjs"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_PNPM_MANAGER", "yes"], ["VP_PM_MANAGER", "system-only"]], comment = "VP_PNPM_MANAGER=yes wins over VP_PM_MANAGER=system-only, so the shim selects the pinned managed pnpm instead of the system one." },
  { argv = ["node", "--version"], envs = [["PATH", "${VP_HOME}/bin"], ["VP_NODE_MANAGER", "system-only"]], comment = "Without a system Node.js on PATH, the shim fails instead of using the managed runtime.", continue-on-failure = true },
]

[[case]]
name = "system_only_child_processes"
vp = "global"
comment = "System-only restrictions hold for what the selected tools run: a `#!/usr/bin/env node` shebang and a nested `npm` resolve from the child PATH, which loses the managed runtime directory whether a parent left it first on PATH or the shim would add it for managed Node.js. A nested managed npm would print its version instead of the system marker."
# The fake npm is a shebang script, and run-shim.cjs starts shims without the `.exe` suffix.
skip-platforms = ["windows"]
steps = [
  { argv = ["node", "setup-system-node.cjs"], snapshot = false },
  { argv = ["node", "setup-child-tools.cjs"], snapshot = false },

  # The seeded runtime for the .node-version pin plays the managed runtime. It is only read:
  # it links the shared seed, so the case cannot plant fake managed tools there.
  # Its npm prints a version where the system npm prints a marker.
  # run-shim.cjs starts the shim by path while the managed runtime is first on PATH.
  # The unreachable mirror and registry fail any request.
  { argv = ["node", "run-shim.cjs", "npm", "nested"], envs = [["PATH", "${VP_HOME}/js_runtime/node/20.18.0/bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_PATH_INJECTED_TOOLS", "node,npm,npx"], ["VP_NODE_MANAGER", "system-only"], ["VP_NPM_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "With the managed runtime inherited first on PATH, system npm runs on system Node.js, and so does its nested npm." },
  { argv = ["node", "run-shim.cjs", "npm", "nested"], envs = [["PATH", "${VP_HOME}/js_runtime/node/20.18.0/bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_PATH_INJECTED_TOOLS", "node"], ["VP_NPM_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "System-only npm on an inherited managed Node.js: Node.js stays managed, and the nested npm is the system one, not the npm bundled with the runtime." },
  { argv = ["npm", "nested"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NPM_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "System-only npm on the pinned managed Node.js: the shim does not expose the runtime directory, so the nested npm is the system one." },
  { argv = ["node", "run-shim.cjs", "npm", "nested"], envs = [["PATH", "${VP_HOME}/js_runtime/node/20.18.0/bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_PATH_INJECTED_TOOLS", "node,npm,npx"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "System-only Node.js with npm in its own (managed) mode: the npm beside system Node.js runs on it, and the nested npm does not reach the npm bundled with the inherited managed runtime." },
  { argv = ["npm", "nested"], envs = [["PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NPM_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "Both system-only without an inherited managed runtime: system npm and its nested npm run on system Node.js." },
  { argv = ["vpx", "node", "-p", "process.execPath.includes('system-bin')"], envs = [["PATH", "${VP_HOME}/js_runtime/node/20.18.0/bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "vpx looks up system-only Node.js on PATH without the inherited managed runtime." },
  { argv = ["vpx", "npm", "nested"], envs = [["PATH", "${VP_HOME}/js_runtime/node/20.18.0/bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NPM_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "vpx looks up system-only npm on PATH without the npm bundled with the inherited managed runtime." },
  { argv = ["node", "run-shim.cjs", "node", "-p", "process.env.PATH === process.env.EXPECTED_PATH"], envs = [["PATH", "${VP_HOME}/js_runtime/node/20.18.0/bin${PATH_SEPARATOR}${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["EXPECTED_PATH", "${VP_HOME}/bin${PATH_SEPARATOR}${workspace}/system-bin${PATH_SEPARATOR}${PATH}"], ["VP_NODE_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "System-only Node.js removes the inherited managed runtime directory from the child PATH and keeps the other entries in order." },
  { argv = ["vpx", "npm", "--version"], envs = [["PATH", "${VP_HOME}/js_runtime/node/20.18.0/bin${PATH_SEPARATOR}${VP_HOME}/bin"], ["VP_NPM_MANAGER", "system-only"], ["VP_NODE_DIST_MIRROR", "http://127.0.0.1:1"], ["NPM_CONFIG_REGISTRY", "http://127.0.0.1:1"]], comment = "Without a system npm, vpx fails instead of running the inherited managed npm or downloading one through dlx.", continue-on-failure = true },
]
