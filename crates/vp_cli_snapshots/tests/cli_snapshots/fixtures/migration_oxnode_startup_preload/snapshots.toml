[[case]]
name = "migration_oxnode_startup_preload"
vp = ["local", "global"]
local-registry = true
env = { VP_NODE_VERSION = "22.23.4" }
unset-env = ["NODE_OPTIONS", "OXC_TRANSFORM_ALL", "VP_SCRIPT_TSCONFIG", "TSX_TSCONFIG_PATH", "OXC_TSCONFIG_PATH", "TS_NODE_PROJECT"]
comment = "Published oxc-node 1.0.1 is needed to compare its startup ordering before and after migration. The local registry supplies it; the JSX dependency is a local fixture."
steps = [
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vp", "run", "run"], comment = "The startup preload enables JSX dependency transforms before the standalone loader initializes." },
  ["vp", "migrate", "--full", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  { argv = ["vpt", "print-file", "package.json", "setup.cjs"], comment = "The ordinary build migrates, while the command with a startup preload and its dependencies stay intact." },
  { argv = ["vpt", "rm", "-rf", "node_modules"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  ["vpt", "stat-file", "node_modules/@oxc-node/cli", "node_modules/@oxc-node/core"],
  ["vp", "run", "build"],
  { argv = ["vp", "run", "run"], comment = "The retained command still transforms its JSX dependency after a fresh install." },
]
