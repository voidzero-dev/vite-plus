[[case]]
name = "shell_integration_cwd_templates"
vp = "global"
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "env", "setup", "--refresh"], envs = [["VP_HOME", "${workspace}/home"]], snapshot = false },
  { argv = ["vpt", "print-file", "home/env"], comment = "POSIX wrapper and zsh vpr completion keep global -C before env use/run" },
  { argv = ["vpt", "print-file", "home/env.fish"], comment = "fish wrapper and vpr completion keep global -C before env use/run" },
  { argv = ["vpt", "print-file", "home/env.nu"], comment = "Nushell wrapper and vpr completion keep global -C before env use/run" },
  { argv = ["vpt", "print-file", "home/env.ps1"], comment = "PowerShell wrapper and vpr completion keep global -C before env use/run" },
]
