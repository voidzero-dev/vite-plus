[[case]]
name = "command_add_npm10"
vp = "global"
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "add", "--help"], comment = "should show help", continue-on-failure = true },
  { argv = ["vp", "add", "testnpm2", "-D", "--", "--no-audit"], comment = "should add package as dev dependencies" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "add", "testnpm2", "test-vite-plus-install", "--allow-build=test-vite-plus-install", "--", "--no-audit"], comment = "reject unsupported --allow-build without adding packages", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "install", "test-vite-plus-package@1.0.0", "--save-peer", "--", "--no-audit"], comment = "should install package alias for add" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "add", "test-vite-plus-package-optional", "-O", "--", "--no-audit"], comment = "should add package as optional dependencies" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "add", "test-vite-plus-package-optional", "--", "--loglevel=warn", "--no-audit"], comment = "support pass through arguments" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
]

[[case]]
name = "npm6_dependency_filters_add"
vp = "global"
env = { npm_config_audit = "false", npm_config_fund = "false" }
steps = [
  { argv = ["vpt", "json-edit", "package.json", "packageManager", "npm@6.14.18"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "dependencies.is-number", "6.0.0"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts", "--silent"], snapshot = false },
  { argv = ["vp", "pm", "pack", "--", "./optional-parent", "--ignore-scripts"], snapshot = false },
  { argv = ["vp", "add", "./optional-parent-1.0.0.tgz", "--ignore-scripts", "--silent"], comment = "without a filter, the optional dependency is installed inside the added package" },
  ["vpt", "stat-file", "node_modules/optional-parent/node_modules/is-number/package.json", "--assert", "file"],
  { argv = ["vpt", "rm", "-rf", "node_modules/optional-parent", "package-lock.json"], snapshot = false },
  ["vp", "add", "./optional-parent-1.0.0.tgz", "--no-optional", "--ignore-scripts", "--silent"],
  ["vpt", "stat-file", "node_modules/optional-parent/package.json", "--assert", "file"],
  ["vpt", "stat-file", "node_modules/optional-parent/node_modules/is-number/package.json", "--assert", "missing"],
  { argv = ["vpt", "rm", "-rf", "node_modules/optional-parent", "package-lock.json"], snapshot = false },
  ["vp", "install", "./optional-parent-1.0.0.tgz", "--no-optional", "--ignore-scripts", "--silent"],
  ["vpt", "stat-file", "node_modules/optional-parent/package.json", "--assert", "file"],
  ["vpt", "stat-file", "node_modules/optional-parent/node_modules/is-number/package.json", "--assert", "missing"],
  ["vpt", "stat-file", "node_modules/is-number/package.json", "--assert", "file"],
]

