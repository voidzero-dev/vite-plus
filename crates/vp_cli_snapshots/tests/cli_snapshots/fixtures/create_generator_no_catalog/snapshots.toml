[[case]]
name = "create_generator_pnpm_no_catalog"
vp = "local"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
comment = "A generator in a workspace without catalog entries installs, runs, and emits a project that passes type checking."
steps = [
  { argv = ["vp", "create", "vite:generator", "--no-interactive", "--directory", "tools/my-generator", "--no-agent", "--no-editor"], snapshot = false, timeout = 120000 },
  { argv = ["vpt", "print-file", "tools/my-generator/package.json"] },
  { argv = ["vp", "install"], snapshot = false, timeout = 120000 },
  { argv = ["vp", "create", "my-generator", "--no-interactive", "--no-agent", "--no-editor", "--", "--directory", "generated", "--name", "generated", "--offline"], snapshot = false, timeout = 120000 },
  { argv = ["vpt", "print-file", "tools/generated/tsconfig.json"] },
  { argv = ["vp", "check", "tools/generated"] },
]

