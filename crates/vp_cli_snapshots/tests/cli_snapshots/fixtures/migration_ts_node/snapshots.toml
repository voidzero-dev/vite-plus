[[case]]
name = "migration_ts_node_scripts"
vp = "local"
comment = "Local stub dependencies keep the runner migration independent of npm packages."
steps = [
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], comment = "transpile-only commands, loaders, and shebangs migrate to vpx" },
  ["vpt", "print-file", "package.json"],
  ["vpt", "print-file", "scripts/release.ts"],
  { argv = ["vp", "run", "seed"], comment = "the migrated script runs TypeScript without ts-node" },
  ["vp", "run", "loader"],
]

[[case]]
name = "migration_ts_node_kept"
vp = "local"
steps = [
  { argv = ["vpt", "json-edit", "package.json", "scripts.checked", "ts-node ./scripts/seed.ts"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], comment = "commands that type-check keep ts-node and explain the difference" },
  ["vpt", "print-file", "package.json"],
]

[[case]]
name = "migration_ts_node_config"
vp = "local"
steps = [
  { argv = ["vpt", "rm", "scripts/release.ts"], snapshot = false },
  { argv = ["vpt", "write-file", "tsconfig.json", "{\"ts-node\":{\"transpileOnly\":true}}\n"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "scripts.seed", "ts-node ./scripts/seed.ts"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], comment = "tsconfig can explicitly disable ts-node type-checking" },
  ["vpt", "print-file", "package.json"],
  ["vp", "run", "seed"],
]

[[case]]
name = "migration_ts_node_already_vite_plus"
vp = "local"
steps = [
  { argv = ["vpt", "json-edit", "package.json", "devDependencies.vite-plus", "latest"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive"], comment = "a plain upgrade leaves ts-node migration to --full" },
  { argv = ["vp", "migrate", "--no-interactive", "--full", "--no-hooks", "--no-agent", "--no-editor"], comment = "--full migrates transpile-only scripts on an existing Vite+ project" },
  ["vpt", "print-file", "package.json"],
  ["vp", "run", "seed"],
]
