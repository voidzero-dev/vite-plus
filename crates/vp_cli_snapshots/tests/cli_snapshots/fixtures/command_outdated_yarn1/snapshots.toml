[[case]]
name = "outdated_supported_formats"
vp = "global"
steps = [
  { argv = ["vp", "outdated", "--format", "table"], comment = "An explicit table remains supported.", continue-on-failure = true },
  { argv = ["vp", "outdated", "--format", "json"], comment = "JSON remains supported, with no output for an empty dependency list.", continue-on-failure = true },
  { argv = ["vp", "outdated"], comment = "Omitting the format still runs Yarn outdated.", continue-on-failure = true },
]

[[case]]
name = "managed_global_outdated_preserves_list"
vp = "global"
steps = [
  { argv = ["vp", "outdated", "-g", "--format", "list"], comment = "Managed global operations bypass project Yarn support checks.", continue-on-failure = true },
]
