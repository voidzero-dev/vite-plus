[[case]]
name = "help"
vp = ["local", "global"]
comment = "Top-level help output, one snapshot per flavor. The parity matrix keeps the two command surfaces honest."
steps = [["vp", "help"]]

[[case]]
name = "vite_help_without_package"
env = { VP_NODE_VERSION = "22.23.4" }
vp = "global"
steps = [
  ["vpt", "stat-file", "package.json", "--assert", "missing"],
  { argv = ["vp", "help", "dev", "--"], timeout = 30000, continue-on-failure = true },
  ["vp", "help", "build", "--"],
]

[[case]]
name = "help_background_job"
vp = "global"
skip-platforms = ["windows"]
requires = ["bash"]
env = { COLORTERM = "truecolor" }
comment = "A background job must not touch the terminal, or SIGTTOU stops it before help is printed. Interactive Bash enables job control, and `wait` returns 150 if the job stops. The shell's stderr is discarded because Bash versions differ in when they report job status."
steps = [
  ["bash", "--noprofile", "--norc", "-ic", 'exec 2>/dev/null; vp --help & wait %1; echo "exit status: $?"'],
]
