[[case]]
name = "default_config"
vp = "global"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
steps = [
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], snapshot = false },
  { argv = ["vpt", "print-file", "postinstall-config.jsonl"], comment = "Both installs run postinstall with a working pnpm root and no added reporting settings." },
]

[[case]]
name = "explicit_override_loads_hooks_only_on_install"
vp = "global"
local-registry = true
env = { VP_PACKAGE_MANAGER = "pnpm@9.15.9", NPM_CONFIG_IGNORE_PNPMFILE = "false" }
unset-env = ["VP_SKIP_INSTALL", "CI"]
steps = [
  { argv = ["vpt", "cp", "record-pnpm-hook.cjs", ".pnpmfile.cjs"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], snapshot = false },
  { argv = ["vpt", "print-file", "pnpm-hook-events"], comment = "The selected pnpm loads the project hook for both installs and skips it during version probes." },
]

[[case]]
name = "configured_reporter"
vp = "global"
local-registry = true
unset-env = ["VP_SKIP_INSTALL", "CI"]
steps = [
  { argv = ["vpt", "write-file", ".npmrc", "reporter=silent\nloglevel=warn\njson=true\nparseable=true\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], snapshot = false },
  { argv = ["vpt", "print-file", "postinstall-config.jsonl", ".npmrc"], comment = "Both installs preserve the project's reporting settings in postinstall and on disk." },
]

[[case]]
name = "silent_failure"
vp = "global"
local-registry = true
env = { VP_TEST_FAIL_POSTINSTALL = "1" }
unset-env = ["VP_SKIP_INSTALL", "CI"]
steps = [
  { argv = ["vpt", "write-file", ".npmrc", "reporter=silent\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], comment = "The migration keeps the postinstall error and exit code without displaying install progress." },
]

[[case]]
name = "warn_failure"
vp = "global"
local-registry = true
env = { VP_TEST_FAIL_POSTINSTALL = "1" }
unset-env = ["VP_SKIP_INSTALL", "CI"]
steps = [
  { argv = ["vpt", "write-file", ".npmrc", "loglevel=warn\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], comment = "Warn-level output keeps the script error and exit code without replaying debug lifecycle events." },
]

[[case]]
name = "json_failure"
vp = "global"
local-registry = true
env = { VP_TEST_FAIL_POSTINSTALL = "1" }
unset-env = ["VP_SKIP_INSTALL", "CI"]
steps = [
  { argv = ["vpt", "write-file", ".npmrc", "json=true\n"], snapshot = false },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"], comment = "The migration keeps pnpm's JSON error object and exit code." },
]
