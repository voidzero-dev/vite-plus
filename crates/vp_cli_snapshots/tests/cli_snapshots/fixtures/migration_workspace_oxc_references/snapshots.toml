[[case]]
name = "migration_workspace_oxc_env_script_module"
vp = ["global", "local"]
local-registry = true
skip-platforms = ["windows"]
steps = [
  { argv = ["vpt", "json-edit", "package.json", "scripts.format", "env NODE_ENV=production node scripts/print-lint-rules.mjs"], snapshot = false },
  { argv = ["vpt", "write-file", ".oxlintrc.json", "{\"rules\":{\"no-console\":\"error\"}}\n"], snapshot = false },
  { argv = ["vpt", "write-file", "scripts/print-lint-rules.mjs", "import lint from '../.oxlintrc.json' with { type: 'json' };\nconsole.log(process.env.NODE_ENV, lint.rules['no-console']);\n"], snapshot = false },
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  { argv = ["vp", "run", "format"] },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"] },
  { argv = ["vpt", "stat-file", ".oxlintrc.json", "--assert", "file"] },
  { argv = ["vpt", "stat-file", "packages/other/.oxfmtrc.json", "--assert", "missing"] },
  { argv = ["vp", "run", "format"] },
  { argv = ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"] },
  { argv = ["vp", "run", "format"] },
]

