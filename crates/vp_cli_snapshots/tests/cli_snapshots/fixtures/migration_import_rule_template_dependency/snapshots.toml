[[case]]
name = "migration_import_rule_template_dependency"
vp = "local"
local-registry = true
comment = "Only the package whose source still imports Vitest needs a direct Vitest dependency."
steps = [
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "templates/starter/demo.test.ts"],
  ["vpt", "print-file", "templates/starter/package.json"],
  ["vpt", "print-file", "packages/app/demo.test.ts"],
  ["vpt", "print-file", "packages/app/package.json"],
  ["vpt", "print-file", "pnpm-workspace.yaml"],
  ["vpt", "stat-file", "templates/starter/node_modules", "--assert", "missing"],
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "templates/starter/package.json"],
  ["vpt", "stat-file", "templates/starter/node_modules/vitest/package.json", "--assert", "file"],
  { cwd = "templates/starter", argv = ["node", "--input-type=module", "-e", "import { test } from 'vitest'; console.log(typeof test);"] },
]

[[case]]
name = "migration_import_rule_preserved_dependency_owners"
vp = "local"
local-registry = true
comment = "An unmanaged template resolves Vitest from its workspace root, and a managed template retains its browser packages while the app uses Vite+."
steps = [
  { argv = ["vpt", "replace-file-content", "pnpm-workspace.yaml", "templates/*", "templates/starter"], snapshot = false },
  { argv = ["vpt", "json-edit", "package.json", "devDependencies.vitest", "^5.0.0"], snapshot = false },
  { argv = ["vpt", "write-file", "templates/unmanaged/package.json", "{\"name\":\"unmanaged-template\",\"private\":true}"], snapshot = false },
  { argv = ["vpt", "cp", "templates/starter/demo.test.ts", "templates/unmanaged/demo.test.ts"], snapshot = false },
  { argv = ["vpt", "json-edit", "templates/starter/package.json", "devDependencies.@vitest/browser", "^5.0.0"], snapshot = false },
  { argv = ["vpt", "json-edit", "templates/starter/package.json", "devDependencies.@vitest/browser-preview", "^5.0.0"], snapshot = false },
  { argv = ["vpt", "write-file", "templates/starter/browser.test.ts", "import { page } from '@vitest/browser/context';\nimport '@vitest/browser-preview';\nexport { page };\n"], snapshot = false },
  { argv = ["vpt", "json-edit", "packages/app/package.json", "devDependencies.@vitest/browser", "^5.0.0"], snapshot = false },
  { argv = ["vpt", "json-edit", "packages/app/package.json", "devDependencies.@vitest/browser-preview", "^5.0.0"], snapshot = false },
  { argv = ["vpt", "cp", "templates/starter/browser.test.ts", "packages/app/browser.test.ts"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "templates/unmanaged/demo.test.ts", "package.json"],
  ["vpt", "print-file", "templates/starter/browser.test.ts", "templates/starter/package.json"],
  ["vpt", "print-file", "packages/app/demo.test.ts", "packages/app/browser.test.ts", "packages/app/package.json"],
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  { argv = ["vp", "install", "--frozen-lockfile", "--ignore-scripts"], snapshot = false },
  ["vpt", "stat-file", "node_modules/vitest/package.json", "templates/starter/node_modules/@vitest/browser/package.json", "templates/starter/node_modules/@vitest/browser-preview/package.json", "--assert", "file"],
  ["vpt", "stat-file", "templates/unmanaged/node_modules/vitest/package.json", "packages/app/node_modules/@vitest/browser/package.json", "packages/app/node_modules/@vitest/browser-preview/package.json", "--assert", "missing"],
  { cwd = "templates/unmanaged", argv = ["node", "--input-type=module", "-e", "import { statSync } from 'node:fs'; console.log(statSync(new URL(import.meta.resolve('vitest'))).isFile());"] },
  { cwd = "templates/starter", argv = ["node", "--input-type=module", "-e", "import { statSync } from 'node:fs'; for (const name of process.argv.slice(1)) console.log(name, statSync(new URL(import.meta.resolve(name))).isFile());", "@vitest/browser/context", "@vitest/browser-preview"] },
]

[[case]]
name = "migration_import_rule_tsdown_pack"
vp = "local"
local-registry = true
comment = "Both libraries build with vp pack after migration. The template keeps its Vitest import."
steps = [
  { argv = ["vpt", "json-edit", "templates/starter/package.json", "devDependencies.tsdown", "^0.23.0"], snapshot = false },
  { argv = ["vpt", "json-edit", "packages/app/package.json", "devDependencies.tsdown", "^0.23.0"], snapshot = false },
  { argv = ["vpt", "write-file", "templates/starter/tsdown.config.mjs", "import { defineConfig } from 'tsdown';\nexport default defineConfig({ entry: ['index.ts'], fixedExtension: true });\n"], snapshot = false },
  { argv = ["vpt", "cp", "templates/starter/tsdown.config.mjs", "packages/app/tsdown.config.mjs"], snapshot = false },
  { argv = ["vpt", "write-file", "templates/starter/index.ts", "export const answer = 42;\n"], snapshot = false },
  { argv = ["vpt", "cp", "templates/starter/index.ts", "packages/app/index.ts"], snapshot = false },
  ["vp", "migrate", "--no-interactive", "--no-hooks", "--no-agent", "--no-editor"],
  ["vpt", "print-file", "templates/starter/tsdown.config.mjs", "templates/starter/demo.test.ts"],
  ["vpt", "print-file", "packages/app/tsdown.config.mjs", "packages/app/demo.test.ts"],
  ["vpt", "stat-file", "templates/starter/node_modules", "packages/app/node_modules", "--assert", "missing"],
  { argv = ["vp", "install", "--ignore-scripts"], snapshot = false },
  ["vpt", "stat-file", "templates/starter/node_modules/tsdown", "packages/app/node_modules/tsdown", "--assert", "missing"],
  { cwd = "packages/app", argv = ["vp", "pack"], snapshot = false },
  ["vpt", "stat-file", "packages/app/dist/index.mjs", "--assert", "file"],
  { cwd = "templates/starter", argv = ["vp", "pack"], snapshot = false },
  ["vpt", "stat-file", "templates/starter/dist/index.mjs", "--assert", "file"],
]
