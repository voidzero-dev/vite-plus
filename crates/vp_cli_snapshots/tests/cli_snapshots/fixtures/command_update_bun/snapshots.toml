[[case]]
name = "command_update_bun"
vp = "global"
skip-platforms = ["windows"]
steps = [
  { argv = ["vp", "update", "--help"], comment = "should show help", continue-on-failure = true },
  { argv = ["vp", "update", "testnpm2", "--workspace-root"], comment = "reject unsupported --workspace-root without updating dependencies", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "up", "testnpm2", "--latest"], comment = "should update to absolute latest version" },
  { argv = ["vpt", "print-file", "package.json"], continue-on-failure = true },
  { argv = ["vp", "update", "--prod"], comment = "Reject production dependency selection before Bun 1.4.", continue-on-failure = true },
  { argv = ["vp", "update", "--no-optional"], comment = "Reject optional dependency exclusion before Bun 1.4.", continue-on-failure = true },
  { argv = ["vp", "update", "--recursive"], comment = "Reject recursive updates before Bun 1.4.", continue-on-failure = true },
  { argv = ["vp", "update", "--filter", "app"], comment = "Reject filtered updates before Bun 1.4.", continue-on-failure = true },
  { argv = ["vp", "update", "--interactive", "--recursive"], comment = "Interactive updates use the same Bun version requirement.", continue-on-failure = true },
  { argv = ["vp", "update", "--interactive", "--filter", "app"], continue-on-failure = true },
]
