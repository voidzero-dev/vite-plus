[[case]]
name = "migration_upgrade_pnpm_bundled_catalog_dep"
vp = "global"
steps = [
  { argv = ["vp", "migrate", "--no-interactive"], comment = "Upgrade a project that declares bundled tools and the previous lint backend through the pnpm catalog.", continue-on-failure = true },
  { argv = ["vpt", "print-file", "package.json"], comment = "Check that the manifest has no dangling catalog references.", continue-on-failure = true },
  { argv = ["vpt", "print-file", "pnpm-workspace.yaml"], comment = "Check that the catalog entries are removed.", continue-on-failure = true },
]
